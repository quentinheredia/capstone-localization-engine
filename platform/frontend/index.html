<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPS Platform — Indoor Positioning System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#3d3929",
              "ink-secondary": "#6b6456",
              panel: "#faf9f5",
              surface: "#f3f0e8",
              "surface-dim": "#ebe7dd",
              accent: "#ae5630",
              "accent-dim": "#944a29",
              "accent-light": "#ae563018",
              success: "#2e7d5b",
              warn: "#b8860b",
              danger: "#c0392b",
              muted: "#8b8579",
              sidebar: "#2f2f2f",
              "sidebar-hover": "#3a3a3a",
              "sidebar-active": "#454545",
              "sidebar-text": "#a3a3a3",
              "sidebar-text-active": "#e8e8e8",
              border: "#ddd8cc",
              "border-dim": "#cec8ba",
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap");
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Crimson Pro", "Georgia", serif;
      }
      code,
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .fade-in {
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .pulse-dot {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      svg text {
        user-select: none;
      }
      ::selection {
        background: #ae563040;
      }
      input:focus,
      select:focus,
      textarea:focus {
        box-shadow: 0 0 0 2px #ae563030;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cec8ba;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b5ae9f;
      }
    </style>
  </head>
  <body class="bg-surface text-ink min-h-screen antialiased">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib)
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>

    <script>
      const React = window.React;
      const { createRoot } = window.ReactDOM;
      const {
        useState,
        useEffect,
        useCallback,
        useRef,
        useMemo,
        createElement: h,
        Fragment,
      } = React;

      // ─── CONFIG ──────────────────────────────────────────────────────────
      const PLATFORM_API =
        window.__IPS_PLATFORM_API || "http://localhost:8080/api/v1";
      const ENGINE_API = window.__IPS_ENGINE_API || "http://localhost:8000";

      // ─── API CLIENT ──────────────────────────────────────────────────────
      async function api(base, path, opts = {}) {
        const { method = "GET", body, params } = opts;
        let url = `${base}${path}`;
        if (params) {
          const sp = new URLSearchParams();
          Object.entries(params).forEach(([k, v]) => {
            if (v != null) sp.set(k, String(v));
          });
          const qs = sp.toString();
          if (qs) url += `?${qs}`;
        }
        const headers = {};
        if (body) headers["Content-Type"] = "application/json";
        const res = await fetch(url, {
          method,
          headers,
          body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 204) return null;
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`${res.status} ${res.statusText}: ${text}`);
        }
        return res.json();
      }

      const platform = {
        // Campuses
        listCampuses: () => api(PLATFORM_API, "/campuses"),
        createCampus: (d) =>
          api(PLATFORM_API, "/campuses", { method: "POST", body: d }),
        deleteCampus: (id) =>
          api(PLATFORM_API, `/campuses/${id}`, { method: "DELETE" }),
        // Buildings
        listBuildings: (cid) => api(PLATFORM_API, `/campuses/${cid}/buildings`),
        createBuilding: (cid, d) =>
          api(PLATFORM_API, `/campuses/${cid}/buildings`, {
            method: "POST",
            body: d,
          }),
        deleteBuilding: (id) =>
          api(PLATFORM_API, `/buildings/${id}`, { method: "DELETE" }),
        // Floors
        listFloors: (bid) => api(PLATFORM_API, `/buildings/${bid}/floors`),
        createFloor: (bid, d) =>
          api(PLATFORM_API, `/buildings/${bid}/floors`, {
            method: "POST",
            body: d,
          }),
        deleteFloor: (id) =>
          api(PLATFORM_API, `/floors/${id}`, { method: "DELETE" }),
        getFloor: (id) => api(PLATFORM_API, `/floors/${id}`),
        // Rooms
        listRooms: (fid) => api(PLATFORM_API, `/floors/${fid}/rooms`),
        createRoom: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/rooms`, {
            method: "POST",
            body: d,
          }),
        deleteRoom: (id) =>
          api(PLATFORM_API, `/rooms/${id}`, { method: "DELETE" }),
        updateRoom: (id, d) =>
          api(PLATFORM_API, `/rooms/${id}`, { method: "PATCH", body: d }),
        // Anchors
        listAnchors: (fid) => api(PLATFORM_API, `/floors/${fid}/anchors`),
        listAllAnchors: (p) => api(PLATFORM_API, "/anchors", { params: p }),
        registerAnchor: (d) =>
          api(PLATFORM_API, "/anchors", { method: "POST", body: d }),
        createAnchor: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/anchors`, {
            method: "POST",
            body: d,
          }),
        deleteAnchor: (id) =>
          api(PLATFORM_API, `/anchors/${id}`, { method: "DELETE" }),
        updateAnchor: (id, d) =>
          api(PLATFORM_API, `/anchors/${id}`, { method: "PATCH", body: d }),
        // Tags
        listTags: (p) => api(PLATFORM_API, "/tags", { params: p }),
        createTag: (d) =>
          api(PLATFORM_API, "/tags", { method: "POST", body: d }),
        deleteTag: (id) =>
          api(PLATFORM_API, `/tags/${id}`, { method: "DELETE" }),
        updateTag: (id, d) =>
          api(PLATFORM_API, `/tags/${id}`, { method: "PATCH", body: d }),
        // Logs
        listCrossings: (p) => api(PLATFORM_API, "/crossings", { params: p }),
        listAlerts: (p) => api(PLATFORM_API, "/alerts", { params: p }),
        ackAlert: (id, by) =>
          api(PLATFORM_API, `/alerts/${id}/ack`, {
            method: "POST",
            body: { acknowledged_by: by },
          }),
        // Engine logs (stored in platform DB by background tasks)
        listEngineLogs: (p) => api(PLATFORM_API, "/engine-logs", { params: p }),
        ackEngineLog: (id, by) =>
          api(PLATFORM_API, `/engine-logs/${id}/ack`, {
            method: "POST",
            body: { acknowledged_by: by },
          }),
        clearEngineLogs: (hours) =>
          api(PLATFORM_API, "/engine-logs", {
            method: "DELETE",
            params: hours != null ? { older_than_hours: hours } : {},
          }),
        // Config / Engine
        generateConfig: (p) =>
          api(PLATFORM_API, "/config/generate", { method: "POST", params: p }),
        startEngine: (p) =>
          api(PLATFORM_API, "/engine/start", { method: "POST", params: p }),
        stopEngine: () => api(PLATFORM_API, "/engine/stop", { method: "POST" }),
        engineStatus: () => api(PLATFORM_API, "/engine/status"),
        // Floor Plan Editor
        getEditorData: (fid) => api(PLATFORM_API, `/floors/${fid}/editor-data`),
        saveEditorData: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/editor-data`, {
            method: "PUT",
            body: d,
          }),
        syncEditorRooms: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/editor-sync-rooms`, {
            method: "POST",
            body: d,
          }),
        copyFloorplan: (fid, srcId) =>
          api(PLATFORM_API, `/floors/${fid}/copy-from/${srcId}`, {
            method: "POST",
          }),
        uploadEditorPdf: async (fid, file) => {
          const fd = new FormData();
          fd.append("file", file);
          const res = await fetch(`${PLATFORM_API}/floors/${fid}/editor-pdf`, {
            method: "POST",
            body: fd,
          });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t);
          }
          return res.json();
        },
        getEditorPdfUrl: (fid) => `${PLATFORM_API}/floors/${fid}/editor-pdf`,
        deleteEditorPdf: (fid) =>
          api(PLATFORM_API, `/floors/${fid}/editor-pdf`, { method: "DELETE" }),
        // Access Levels
        listAccessLevels: (bid) =>
          api(PLATFORM_API, `/buildings/${bid}/access-levels`),
        createAccessLevel: (bid, d) =>
          api(PLATFORM_API, `/buildings/${bid}/access-levels`, {
            method: "POST",
            body: d,
          }),
        updateAccessLevel: (id, d) =>
          api(PLATFORM_API, `/access-levels/${id}`, {
            method: "PATCH",
            body: d,
          }),
        deleteAccessLevel: (id) =>
          api(PLATFORM_API, `/access-levels/${id}`, { method: "DELETE" }),
      };

      const engine = {
        health: () => api(ENGINE_API, "/health"),
        status: () => api(ENGINE_API, "/status"),
        map: (method) =>
          api(ENGINE_API, "/map", { params: method ? { method } : {} }),
        devices: () => api(ENGINE_API, "/devices"),
        decisions: (limit) =>
          api(ENGINE_API, "/decisions", { params: { limit } }),
        decisionsByMethod: (method, limit) =>
          api(ENGINE_API, `/decisions/${method}`, { params: { limit } }),
        raw: () => api(ENGINE_API, "/raw"),
        logs: (p) => api(ENGINE_API, "/logs", { params: p }),
      };

      // ─── SHARED COMPONENTS ───────────────────────────────────────────────

      function Badge({ color = "gray", children }) {
        const colors = {
          green: "bg-emerald-50 text-emerald-800 border border-emerald-200",
          red: "bg-red-50 text-red-800 border border-red-200",
          yellow: "bg-amber-50 text-amber-800 border border-amber-200",
          blue: "bg-sky-50 text-sky-800 border border-sky-200",
          gray: "bg-surface-dim text-ink-secondary border border-border",
          purple: "bg-violet-50 text-violet-800 border border-violet-200",
        };
        return h(
          "span",
          {
            className: `inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${colors[color] || colors.gray}`,
          },
          children,
        );
      }

      function Button({
        variant = "primary",
        size = "md",
        disabled,
        onClick,
        children,
        className = "",
      }) {
        const base =
          "inline-flex items-center justify-center font-medium rounded-md transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-accent disabled:opacity-40 disabled:cursor-not-allowed";
        const variants = {
          primary: "bg-accent text-white hover:bg-accent-dim shadow-sm",
          secondary:
            "bg-surface-dim text-ink border border-border hover:bg-panel",
          danger:
            "bg-red-50 text-danger border border-red-200 hover:bg-red-100",
          ghost: "text-ink-secondary hover:bg-surface-dim hover:text-ink",
        };
        const sizes = {
          sm: "px-2.5 py-1 text-xs",
          md: "px-4 py-2 text-sm",
          lg: "px-5 py-2.5 text-sm",
        };
        return h(
          "button",
          {
            className: `${base} ${variants[variant]} ${sizes[size]} ${className}`,
            disabled,
            onClick,
          },
          children,
        );
      }

      function Input({
        label,
        type = "text",
        value,
        onChange,
        placeholder,
        required,
        className = "",
        ...rest
      }) {
        return h(
          "div",
          { className: `${className}` },
          label &&
            h(
              "label",
              {
                className:
                  "block text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
              },
              label,
            ),
          h("input", {
            type,
            value,
            onChange: (e) => onChange(e.target.value),
            placeholder,
            required,
            className:
              "w-full px-3 py-2 bg-panel border border-border rounded-md text-sm text-ink placeholder-muted focus:border-accent outline-none transition",
            ...rest,
          }),
        );
      }

      function Select({ label, value, onChange, options, className = "" }) {
        return h(
          "div",
          { className },
          label &&
            h(
              "label",
              { className: "block text-sm font-medium text-gray-700 mb-1" },
              label,
            ),
          h(
            "select",
            {
              value,
              onChange: (e) => onChange(e.target.value),
              className:
                "w-full px-3 py-2 bg-panel border border-border rounded-md text-sm text-ink focus:border-accent outline-none transition",
            },
            options.map((o) =>
              h("option", { key: o.value, value: o.value }, o.label),
            ),
          ),
        );
      }

      function Card({ title, actions, children, className = "" }) {
        return h(
          "div",
          {
            className: `bg-panel rounded-lg border border-border ${className}`,
          },
          (title || actions) &&
            h(
              "div",
              {
                className:
                  "flex items-center justify-between px-5 py-3.5 border-b border-border",
              },
              title &&
                h("h3", { className: "text-lg font-semibold text-ink" }, title),
              actions &&
                h("div", { className: "flex items-center gap-2" }, actions),
            ),
          h("div", { className: "p-5" }, children),
        );
      }

      function EmptyState({
        icon = "\uD83D\uDCED",
        title,
        description,
        action,
      }) {
        return h(
          "div",
          { className: "text-center py-14" },
          h("div", { className: "text-3xl mb-3 opacity-60" }, icon),
          h("h3", { className: "font-medium text-ink mb-1" }, title),
          description &&
            h(
              "p",
              { className: "text-sm text-muted mb-4 max-w-xs mx-auto" },
              description,
            ),
          action,
        );
      }

      function LoadingSpinner() {
        return h(
          "div",
          { className: "flex items-center justify-center py-12" },
          h("div", {
            className:
              "w-7 h-7 border-2 border-accent border-t-transparent rounded-full animate-spin",
          }),
        );
      }

      function ErrorBanner({ message, onRetry }) {
        return h(
          "div",
          {
            className:
              "bg-red-50 border border-red-200 rounded-md p-4 flex items-center justify-between",
          },
          h(
            "div",
            { className: "flex items-center gap-2" },
            h("span", { className: "text-danger" }, "\u26A0"),
            h("span", { className: "text-sm text-danger" }, message),
          ),
          onRetry &&
            h(
              Button,
              { variant: "ghost", size: "sm", onClick: onRetry },
              "Retry",
            ),
        );
      }

      function StatusDot({ status }) {
        const color =
          status === "online"
            ? "bg-emerald-400"
            : status === "polling"
              ? "bg-amber-400 pulse-dot"
              : "bg-gray-300";
        return h("span", {
          className: `inline-block w-2 h-2 rounded-full ${color}`,
        });
      }

      // ─── HOOKS ───────────────────────────────────────────────────────────

      function useApi(fn, deps = []) {
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const reload = useCallback(async () => {
          setLoading(true);
          setError(null);
          try {
            setData(await fn());
          } catch (e) {
            setError(e.message);
          } finally {
            setLoading(false);
          }
        }, deps);
        useEffect(() => {
          reload();
        }, [reload]);
        return { data, loading, error, reload };
      }

      function usePolling(fn, intervalMs, deps = []) {
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);
        useEffect(() => {
          let active = true;
          const tick = async () => {
            try {
              const d = await fn();
              if (active) {
                setData(d);
                setError(null);
              }
            } catch (e) {
              if (active) setError(e.message);
            }
          };
          tick();
          const id = setInterval(tick, intervalMs);
          return () => {
            active = false;
            clearInterval(id);
          };
        }, deps);
        return { data, error };
      }

      // ─── NAV / LAYOUT ────────────────────────────────────────────────────

      const PAGES = [
        { id: "wizard", label: "Setup", icon: "\u2699\uFE0F" },
        { id: "localize", label: "Localization", icon: "\uD83C\uDFF7\uFE0F" },
        { id: "map", label: "Map", icon: "\uD83D\uDDFA\uFE0F" },
        { id: "devices", label: "Devices", icon: "\uD83D\uDCE1" },
        { id: "logs", label: "Logs", icon: "\uD83D\uDCCB" },
      ];

      function Sidebar({ page, setPage, engineHealth }) {
        return h(
          "aside",
          {
            className:
              "w-60 bg-sidebar flex flex-col h-screen fixed left-0 top-0 z-10",
          },
          // Header
          h(
            "div",
            { className: "px-5 py-5" },
            h(
              "div",
              {
                className:
                  "text-sidebar-text-active text-lg font-semibold tracking-tight",
                style: { fontFamily: "'Crimson Pro', Georgia, serif" },
              },
              "IPS Platform",
            ),
            h(
              "div",
              { className: "text-xs text-sidebar-text mt-0.5 tracking-wide" },
              "Indoor Positioning",
            ),
          ),
          // Nav
          h(
            "nav",
            { className: "flex-1 px-3 py-2 space-y-0.5" },
            PAGES.map((p) =>
              h(
                "button",
                {
                  key: p.id,
                  onClick: () => setPage(p.id),
                  className: `w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-all duration-150 ${
                    page === p.id
                      ? "bg-sidebar-active text-sidebar-text-active font-medium"
                      : "text-sidebar-text hover:bg-sidebar-hover hover:text-sidebar-text-active"
                  }`,
                },
                h("span", { className: "text-base" }, p.icon),
                p.label,
              ),
            ),
          ),
          // Engine status
          h(
            "div",
            { className: "px-5 py-4 border-t border-white/10" },
            h(
              "div",
              { className: "flex items-center gap-2 text-xs" },
              h(StatusDot, { status: engineHealth?.ok ? "online" : "offline" }),
              h(
                "span",
                { className: "text-sidebar-text" },
                engineHealth?.ok ? "Engine online" : "Engine offline",
              ),
            ),
            engineHealth?.poll_running &&
              h(
                "div",
                { className: "flex items-center gap-2 text-xs mt-1.5" },
                h(StatusDot, { status: "polling" }),
                h("span", { className: "text-sidebar-text" }, "Polling active"),
              ),
          ),
        );
      }

      function Layout({ page, setPage, engineHealth, children }) {
        return h(
          "div",
          { className: "flex" },
          h(Sidebar, { page, setPage, engineHealth }),
          h(
            "main",
            { className: "flex-1 ml-60 min-h-screen bg-surface" },
            h("div", { className: "max-w-6xl mx-auto px-8 py-8" }, children),
          ),
        );
      }

      // ═════════════════════════════════════════════════════════════════════
      // PAGE: SETUP WIZARD
      // ═════════════════════════════════════════════════════════════════════

      const WIZARD_STEPS = [
        "Campus",
        "Building",
        "Floor",
        "Floor Plan",
        "Anchors",
      ];

      function SetupWizard() {
        const [step, setStep] = useState(0);
        const [selectedCampus, setSelectedCampus] = useState(null);
        const [selectedBuilding, setSelectedBuilding] = useState(null);
        const [selectedFloor, setSelectedFloor] = useState(null);

        return h(
          "div",
          { className: "fade-in" },
          h(
            "div",
            { className: "mb-6" },
            h(
              "h1",
              { className: "text-2xl font-semibold text-ink" },
              "Setup Wizard",
            ),
            h(
              "p",
              { className: "text-muted text-sm mt-1" },
              "Configure your indoor positioning hierarchy",
            ),
          ),
          // Stepper
          h(
            "div",
            { className: "flex items-center gap-1 mb-8" },
            WIZARD_STEPS.map((s, i) =>
              h(
                Fragment,
                { key: s },
                h(
                  "button",
                  {
                    onClick: () => {
                      if (i <= step) setStep(i);
                    },
                    className: `flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-all duration-150 ${
                      i === step
                        ? "bg-accent text-white shadow-sm"
                        : i < step
                          ? "bg-accent-light text-accent cursor-pointer border border-accent/20"
                          : "bg-surface-dim text-muted"
                    }`,
                  },
                  h(
                    "span",
                    {
                      className:
                        "w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs",
                    },
                    i < step ? "\u2713" : i + 1,
                  ),
                  s,
                ),
                i < WIZARD_STEPS.length - 1 &&
                  h("div", {
                    className: `flex-1 h-px max-w-8 ${i < step ? "bg-emerald-300" : "bg-gray-200"}`,
                  }),
              ),
            ),
          ),
          // Step content
          step === 0 &&
            h(WizardCampus, {
              onSelect: (c) => {
                setSelectedCampus(c);
                setStep(1);
              },
            }),
          step === 1 &&
            h(WizardBuilding, {
              campus: selectedCampus,
              onSelect: (b) => {
                setSelectedBuilding(b);
                setStep(2);
              },
              onBack: () => setStep(0),
            }),
          step === 2 &&
            h(WizardFloor, {
              building: selectedBuilding,
              onSelect: (f) => {
                setSelectedFloor(f);
                setStep(3);
              },
              onBack: () => setStep(1),
            }),
          step === 3 &&

      // ── Floor Plan Editor ─────────────────────────────────────────────────
      // Interactive SVG canvas: place points, draw lines, define rooms,
      // trace over PDF backgrounds, fingerprint grid, access levels.

      let _fpId = 1;
      const fpId = (pfx) => `${pfx}${_fpId++}`;

      function FloorPlanEditor({ floor, building, onNext, onBack }) {
        // Editor state
        const [points, setPoints] = useState([]);
        const [lines, setLines] = useState([]);
        const [editorRooms, setEditorRooms] = useState([]);
        const [tool, setTool] = useState("point");
        const [selected, setSelected] = useState(null);
        const [lineStart, setLineStart] = useState(null);
        const [roomPts, setRoomPts] = useState([]);
        const [pdfDataUrl, setPdfDataUrl] = useState(null);
        const [pdfOpacity, setPdfOpacity] = useState(0.3);
        const [pdfScale, setPdfScale] = useState(1.0);
        const [pdfOffsetX, setPdfOffsetX] = useState(0);
        const [pdfOffsetY, setPdfOffsetY] = useState(0);
        const [hasPdf, setHasPdf] = useState(false);
        const [accessLevels, setAccessLevels] = useState([]);
        const [gridSize, setGridSize] = useState(
          floor.default_grid_size_m || 1.0,
        );
        const [showGrid, setShowGrid] = useState(false);
        const [showEditorGrid, setShowEditorGrid] = useState(true);
        const [snapGrid, setSnapGrid] = useState(true);
        const [saving, setSaving] = useState(false);
        const [dirty, setDirty] = useState(false);
        const [editLength, setEditLength] = useState("");
        const [roomName, setRoomName] = useState("");
        const [alForm, setAlForm] = useState({ name: "", color: "#6b7280" });
        const [copyFloorId, setCopyFloorId] = useState("");
        const [allFloors, setAllFloors] = useState([]);
        const [dragPt, setDragPt] = useState(null);
        const [dragStart, setDragStart] = useState(null);

        const svgRef = useRef(null);
        const [dims, setDims] = useState({ w: 900, h: 600 });

        const fw = floor.width_m || 20;
        const fh = floor.height_m || 15;
        const PADDING = 40;

        // Responsive sizing
        useEffect(() => {
          const ro = new ResizeObserver((entries) => {
            for (const e of entries) {
              const w = e.contentRect.width;
              if (w > 0) {
                const aspect = fh / fw;
                setDims({ w, h: Math.max(350, w * aspect) });
              }
            }
          });
          if (svgRef.current?.parentElement)
            ro.observe(svgRef.current.parentElement);
          return () => ro.disconnect();
        }, [fw, fh]);

        const scaleX = (dims.w - PADDING * 2) / fw;
        const scaleY = (dims.h - PADDING * 2) / fh;
        const sc = Math.min(scaleX, scaleY);
        const tx = (v) => PADDING + v * sc;
        const ty = (v) => PADDING + v * sc;
        const fromSvgX = (px) => (px - PADDING) / sc;
        const fromSvgY = (py) => (py - PADDING) / sc;

        const SNAP = 0.15; // metres
        const snapToPoint = (wx, wy) => {
          for (const p of points) {
            if (Math.abs(p.x - wx) < SNAP && Math.abs(p.y - wy) < SNAP)
              return p;
          }
          return null;
        };

        // Snap coordinates to nearest grid intersection
        const snapToGrid = (wx, wy) => {
          if (!snapGrid)
            return {
              x: Math.round(wx * 100) / 100,
              y: Math.round(wy * 100) / 100,
            };
          const gs = gridSize;
          return {
            x: Math.round(wx / gs) * gs,
            y: Math.round(wy / gs) * gs,
          };
        };

        // Apply right-angle constraint from a reference point
        const applyRightAngle = (wx, wy, refX, refY) => {
          const dx = Math.abs(wx - refX);
          const dy = Math.abs(wy - refY);
          if (dx > dy) return { x: wx, y: refY }; // more horizontal → lock Y
          return { x: refX, y: wy }; // more vertical → lock X
        };

        // Load data on mount
        useEffect(() => {
          platform
            .getEditorData(floor.id)
            .then((res) => {
              const d = res.data || {};
              if (d.points?.length) {
                setPoints(d.points);
                _fpId =
                  Math.max(
                    _fpId,
                    ...d.points.map(
                      (p) => parseInt(p.id.replace(/\D/g, "")) || 0,
                    ),
                  ) + 1;
              }
              if (d.lines?.length) {
                setLines(d.lines);
                _fpId =
                  Math.max(
                    _fpId,
                    ...d.lines.map(
                      (l) => parseInt(l.id.replace(/\D/g, "")) || 0,
                    ),
                  ) + 1;
              }
              if (d.rooms?.length) {
                setEditorRooms(d.rooms);
                _fpId =
                  Math.max(
                    _fpId,
                    ...d.rooms.map(
                      (r) => parseInt(r.id.replace(/\D/g, "")) || 0,
                    ),
                  ) + 1;
              }
              if (res.default_grid_size_m) setGridSize(res.default_grid_size_m);
              setHasPdf(!!res.has_pdf);
            })
            .catch(() => {});
          if (building) {
            platform
              .listAccessLevels(building.id)
              .then(setAccessLevels)
              .catch(() => {});
            platform
              .listFloors(building.id)
              .then((f) => setAllFloors(f.filter((fl) => fl.id !== floor.id)))
              .catch(() => {});
          }
        }, [floor.id]);

        // Load PDF background
        useEffect(() => {
          if (!hasPdf) return;
          const url = platform.getEditorPdfUrl(floor.id);
          if (window.pdfjsLib) {
            pdfjsLib
              .getDocument(url)
              .promise.then((pdf) => pdf.getPage(1))
              .then((page) => {
                const vp = page.getViewport({ scale: 2 });
                const canvas = document.createElement("canvas");
                canvas.width = vp.width;
                canvas.height = vp.height;
                page
                  .render({
                    canvasContext: canvas.getContext("2d"),
                    viewport: vp,
                  })
                  .promise.then(() => {
                    setPdfDataUrl(canvas.toDataURL("image/png"));
                  });
              })
              .catch(() => {});
          }
        }, [hasPdf, floor.id]);

        // Mark dirty on changes
        const markDirty = () => setDirty(true);

        // SVG click handler
        const handleSvgClick = (e) => {
          if (dragPt) return; // was a drag, not a click
          const svgEl = svgRef.current;
          if (!svgEl) return;
          const rect = svgEl.getBoundingClientRect();
          const wx = fromSvgX(((e.clientX - rect.left) / rect.width) * dims.w);
          const wy = fromSvgY(((e.clientY - rect.top) / rect.height) * dims.h);

          if (wx < 0 || wx > fw || wy < 0 || wy > fh) return;

          if (tool === "point") {
            const existing = snapToPoint(wx, wy);
            if (existing) {
              setSelected({ type: "point", id: existing.id });
              return;
            }
            const snapped = snapToGrid(wx, wy);
            const np = {
              id: fpId("p"),
              x: Math.max(0, Math.min(fw, snapped.x)),
              y: Math.max(0, Math.min(fh, snapped.y)),
            };
            setPoints((prev) => [...prev, np]);
            setSelected({ type: "point", id: np.id });
            markDirty();
          } else if (tool === "line") {
            // Compute snapped position: right-angle from lineStart, then grid snap
            let tx2 = wx,
              ty2 = wy;
            const startPt = lineStart
              ? points.find((p) => p.id === lineStart)
              : null;
            if (startPt) {
              const ra = applyRightAngle(wx, wy, startPt.x, startPt.y);
              tx2 = ra.x;
              ty2 = ra.y;
            }
            const gs2 = snapToGrid(tx2, ty2);
            tx2 = Math.max(0, Math.min(fw, gs2.x));
            ty2 = Math.max(0, Math.min(fh, gs2.y));

            // Prefer an existing nearby point; otherwise create one at snapped pos
            let hit = snapToPoint(tx2, ty2) || snapToPoint(wx, wy);
            if (!hit) {
              if (!lineStart) {
                // No start yet and no existing point nearby — create one at grid snap
                hit = { id: fpId("p"), x: tx2, y: ty2 };
                setPoints((prev) => [...prev, hit]);
                markDirty();
              } else {
                // Have a start — create endpoint at right-angle + grid snap
                hit = { id: fpId("p"), x: tx2, y: ty2 };
                setPoints((prev) => [...prev, hit]);
                markDirty();
              }
            }

            if (!lineStart) {
              setLineStart(hit.id);
            } else if (hit.id !== lineStart) {
              const pA = points.find((p) => p.id === lineStart) || startPt;
              const nl = {
                id: fpId("l"),
                from: lineStart,
                to: hit.id,
                length_m: pA
                  ? Math.round(Math.hypot(hit.x - pA.x, hit.y - pA.y) * 100) /
                    100
                  : 0,
              };
              setLines((prev) => [...prev, nl]);
              setSelected({ type: "line", id: nl.id });
              setEditLength(String(nl.length_m));
              setLineStart(null);
              markDirty();
            }
          } else if (tool === "room") {
            const gs3 = snapToGrid(wx, wy);
            const hit = snapToPoint(wx, wy) || snapToPoint(gs3.x, gs3.y);
            if (!hit) return;
            if (
              roomPts.length > 0 &&
              hit.id === roomPts[0] &&
              roomPts.length >= 3
            ) {
              // Close the room
              const name = prompt(
                "Room name:",
                `Room ${editorRooms.length + 1}`,
              );
              if (name) {
                const nr = {
                  id: fpId("r"),
                  name,
                  pointIds: [...roomPts],
                  access_level_id: null,
                  grid_size_override: null,
                };
                setEditorRooms((prev) => [...prev, nr]);
                markDirty();
              }
              setRoomPts([]);
            } else if (!roomPts.includes(hit.id)) {
              setRoomPts((prev) => [...prev, hit.id]);
            }
          } else if (tool === "select") {
            const hit = snapToPoint(wx, wy);
            if (hit) {
              setSelected({ type: "point", id: hit.id });
              return;
            }
            // Check room hit
            for (const rm of editorRooms) {
              const poly = rm.pointIds
                .map((pid) => points.find((p) => p.id === pid))
                .filter(Boolean);
              if (poly.length >= 3 && pointInPoly(wx, wy, poly)) {
                setSelected({ type: "room", id: rm.id });
                return;
              }
            }
            // Check line hit
            for (const ln of lines) {
              const pA = points.find((p) => p.id === ln.from);
              const pB = points.find((p) => p.id === ln.to);
              if (pA && pB && distToLine(wx, wy, pA, pB) < 0.3) {
                setSelected({ type: "line", id: ln.id });
                setEditLength(String(ln.length_m));
                return;
              }
            }
            setSelected(null);
          } else if (tool === "delete") {
            const hit = snapToPoint(wx, wy);
            if (hit) {
              setPoints((prev) => prev.filter((p) => p.id !== hit.id));
              setLines((prev) =>
                prev.filter((l) => l.from !== hit.id && l.to !== hit.id),
              );
              setEditorRooms((prev) =>
                prev.filter((r) => !r.pointIds.includes(hit.id)),
              );
              setSelected(null);
              markDirty();
              return;
            }
            for (const ln of lines) {
              const pA = points.find((p) => p.id === ln.from);
              const pB = points.find((p) => p.id === ln.to);
              if (pA && pB && distToLine(wx, wy, pA, pB) < 0.3) {
                setLines((prev) => prev.filter((l) => l.id !== ln.id));
                setSelected(null);
                markDirty();
                return;
              }
            }
            for (const rm of editorRooms) {
              const poly = rm.pointIds
                .map((pid) => points.find((p) => p.id === pid))
                .filter(Boolean);
              if (poly.length >= 3 && pointInPoly(wx, wy, poly)) {
                setEditorRooms((prev) => prev.filter((r) => r.id !== rm.id));
                setSelected(null);
                markDirty();
                return;
              }
            }
          }
        };

        // Point dragging
        const handleSvgMouseDown = (e) => {
          if (tool !== "select") return;
          const svgEl = svgRef.current;
          if (!svgEl) return;
          const rect = svgEl.getBoundingClientRect();
          const wx = fromSvgX(((e.clientX - rect.left) / rect.width) * dims.w);
          const wy = fromSvgY(((e.clientY - rect.top) / rect.height) * dims.h);
          const hit = snapToPoint(wx, wy);
          if (hit) {
            setDragPt(hit.id);
            setDragStart({ x: e.clientX, y: e.clientY });
            e.preventDefault();
          }
        };
        const handleSvgMouseMove = (e) => {
          if (!dragPt) return;
          const svgEl = svgRef.current;
          if (!svgEl) return;
          const rect = svgEl.getBoundingClientRect();
          const wx = Math.max(
            0,
            Math.min(
              fw,
              fromSvgX(((e.clientX - rect.left) / rect.width) * dims.w),
            ),
          );
          const wy = Math.max(
            0,
            Math.min(
              fh,
              fromSvgY(((e.clientY - rect.top) / rect.height) * dims.h),
            ),
          );
          const dragSnapped = snapToGrid(wx, wy);
          setPoints((prev) =>
            prev.map((p) =>
              p.id === dragPt
                ? {
                    ...p,
                    x: dragSnapped.x,
                    y: dragSnapped.y,
                  }
                : p,
            ),
          );
        };
        const handleSvgMouseUp = () => {
          if (dragPt) {
            markDirty();
            setDragPt(null);
            setDragStart(null);
          }
        };

        // Geometry helpers
        function pointInPoly(x, y, poly) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x,
              yi = poly[i].y,
              xj = poly[j].x,
              yj = poly[j].y;
            if (
              yi > y !== yj > y &&
              x < ((xj - xi) * (y - yi)) / (yj - yi) + xi
            )
              inside = !inside;
          }
          return inside;
        }
        function distToLine(px, py, a, b) {
          const dx = b.x - a.x,
            dy = b.y - a.y;
          const len2 = dx * dx + dy * dy;
          if (len2 === 0) return Math.hypot(px - a.x, py - a.y);
          let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
          t = Math.max(0, Math.min(1, t));
          return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
        }
        function polyArea(pts) {
          let a = 0;
          for (let i = 0; i < pts.length; i++) {
            const j = (i + 1) % pts.length;
            a += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
          }
          return Math.abs(a / 2);
        }

        // Save
        const handleSave = async () => {
          setSaving(true);
          try {
            await platform.saveEditorData(floor.id, {
              data: { points, lines, rooms: editorRooms },
              default_grid_size_m: gridSize,
            });
            // Sync rooms to database
            const dbRooms = editorRooms.map((r) => {
              const poly = r.pointIds
                .map((pid) => points.find((p) => p.id === pid))
                .filter(Boolean)
                .map((p) => [p.x, p.y]);
              return {
                editor_id: r.id,
                name: r.name,
                polygon: poly,
                access_level_id: r.access_level_id,
                grid_size_override: r.grid_size_override,
              };
            });
            await platform.syncEditorRooms(floor.id, { rooms: dbRooms });
            setDirty(false);
          } catch (e) {
            alert("Save failed: " + e.message);
          } finally {
            setSaving(false);
          }
        };

        // PDF upload
        const handlePdfUpload = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            await platform.uploadEditorPdf(floor.id, file);
            setHasPdf(true);
          } catch (err) {
            alert("PDF upload failed: " + err.message);
          }
          e.target.value = "";
        };

        // Copy floor plan
        const handleCopy = async () => {
          if (!copyFloorId) return;
          try {
            await platform.copyFloorplan(floor.id, copyFloorId);
            // Reload
            const res = await platform.getEditorData(floor.id);
            const d = res.data || {};
            setPoints(d.points || []);
            setLines(d.lines || []);
            setEditorRooms(d.rooms || []);
            setHasPdf(!!res.has_pdf);
            setDirty(false);
          } catch (e) {
            alert("Copy failed: " + e.message);
          }
        };

        // Access level CRUD
        const handleCreateAL = async () => {
          if (!alForm.name.trim() || !building) return;
          try {
            const al = await platform.createAccessLevel(building.id, alForm);
            setAccessLevels((prev) => [...prev, al]);
            setAlForm({ name: "", color: "#6b7280" });
          } catch (e) {
            alert(e.message);
          }
        };
        const handleDeleteAL = async (id) => {
          try {
            await platform.deleteAccessLevel(id);
            setAccessLevels((prev) => prev.filter((a) => a.id !== id));
            setEditorRooms((prev) =>
              prev.map((r) =>
                r.access_level_id === id ? { ...r, access_level_id: null } : r,
              ),
            );
            markDirty();
          } catch (e) {
            alert(e.message);
          }
        };

        // Room colors
        const ROOM_FILLS = [
          "#3b82f620",
          "#10b98120",
          "#f59e0b20",
          "#ef444420",
          "#8b5cf620",
          "#06b6d420",
        ];
        const ROOM_STROKES = [
          "#3b82f6",
          "#10b981",
          "#f59e0b",
          "#ef4444",
          "#8b5cf6",
          "#06b6d4",
        ];

        // Tool buttons
        const TOOLS = [
          { id: "select", label: "Select", icon: "\u25C7" },
          { id: "point", label: "Point", icon: "\u25CF" },
          { id: "line", label: "Line", icon: "\u2571" },
          { id: "room", label: "Room", icon: "\u25A1" },
          { id: "delete", label: "Delete", icon: "\u2715" },
        ];

        const selLine =
          selected?.type === "line"
            ? lines.find((l) => l.id === selected.id)
            : null;
        const selRoom =
          selected?.type === "room"
            ? editorRooms.find((r) => r.id === selected.id)
            : null;
        const selPoint =
          selected?.type === "point"
            ? points.find((p) => p.id === selected.id)
            : null;

        return h(
          "div",
          { className: "fade-in" },
          // Top bar
          h(
            "div",
            { className: "flex items-center justify-between mb-4" },
            h(
              "button",
              {
                onClick: onBack,
                className:
                  "flex items-center gap-1 text-sm text-muted hover:text-accent",
              },
              "\u2190 Back to Floors",
            ),
            h(
              "div",
              { className: "flex items-center gap-3" },
              dirty && h(Badge, { color: "yellow" }, "Unsaved changes"),
              h(
                Button,
                {
                  onClick: handleSave,
                  disabled: saving,
                  variant: "primary",
                  size: "sm",
                },
                saving ? "Saving..." : "Save Floor Plan",
              ),
              h(
                Button,
                { onClick: onNext, variant: "secondary", size: "sm" },
                "Next: Anchors \u2192",
              ),
            ),
          ),
          h(
            "div",
            { className: "text-sm text-muted mb-3" },
            `${floor.name} \u2014 ${fw}m \u00D7 ${fh}m`,
          ),

          // Toolbar
          h(
            "div",
            { className: "flex items-center gap-1 mb-3 flex-wrap" },
            TOOLS.map((t) =>
              h(
                "button",
                {
                  key: t.id,
                  onClick: () => {
                    setTool(t.id);
                    setLineStart(null);
                    setRoomPts([]);
                  },
                  className: `px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${
                    tool === t.id
                      ? "bg-accent text-white shadow-sm"
                      : "bg-surface-dim text-ink-secondary hover:bg-panel border border-transparent hover:border-border"
                  }`,
                },
                `${t.icon} ${t.label}`,
              ),
            ),
            h("div", { className: "w-px h-6 bg-border mx-2" }),
            h(
              "label",
              {
                className:
                  "flex items-center gap-1.5 text-sm text-ink-secondary cursor-pointer",
              },
              h("input", {
                type: "checkbox",
                checked: showEditorGrid,
                onChange: (e) => setShowEditorGrid(e.target.checked),
                className: "rounded",
              }),
              "Grid",
            ),
            h(
              "label",
              {
                className:
                  "flex items-center gap-1.5 text-sm text-ink-secondary cursor-pointer ml-2",
              },
              h("input", {
                type: "checkbox",
                checked: snapGrid,
                onChange: (e) => setSnapGrid(e.target.checked),
                className: "rounded",
              }),
              "Snap",
            ),
            h(
              "label",
              {
                className:
                  "flex items-center gap-1.5 text-sm text-ink-secondary cursor-pointer ml-2",
              },
              h("input", {
                type: "checkbox",
                checked: showGrid,
                onChange: (e) => setShowGrid(e.target.checked),
                className: "rounded",
              }),
              "Fingerprint Grid",
            ),
            // Status hints
            tool === "line" &&
              lineStart &&
              h(Badge, { color: "blue" }, "Click second point"),
            tool === "room" &&
              roomPts.length > 0 &&
              h(
                Badge,
                { color: "purple" },
                `${roomPts.length} pts \u2014 click first to close`,
              ),
          ),

          // Main layout: canvas + side panel
          h(
            "div",
            { className: "flex gap-4" },
            // Canvas
            h(
              "div",
              { className: "flex-1 min-w-0" },
              h(
                "svg",
                {
                  ref: svgRef,
                  viewBox: `0 0 ${dims.w} ${dims.h}`,
                  className:
                    "w-full bg-panel rounded-lg border border-border cursor-crosshair",
                  style: { maxHeight: 600 },
                  onClick: handleSvgClick,
                  onMouseDown: handleSvgMouseDown,
                  onMouseMove: handleSvgMouseMove,
                  onMouseUp: handleSvgMouseUp,
                  onMouseLeave: handleSvgMouseUp,
                },
                // Background grid (snap grid lines)
                ...(showEditorGrid
                  ? Array.from(
                      { length: Math.ceil(fw / gridSize) + 1 },
                      (_, i) =>
                        h("line", {
                          key: `gx${i}`,
                          x1: tx(i * gridSize),
                          y1: ty(0),
                          x2: tx(i * gridSize),
                          y2: ty(fh),
                          stroke: "#e5e7eb",
                          strokeWidth: 0.5,
                        }),
                    )
                  : []),
                ...(showEditorGrid
                  ? Array.from(
                      { length: Math.ceil(fh / gridSize) + 1 },
                      (_, i) =>
                        h("line", {
                          key: `gy${i}`,
                          x1: tx(0),
                          y1: ty(i * gridSize),
                          x2: tx(fw),
                          y2: ty(i * gridSize),
                          stroke: "#e5e7eb",
                          strokeWidth: 0.5,
                        }),
                    )
                  : []),
                // PDF background
                pdfDataUrl &&
                  h("image", {
                    href: pdfDataUrl,
                    x: tx(pdfOffsetX),
                    y: ty(pdfOffsetY),
                    width: fw * sc * pdfScale,
                    height: fh * sc * pdfScale,
                    preserveAspectRatio: "none",
                    opacity: pdfOpacity,
                  }),
                // Floor boundary
                h("rect", {
                  x: tx(0),
                  y: ty(0),
                  width: fw * sc,
                  height: fh * sc,
                  fill: "none",
                  stroke: "#374151",
                  strokeWidth: 2,
                  strokeDasharray: "6,3",
                }),
                // Axis labels
                h(
                  "text",
                  {
                    x: tx(fw / 2),
                    y: dims.h - 6,
                    textAnchor: "middle",
                    className: "text-[10px] fill-gray-400",
                  },
                  `${fw}m`,
                ),
                h(
                  "text",
                  {
                    x: 10,
                    y: ty(fh / 2),
                    textAnchor: "middle",
                    className: "text-[10px] fill-gray-400",
                    transform: `rotate(-90, 10, ${ty(fh / 2)})`,
                  },
                  `${fh}m`,
                ),
                // Rooms (filled polygons)
                ...editorRooms.map((rm, ri) => {
                  const poly = rm.pointIds
                    .map((pid) => points.find((p) => p.id === pid))
                    .filter(Boolean);
                  if (poly.length < 3) return null;
                  const pts = poly
                    .map((p) => `${tx(p.x)},${ty(p.y)}`)
                    .join(" ");
                  const cx = poly.reduce((s, p) => s + p.x, 0) / poly.length;
                  const cy = poly.reduce((s, p) => s + p.y, 0) / poly.length;
                  const isSel =
                    selected?.type === "room" && selected.id === rm.id;
                  const alColor = rm.access_level_id
                    ? accessLevels.find((a) => a.id === rm.access_level_id)
                        ?.color
                    : null;
                  return h(
                    "g",
                    { key: rm.id },
                    h("polygon", {
                      points: pts,
                      fill: alColor
                        ? alColor + "30"
                        : ROOM_FILLS[ri % ROOM_FILLS.length],
                      stroke: isSel
                        ? "#ae5630"
                        : alColor || ROOM_STROKES[ri % ROOM_STROKES.length],
                      strokeWidth: isSel ? 2.5 : 1.5,
                    }),
                    h(
                      "text",
                      {
                        x: tx(cx),
                        y: ty(cy),
                        textAnchor: "middle",
                        dominantBaseline: "central",
                        className: "text-[11px] font-medium",
                        fill: alColor || ROOM_STROKES[ri % ROOM_STROKES.length],
                      },
                      rm.name,
                    ),
                  );
                }),
                // Fingerprint grid overlay
                showGrid &&
                  editorRooms.map((rm, ri) => {
                    const poly = rm.pointIds
                      .map((pid) => points.find((p) => p.id === pid))
                      .filter(Boolean);
                    if (poly.length < 3) return null;
                    const gs = rm.grid_size_override || gridSize;
                    const xs = poly.map((p) => p.x),
                      ys = poly.map((p) => p.y);
                    const minX = Math.floor(Math.min(...xs) / gs) * gs;
                    const maxX = Math.ceil(Math.max(...xs) / gs) * gs;
                    const minY = Math.floor(Math.min(...ys) / gs) * gs;
                    const maxY = Math.ceil(Math.max(...ys) / gs) * gs;
                    const cells = [];
                    for (let gx = minX; gx < maxX; gx += gs) {
                      for (let gy = minY; gy < maxY; gy += gs) {
                        const cx = gx + gs / 2,
                          cy = gy + gs / 2;
                        if (pointInPoly(cx, cy, poly)) {
                          cells.push(
                            h("rect", {
                              key: `gc-${rm.id}-${gx}-${gy}`,
                              x: tx(gx),
                              y: ty(gy),
                              width: gs * sc,
                              height: gs * sc,
                              fill: "none",
                              stroke: "#8b5cf680",
                              strokeWidth: 0.7,
                              strokeDasharray: "2,2",
                            }),
                          );
                          cells.push(
                            h("circle", {
                              key: `gd-${rm.id}-${gx}-${gy}`,
                              cx: tx(cx),
                              cy: ty(cy),
                              r: 2,
                              fill: "#8b5cf660",
                            }),
                          );
                        }
                      }
                    }
                    return h("g", { key: `grid-${rm.id}` }, ...cells);
                  }),
                // Room-in-progress outline
                roomPts.length > 1 &&
                  (() => {
                    const poly = roomPts
                      .map((pid) => points.find((p) => p.id === pid))
                      .filter(Boolean);
                    const pts = poly
                      .map((p) => `${tx(p.x)},${ty(p.y)}`)
                      .join(" ");
                    return h("polyline", {
                      points: pts,
                      fill: "none",
                      stroke: "#8b5cf6",
                      strokeWidth: 2,
                      strokeDasharray: "4,3",
                    });
                  })(),
                // Lines
                ...lines.map((ln) => {
                  const pA = points.find((p) => p.id === ln.from);
                  const pB = points.find((p) => p.id === ln.to);
                  if (!pA || !pB) return null;
                  const isSel =
                    selected?.type === "line" && selected.id === ln.id;
                  const mx = (pA.x + pB.x) / 2,
                    my = (pA.y + pB.y) / 2;
                  return h(
                    "g",
                    { key: ln.id },
                    h("line", {
                      x1: tx(pA.x),
                      y1: ty(pA.y),
                      x2: tx(pB.x),
                      y2: ty(pB.y),
                      stroke: isSel ? "#ae5630" : "#6b7280",
                      strokeWidth: isSel ? 2.5 : 1.5,
                    }),
                    ln.length_m > 0 &&
                      h(
                        "text",
                        {
                          x: tx(mx),
                          y: ty(my) - 6,
                          textAnchor: "middle",
                          className: "text-[9px] font-mono",
                          fill: "#374151",
                        },
                        `${ln.length_m}m`,
                      ),
                  );
                }),
                // Line-in-progress
                lineStart &&
                  (() => {
                    const p = points.find((pt) => pt.id === lineStart);
                    return p
                      ? h("circle", {
                          cx: tx(p.x),
                          cy: ty(p.y),
                          r: 8,
                          fill: "none",
                          stroke: "#ae5630",
                          strokeWidth: 2,
                          strokeDasharray: "3,2",
                        })
                      : null;
                  })(),
                // Points
                ...points.map((p) => {
                  const isSel =
                    selected?.type === "point" && selected.id === p.id;
                  const isRoomPt = roomPts.includes(p.id);
                  return h(
                    "g",
                    { key: p.id },
                    h("circle", {
                      cx: tx(p.x),
                      cy: ty(p.y),
                      r: isSel ? 7 : 5,
                      fill: isRoomPt
                        ? "#8b5cf6"
                        : isSel
                          ? "#ae5630"
                          : "#374151",
                      stroke: "#fff",
                      strokeWidth: 2,
                    }),
                    isSel &&
                      h(
                        "text",
                        {
                          x: tx(p.x),
                          y: ty(p.y) - 10,
                          textAnchor: "middle",
                          className: "text-[8px] font-mono",
                          fill: "#6b7280",
                        },
                        `(${p.x}, ${p.y})`,
                      ),
                  );
                }),
              ),
            ),

            // Side panel
            h(
              "div",
              { className: "w-72 flex-shrink-0 space-y-3" },
              // Selected element properties
              selPoint &&
                h(
                  Card,
                  { title: "Point" },
                  h(
                    "div",
                    { className: "text-xs font-mono text-muted mb-2" },
                    selPoint.id,
                  ),
                  h(
                    "div",
                    { className: "grid grid-cols-2 gap-2" },
                    h(Input, {
                      label: "X (m)",
                      type: "number",
                      value: selPoint.x,
                      onChange: (v) => {
                        setPoints((prev) =>
                          prev.map((p) =>
                            p.id === selPoint.id
                              ? { ...p, x: parseFloat(v) || 0 }
                              : p,
                          ),
                        );
                        markDirty();
                      },
                    }),
                    h(Input, {
                      label: "Y (m)",
                      type: "number",
                      value: selPoint.y,
                      onChange: (v) => {
                        setPoints((prev) =>
                          prev.map((p) =>
                            p.id === selPoint.id
                              ? { ...p, y: parseFloat(v) || 0 }
                              : p,
                          ),
                        );
                        markDirty();
                      },
                    }),
                  ),
                ),
              selLine &&
                h(
                  Card,
                  { title: "Line" },
                  h(
                    "div",
                    { className: "text-xs font-mono text-muted mb-2" },
                    `${selLine.from} \u2192 ${selLine.to}`,
                  ),
                  h(Input, {
                    label: "Length (m)",
                    type: "number",
                    value: editLength,
                    onChange: (v) => {
                      setEditLength(v);
                      const len = parseFloat(v);
                      if (!isNaN(len) && len >= 0) {
                        setLines((prev) =>
                          prev.map((l) =>
                            l.id === selLine.id ? { ...l, length_m: len } : l,
                          ),
                        );
                        markDirty();
                      }
                    },
                  }),
                ),
              selRoom &&
                h(
                  Card,
                  { title: "Room" },
                  h(Input, {
                    label: "Name",
                    value: selRoom.name,
                    onChange: (v) => {
                      setEditorRooms((prev) =>
                        prev.map((r) =>
                          r.id === selRoom.id ? { ...r, name: v } : r,
                        ),
                      );
                      markDirty();
                    },
                  }),
                  h(
                    "div",
                    { className: "mt-2" },
                    h(Select, {
                      label: "Access Level",
                      value: selRoom.access_level_id || "",
                      onChange: (v) => {
                        setEditorRooms((prev) =>
                          prev.map((r) =>
                            r.id === selRoom.id
                              ? {
                                  ...r,
                                  access_level_id: v ? parseInt(v) : null,
                                }
                              : r,
                          ),
                        );
                        markDirty();
                      },
                      options: [
                        { value: "", label: "None" },
                        ...accessLevels.map((a) => ({
                          value: a.id,
                          label: a.name,
                        })),
                      ],
                    }),
                  ),
                  h(
                    "div",
                    { className: "mt-2" },
                    h(Input, {
                      label: "Grid Override (m)",
                      type: "number",
                      value: selRoom.grid_size_override || "",
                      placeholder: `Default: ${gridSize}`,
                      onChange: (v) => {
                        setEditorRooms((prev) =>
                          prev.map((r) =>
                            r.id === selRoom.id
                              ? {
                                  ...r,
                                  grid_size_override: v ? parseFloat(v) : null,
                                }
                              : r,
                          ),
                        );
                        markDirty();
                      },
                    }),
                  ),
                  h(
                    "div",
                    { className: "text-xs text-muted mt-2" },
                    `${selRoom.pointIds.length} vertices \u00B7 ${polyArea(selRoom.pointIds.map((pid) => points.find((p) => p.id === pid)).filter(Boolean)).toFixed(1)}m\u00B2`,
                  ),
                ),

              // Room list
              h(
                Card,
                { title: `Rooms (${editorRooms.length})` },
                editorRooms.length === 0

      function WizardAnchors({ floor, onBack }) {
        // Anchors already placed on this floor
        const { data, loading, error, reload } = useApi(
          () => platform.listAnchors(floor.id),
          [floor.id],
        );
        // Full inventory (for "From Inventory" tab)
        const { data: allAnchors, reload: reloadInventory } = useApi(() =>
          platform.listAllAnchors(),
        );

        const [mode, setMode] = useState("create"); // "create" | "assign"

        // ── Create-new form ──────────────────────────────────────────────────
        const [form, setForm] = useState({
          anchor_id: "",
          anchor_type: "engenius_ap",
          ip_address: "",
          mac_address: "",
          x_m: 0,
          y_m: 0,
          username: "admin",
          password: "admin",
        });
        const [creating, setCreating] = useState(false);

        // ── Assign-from-inventory form ───────────────────────────────────────
        const [selectedId, setSelectedId] = useState("");
        const [assignPos, setAssignPos] = useState({ x_m: 0, y_m: 0 });
        const [assigning, setAssigning] = useState(false);

        // Unassigned devices available to pick from
        const inventory = (allAnchors || []).filter((a) => a.floor_id == null);
        const selectedAnchor =
          inventory.find((a) => String(a.id) === selectedId) || null;

        // Reload both lists
        const reloadAll = () => {
          reload();
          reloadInventory();
        };

        const handleDeleteAnchor = async (a) => {
          if (
            !window.confirm(
              `Delete anchor "${a.anchor_id}"? This cannot be undone.`,
            )
          )
            return;
          try {
            await platform.deleteAnchor(a.id);
            reloadAll();
          } catch (e) {
            alert(e.message);
          }
        };

        const handleUnassign = async (a) => {
          if (
            !window.confirm(
              `Remove "${a.anchor_id}" from this floor and return it to inventory?`,
            )
          )
            return;
          try {
            await platform.updateAnchor(a.id, { floor_id: null });
            reloadAll();
          } catch (e) {
            alert(e.message);
          }
        };

        const handleCreate = async () => {
          if (!form.anchor_id.trim()) return;
          setCreating(true);
          try {
            await platform.createAnchor(floor.id, {
              ...form,
              anchor_id: form.anchor_id.trim(),
              x_m: +form.x_m,
              y_m: +form.y_m,
            });
            setForm((f) => ({
              ...f,
              anchor_id: "",
              ip_address: "",
              mac_address: "",
              x_m: 0,
              y_m: 0,
            }));
            reloadAll();
          } catch (e) {
            alert(e.message);
          } finally {
            setCreating(false);
          }
        };

        const handleAssign = async () => {
          if (!selectedId) return;
          setAssigning(true);
          try {
            await platform.updateAnchor(+selectedId, {
              floor_id: floor.id,
              x_m: +assignPos.x_m,
              y_m: +assignPos.y_m,
              device_status: "in_use",
            });
            setSelectedId("");
            setAssignPos({ x_m: 0, y_m: 0 });
            reloadAll();
          } catch (e) {
            alert(e.message);
          } finally {
            setAssigning(false);
          }
        };

        if (error) return h(ErrorBanner, { message: error, onRetry: reload });

        return h(

          { className: "fade-in" },
          h(

              onClick: onBack,
              className:
                "flex items-center gap-1 text-sm text-muted hover:text-accent mb-4",

            "\u2190 Back to Floor Plan",

              { className: "text-sm text-muted" },
              `Floor: ${floor.name}`,
            ),
            h(Badge, { color: "green" }, `${data?.length || 0} anchors placed`),

                  h(

              mode === "assign" &&
                h(

                  { className: "space-y-3" },
                  inventory.length === 0

                    : h(
                        "div",
                        { className: "space-y-3" },
                        h(
                          "div",
                          null,
                          h(
                            "div",
                            {
                              className:
                                "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                            },
                            "Select Device",
                          ),
                          h(
                            "select",
                            {
                              value: selectedId,
                              onChange: (e) => setSelectedId(e.target.value),
                              className:
                                "w-full px-2 py-1.5 border border-border rounded text-sm bg-panel text-ink",

                            inventory.map((a) =>
                              h(
                                "option",
                                { key: a.id, value: String(a.id) },
                                `${a.anchor_id}  (${a.anchor_type}${a.ip_address ? " · " + a.ip_address : ""}${a.mac_address ? " · " + a.mac_address : ""})`,
                              ),
                            ),
                          ),
                        ),
                        selectedAnchor &&
                          h(
                            "div",
                            {
                              className:
                                "p-2 rounded bg-surface text-xs space-y-0.5",
                            },
                            h(
                              "div",
                              null,
                              h("span", { className: "text-muted" }, "Type: "),
                              h(

                            selectedAnchor.ip_address &&
