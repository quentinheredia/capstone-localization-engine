      // ── Device status / flag metadata ─────────────────────────────────────────

      const DEVICE_STATUSES = [
        { value: "in_stock", label: "In Stock", badgeColor: "gray" },
        { value: "in_use", label: "In Use", badgeColor: "green" },
        {
          value: "deployment_in_progress",
          label: "Deployment In Progress",
          badgeColor: "yellow",
        },
        { value: "decommissioned", label: "Decommissioned", badgeColor: "red" },
      ];

      const ANCHOR_FLAGS = [
        {
          value: "needs_provision",
          label: "Needs Provision",
          badgeColor: "yellow",
        },
        {
          value: "ready_to_deploy",
          label: "Ready to Deploy",
          badgeColor: "blue",
        },
        {
          value: "admin_down",
          label: "Administratively Down",
          badgeColor: "red",
        },
        { value: "shutdown", label: "Shutdown", badgeColor: "red" },
      ];

      function DeviceStatusBadge({ value }) {
        const meta = DEVICE_STATUSES.find((s) => s.value === value) || {
          label: value,
          badgeColor: "gray",
        };
        return h(Badge, { color: meta.badgeColor }, meta.label);
      }

      function FlagBadges({ flags }) {
        if (!flags || flags.length === 0)
          return h("span", { className: "text-muted text-xs" }, "—");
        return h(
          "div",
          { className: "flex gap-1 flex-wrap" },
          flags.map((f) => {
            const meta = ANCHOR_FLAGS.find((af) => af.value === f) || {
              label: f,
              badgeColor: "gray",
            };
            return h(Badge, { key: f, color: meta.badgeColor }, meta.label);
          }),
        );
      }

      function AnchorsTable() {
        const { data, loading, error, reload } = useApi(() =>
          platform.listAllAnchors(),
        );
        const [filter, setFilter] = useState("");
        const [statusFilter, setStatusFilter] = useState("");
        const [showRegister, setShowRegister] = useState(false);
        const [editId, setEditId] = useState(null); // anchor.id being edited
        const [editData, setEditData] = useState({});
        const [saving, setSaving] = useState(false);
        const [polling, setPolling] = useState(false);
        const [pollMsg, setPollMsg] = useState(null);

        // Registration form state
        const [form, setForm] = useState({
          anchor_id: "",
          anchor_type: "engenius_ap",
          ip_address: "",
          mac_address: "",
          brand: "",
          model: "",
          device_status: "in_stock",
          flags: [],
          username: "admin",
          password: "admin",
        });
        const [registering, setRegistering] = useState(false);
        const [registerError, setRegisterError] = useState(null);

        // Ping debug state
        const [debugIp, setDebugIp] = useState("");
        const [debugResult, setDebugResult] = useState(null);
        const [debugLoading, setDebugLoading] = useState(false);

        const handlePingDebug = async () => {
          if (!debugIp.trim()) return;
          setDebugLoading(true);
          setDebugResult(null);
          try {
            const res = await platform.pingDebug(debugIp.trim());
            setDebugResult(res);
          } catch (e) {
            setDebugResult({ error: e.message, reachable: false });
          } finally {
            setDebugLoading(false);
          }
        };

        const handlePollNow = async () => {
          setPolling(true);
          setPollMsg(null);
          try {
            const res = await platform.pollAnchorsNow();
            const online = res.results?.filter((r) => r.reachable).length ?? 0;
            const total = res.polled ?? 0;
            setPollMsg({
              ok: true,
              text: `Polled ${total} device${total !== 1 ? "s" : ""} — ${online} online`,
            });
            reload();
          } catch (e) {
            const msg = e.message?.includes("Failed to fetch")
              ? "Cannot reach platform backend — is it running?"
              : e.message;
            setPollMsg({ ok: false, text: msg });
          } finally {
            setPolling(false);
          }
        };

        const handleRegister = async () => {
          if (!form.anchor_id.trim()) return;
          setRegistering(true);
          setRegisterError(null);
          try {
            await platform.registerAnchor({
              ...form,
              anchor_id: form.anchor_id.trim(),
            });
            setForm({
              anchor_id: "",
              anchor_type: "engenius_ap",
              ip_address: "",
              mac_address: "",
              brand: "",
              model: "",
              device_status: "in_stock",
              flags: [],
              username: "admin",
              password: "admin",
            });
            setShowRegister(false);
            reload();
          } catch (e) {
            const msg = e.message?.includes("Failed to fetch")
              ? "Cannot reach platform backend — make sure the backend service is running on port 8080."
              : e.message;
            setRegisterError(msg);
          } finally {
            setRegistering(false);
          }
        };

        const startEdit = (a) => {
          setEditId(a.id);
          setEditData({
            device_status: a.device_status || "in_stock",
            flags: a.flags || [],
          });
        };
        const cancelEdit = () => {
          setEditId(null);
          setEditData({});
        };
        const saveEdit = async (a) => {
          setSaving(true);
          try {
            await platform.updateAnchor(a.id, editData);
            setEditId(null);
            reload();
          } catch (e) {
            alert(e.message);
          } finally {
            setSaving(false);
          }
        };
        const handleDelete = async (a) => {
          if (!window.confirm(`Delete anchor "${a.anchor_id}"?`)) return;
          try {
            await platform.deleteAnchor(a.id);
            reload();
          } catch (e) {
            alert(e.message);
          }
        };
        const toggleFlag = (flag, current) => {
          const next = current.includes(flag)
            ? current.filter((f) => f !== flag)
            : [...current, flag];
          setEditData((d) => ({ ...d, flags: next }));
        };

        if (loading) return h(LoadingSpinner);
        if (error)
          return h(ErrorBanner, {
            message: `Could not load anchors: ${error}`,
            onRetry: reload,
          });

        const items = (data || []).filter((a) => {
          const q = filter.toLowerCase();
          const matchText =
            !q ||
            a.anchor_id.toLowerCase().includes(q) ||
            (a.ip_address || "").includes(q) ||
            (a.mac_address || "").toLowerCase().includes(q);
          const matchStatus = !statusFilter || a.device_status === statusFilter;
          return matchText && matchStatus;
        });

        const COLS = [
          "ID",
          "Type",
          "IP",
          "MAC",
          "Device Status",
          "Flags",
          "Connectivity",
          "Last Reached",
          "Floor",
          "Actions",
        ];

        return h(
          "div",
          { className: "space-y-4" },

          // ── Register panel ──────────────────────────────────────────────
          h(
            Card,
            { title: "Register Anchor" },
            !showRegister
              ? h(
                  "div",
                  { className: "flex items-center justify-between" },
                  h(
                    "p",
                    { className: "text-sm text-muted" },
                    "Add a device to the inventory without assigning it to a floor.",
                  ),
                  h(
                    Button,
                    { onClick: () => setShowRegister(true), size: "sm" },
                    "+ Register",
                  ),
                )
              : h(
                  "div",
                  { className: "space-y-3" },
                  h(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    h(Input, {
                      label: "Anchor ID",
                      value: form.anchor_id,
                      onChange: (v) => setForm((f) => ({ ...f, anchor_id: v })),
                      placeholder: "e.g. AP-STORE-01",
                    }),
                    h(Select, {
                      label: "Type",
                      value: form.anchor_type,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, anchor_type: v })),
                      options: [
                        { value: "engenius_ap", label: "EnGenius AP" },
                        { value: "esp32", label: "ESP32" },
                      ],
                    }),
                    h(Input, {
                      label: "IP Address",
                      value: form.ip_address,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, ip_address: v })),
                      placeholder:
                        form.anchor_type === "engenius_ap"
                          ? "192.168.1.x"
                          : "Optional",
                    }),
                    h(Input, {
                      label: "MAC Address",
                      value: form.mac_address,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, mac_address: v })),
                      placeholder: "AA:BB:CC:DD:EE:FF",
                    }),
                    h(Input, {
                      label: "Brand",
                      value: form.brand,
                      onChange: (v) => setForm((f) => ({ ...f, brand: v })),
                      placeholder: "e.g. EnGenius",
                    }),
                    h(Input, {
                      label: "Model",
                      value: form.model,
                      onChange: (v) => setForm((f) => ({ ...f, model: v })),
                      placeholder: "e.g. EWS360",
                    }),
                  ),
                  h(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    h(Select, {
                      label: "Device Status",
                      value: form.device_status,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, device_status: v })),
                      options: DEVICE_STATUSES.map((s) => ({
                        value: s.value,
                        label: s.label,
                      })),
                    }),
                    h(
                      "div",
                      null,
                      h(
                        "div",
                        {
                          className:
                            "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                        },
                        "Flags",
                      ),
                      h(
                        "div",
                        { className: "flex flex-wrap gap-1.5" },
                        ANCHOR_FLAGS.map((af) =>
                          h(
                            "label",
                            {
                              key: af.value,
                              className:
                                "flex items-center gap-1 text-xs cursor-pointer",
                            },
                            h("input", {
                              type: "checkbox",
                              checked: form.flags.includes(af.value),
                              onChange: () => {
                                const next = form.flags.includes(af.value)
                                  ? form.flags.filter((x) => x !== af.value)
                                  : [...form.flags, af.value];
                                setForm((f) => ({ ...f, flags: next }));
                              },
                            }),
                            af.label,
                          ),
                        ),
                      ),
                    ),
                  ),
                  registerError &&
                    h(
                      "div",
                      {
                        className:
                          "text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded px-3 py-2",
                      },
                      registerError,
                    ),
                  h(
                    "div",
                    { className: "flex gap-2 pt-1" },
                    h(
                      Button,
                      {
                        onClick: handleRegister,
                        disabled: registering || !form.anchor_id.trim(),
                      },
                      registering ? "Registering..." : "Register Anchor",
                    ),
                    h(
                      Button,
                      {
                        variant: "ghost",
                        onClick: () => {
                          setShowRegister(false);
                          setRegisterError(null);
                        },
                      },
                      "Cancel",
                    ),
                  ),
                ),
          ),

          // ── Ping debug panel ────────────────────────────────────────────
          h(
            Card,
            { title: "🔍 Ping Diagnostics" },
            h(
              "div",
              { className: "space-y-3" },
              h(
                "p",
                { className: "text-xs text-muted" },
                "Run a verbose ping against any IP to see raw output, return code, and whether asyncio or blocking subprocess was used. Helps diagnose why the background poller shows devices as offline.",
              ),
              h(
                "div",
                { className: "flex gap-2 items-end" },
                h(Input, {
                  label: "IP Address",
                  value: debugIp,
                  onChange: setDebugIp,
                  placeholder: "e.g. 192.168.1.19",
                  className: "w-48",
                }),
                h(
                  Button,
                  {
                    disabled: debugLoading || !debugIp.trim(),
                    onClick: handlePingDebug,
                    size: "sm",
                  },
                  debugLoading ? "Pinging…" : "Run Ping Test",
                ),
              ),
              debugResult &&
                h(
                  "div",
                  {
                    className: `rounded border text-xs font-mono p-3 space-y-1 ${
                      debugResult.reachable
                        ? "bg-emerald-500/15 border-emerald-500/30"
                        : "bg-red-500/10 border-red-500/30"
                    }`,
                  },
                  h(
                    "div",
                    { className: "flex gap-4 flex-wrap font-semibold" },
                    h(
                      "span",
                      null,
                      `Result: ${debugResult.reachable ? "✅ REACHABLE" : "❌ UNREACHABLE"}`,
                    ),
                    debugResult.method &&
                      h(
                        "span",
                        { className: "text-muted" },
                        `Method: ${debugResult.method}`,
                      ),
                    debugResult.returncode != null &&
                      h(
                        "span",
                        { className: "text-muted" },
                        `Exit code: ${debugResult.returncode}`,
                      ),
                    debugResult.platform &&
                      h(
                        "span",
                        { className: "text-muted" },
                        `Platform: ${debugResult.platform}`,
                      ),
                  ),
                  debugResult.cmd &&
                    h(
                      "div",
                      { className: "text-ink-secondary" },
                      `Command: ${debugResult.cmd}`,
                    ),
                  debugResult.error &&
                    h(
                      "div",
                      { className: "text-red-400 font-semibold" },
                      `Error: ${debugResult.error}`,
                    ),
                  debugResult.stdout &&
                    h(
                      "div",
                      null,
                      h("div", { className: "text-muted mb-0.5" }, "stdout:"),
                      h(
                        "pre",
                        {
                          className:
                            "whitespace-pre-wrap text-ink bg-white/8 rounded p-2",
                        },
                        debugResult.stdout,
                      ),
                    ),
                  debugResult.stderr &&
                    h(
                      "div",
                      null,
                      h("div", { className: "text-muted mb-0.5" }, "stderr:"),
                      h(
                        "pre",
                        {
                          className:
                            "whitespace-pre-wrap text-red-400 bg-white/8 rounded p-2",
                        },
                        debugResult.stderr,
                      ),
                    ),
                  debugResult.tcp_probe &&
                    h(
                      "div",
                      null,
                      h(
                        "div",
                        { className: "text-muted mb-0.5" },
                        "TCP probe (common ports):",
                      ),
                      h(
                        "div",
                        { className: "flex gap-3 flex-wrap" },
                        Object.entries(debugResult.tcp_probe).map(
                          ([port, ok]) =>
                            h(
                              "span",
                              {
                                key: port,
                                className:
                                  ok === true
                                    ? "text-emerald-400"
                                    : "text-muted",
                              },
                              `${port}: ${ok === true ? "open" : ok === false ? "closed" : ok}`,
                            ),
                        ),
                      ),
                      debugResult.any_tcp_open &&
                        h(
                          "div",
                          { className: "text-emerald-400 font-semibold mt-1" },
                          "✅ TCP reachable — device is online but ICMP may be blocked by firewall",
                        ),
                    ),
                ),
            ),
          ),

          // ── Table ───────────────────────────────────────────────────────
          h(
            Card,
            null,
            h(
              "div",
              { className: "flex items-center gap-3 mb-4 flex-wrap" },
              h(Input, {
                placeholder: "Search ID / IP / MAC…",
                value: filter,
                onChange: setFilter,
                className: "w-56",
              }),
              h(
                "select",
                {
                  value: statusFilter,
                  onChange: (e) => setStatusFilter(e.target.value),
                  className:
                    "px-2 py-1.5 border border-border rounded text-sm bg-panel text-ink",
                },
                h("option", { value: "" }, "All Statuses"),
                DEVICE_STATUSES.map((s) =>
                  h("option", { key: s.value, value: s.value }, s.label),
                ),
              ),
              h(
                "span",
                { className: "text-sm text-muted ml-auto" },
                `${items.length} anchor${items.length !== 1 ? "s" : ""}`,
              ),
              // Manual poll button
              h(
                Button,
                {
                  variant: "ghost",
                  size: "sm",
                  disabled: polling,
                  onClick: handlePollNow,
                  title: "Ping all anchors now (auto-polls every 2.5 min)",
                },
                polling ? "Pinging…" : "📡 Poll Now",
              ),
            ),
            // Poll result message
            pollMsg &&
              h(
                "div",
                {
                  className: `mb-3 px-3 py-2 rounded text-sm ${
                    pollMsg.ok
                      ? "bg-emerald-500/15 text-emerald-400"
                      : "bg-red-500/15 text-red-400"
                  }`,
                },
                pollMsg.text,
              ),
            items.length === 0
              ? h(EmptyState, {
                  icon: "\uD83D\uDCE1",
                  title: "No anchors found",
                  description:
                    "Register a device above or add one via the Setup Wizard.",
                })
              : h(
                  "div",
                  { className: "overflow-x-auto" },
                  h(
                    "table",
                    { className: "w-full text-sm" },
                    h(
                      "thead",
                      null,
                      h(
                        "tr",
                        { className: "border-b border-border" },
                        COLS.map((col) =>
                          h(
                            "th",
                            {
                              key: col,
                              className:
                                "text-left py-3 px-3 text-xs font-medium text-muted uppercase tracking-wider",
                            },
                            col,
                          ),
                        ),
                      ),
                    ),
                    h(
                      "tbody",
                      null,
                      items.map((a) => {
                        const isEditing = editId === a.id;
                        return h(
                          "tr",
                          {
                            key: a.id,
                            className: `border-b border-surface-dim ${isEditing ? "bg-accent-light" : "hover:bg-surface-dim"}`,
                          },
                          // ID
                          h(
                            "td",
                            {
                              className:
                                "py-3 px-3 font-mono font-medium whitespace-nowrap",
                            },
                            a.anchor_id,
                          ),
                          // Type
                          h(
                            "td",
                            { className: "py-3 px-3" },
                            h(
                              Badge,
                              {
                                color:
                                  a.anchor_type === "esp32" ? "purple" : "blue",
                              },
                              a.anchor_type,
                            ),
                          ),
                          // IP
                          h(
                            "td",
                            { className: "py-3 px-3 font-mono text-xs" },
                            a.ip_address || "—",
                          ),
                          // MAC
                          h(
                            "td",
                            { className: "py-3 px-3 font-mono text-xs" },
                            a.mac_address || "—",
                          ),
                          // Device Status
                          h(
                            "td",
                            { className: "py-3 px-3" },
                            isEditing
                              ? h(
                                  "select",
                                  {
                                    value: editData.device_status,
                                    onChange: (e) =>
                                      setEditData((d) => ({
                                        ...d,
                                        device_status: e.target.value,
                                      })),
                                    className:
                                      "px-1.5 py-1 border border-border rounded text-xs bg-panel",
                                  },
                                  DEVICE_STATUSES.map((s) =>
                                    h(
                                      "option",
                                      { key: s.value, value: s.value },
                                      s.label,
                                    ),
                                  ),
                                )
                              : h(DeviceStatusBadge, {
                                  value: a.device_status || "in_stock",
                                }),
                          ),
                          // Flags
                          h(
                            "td",
                            { className: "py-3 px-3 max-w-xs" },
                            isEditing
                              ? h(
                                  "div",
                                  { className: "flex flex-col gap-1" },
                                  ANCHOR_FLAGS.map((af) =>
                                    h(
                                      "label",
                                      {
                                        key: af.value,
                                        className:
                                          "flex items-center gap-1 text-xs cursor-pointer whitespace-nowrap",
                                      },
                                      h("input", {
                                        type: "checkbox",
                                        checked: editData.flags.includes(
                                          af.value,
                                        ),
                                        onChange: () =>
                                          toggleFlag(af.value, editData.flags),
                                      }),
                                      af.label,
                                    ),
                                  ),
                                )
                              : h(FlagBadges, { flags: a.flags }),
                          ),
                          // Connectivity
                          h(
                            "td",
                            { className: "py-3 px-3" },
                            h(
                              "div",
                              { className: "flex items-center gap-1.5" },
                              h(StatusDot, { status: a.status }),
                              h(
                                "span",
                                {
                                  className: `text-xs font-medium ${
                                    a.status === "online"
                                      ? "text-emerald-400"
                                      : a.status === "trying"
                                        ? "text-amber-400"
                                        : a.status === "offline"
                                          ? "text-red-400"
                                          : "text-muted"
                                  }`,
                                },
                                a.status === "trying" ? "trying…" : a.status,
                              ),
                            ),
                          ),
                          // Last Reached
                          h(
                            "td",
                            { className: "py-3 px-3 text-xs text-muted" },
                            a.last_reached
                              ? h(
                                  "span",
                                  {
                                    title: new Date(
                                      a.last_reached,
                                    ).toLocaleString(),
                                  },
                                  (() => {
                                    const diff =
                                      Date.now() -
                                      new Date(a.last_reached).getTime();
                                    const mins = Math.floor(diff / 60000);
                                    const secs = Math.floor(
                                      (diff % 60000) / 1000,
                                    );
                                    if (mins > 60)
                                      return `${Math.floor(mins / 60)}h ago`;
                                    if (mins > 0) return `${mins}m ago`;
                                    return `${secs}s ago`;
                                  })(),
                                )
                              : h(
                                  "span",
                                  { className: "italic text-muted" },
                                  "never",
                                ),
                          ),
                          // Floor
                          h(
                            "td",
                            { className: "py-3 px-3 text-xs text-muted" },
                            a.floor_id
                              ? `Floor ${a.floor_id}`
                              : h(
                                  "span",
                                  { className: "italic" },
                                  "Unassigned",
                                ),
                          ),
                          // Actions
                          h(
                            "td",
                            { className: "py-3 px-3 whitespace-nowrap" },
                            isEditing
                              ? h(
                                  "div",
                                  { className: "flex gap-1" },
                                  h(
                                    Button,
                                    {
                                      size: "sm",
                                      onClick: () => saveEdit(a),
                                      disabled: saving,
                                    },
                                    saving ? "…" : "Save",
                                  ),
                                  h(
                                    Button,
                                    {
                                      size: "sm",
                                      variant: "ghost",
                                      onClick: cancelEdit,
                                    },
                                    "Cancel",
                                  ),
                                )
                              : h(
                                  "div",
                                  { className: "flex gap-1" },
                                  h(
                                    Button,
                                    {
                                      size: "sm",
                                      variant: "secondary",
                                      onClick: () => startEdit(a),
                                    },
                                    "Edit",
                                  ),
                                  h(
                                    "button",
                                    {
                                      onClick: () => handleDelete(a),
                                      className:
                                        "text-muted hover:text-danger transition-colors p-1",
                                      title: "Delete anchor",
                                    },
                                    "\uD83D\uDDD1",
                                  ),
                                ),
                          ),
                        );
                      }),
                    ),
                  ),
                ),
          ),
        );
      }

      const PRIORITY_COLORS = [
        "gray",
        "blue",
        "yellow",
        "orange",
        "red",
        "red",
      ];
      const PRIORITY_LABELS = ["—", "Low", "P2", "P3", "High", "Critical"];

      function TagsTable() {
        const { data, loading, error, reload } = useApi(() =>
          platform.listTags(),
        );
        const [filter, setFilter] = useState("");
        const [showCreate, setShowCreate] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [editForm, setEditForm] = useState({});
        const [form, setForm] = useState({
          tag_id: "",
          name: "",
          device_type: "",
          ssid: "",
          mac_address: "",
          rssi_at_1m_dbm: -22,
          path_loss_n: 4.0,
          security_level: 1,
          priority: 1,
          floor_scope: "ALL",
          room_scope: "",
        });
        const [creating, setCreating] = useState(false);

        const handleTagPollNow = async () => {
          setTagPolling(true);
          setTagPollMsg(null);
          try {
            const res = await platform.pollTagsNow();
            const seen = res.results?.filter((r) => r.seen).length ?? 0;
            const total = res.polled ?? 0;
            setTagPollMsg({
              ok: true,
              text: `Scanned ${total} tag${total !== 1 ? "s" : ""} — ${seen} detected`,
            });
            reload();
          } catch (e) {
            const msg = e.message?.includes("Failed to fetch")
              ? "Cannot reach platform backend — is it running?"
              : e.message;
            setTagPollMsg({ ok: false, text: msg });
          } finally {
            setTagPolling(false);
          }
        };

        const parseScope = (val) =>
          val.trim() === "" || val.trim() === "ALL"
            ? ["ALL"]
            : val
                .split(",")
                .map((s) => s.trim())
                .filter(Boolean);
        const parseScopeRoom = (val) =>
          val.trim() === ""
            ? []

                .split(",")
                .map((s) => s.trim())
                .filter(Boolean);

        const handleCreate = async () => {
          if (!form.tag_id.trim()) return;
          setCreating(true);
          try {
            await platform.createTag({
              ...form,
              tag_id: form.tag_id.trim(),
              name: form.name.trim(),
              rssi_at_1m_dbm: +form.rssi_at_1m_dbm,
              path_loss_n: +form.path_loss_n,
              security_level: +form.security_level,
              priority: +form.priority,
              floor_scope: parseScope(form.floor_scope),
              room_scope: parseScopeRoom(form.room_scope),

              tag_id: "",
              name: "",
              device_type: "",
              ssid: "",
              mac_address: "",
              rssi_at_1m_dbm: -22,
              path_loss_n: 4.0,
              security_level: 1,
              priority: 1,
              floor_scope: "ALL",
              room_scope: "",

            setShowCreate(false);
            reload();

            alert(e.message);
          } finally {
            setCreating(false);
          }
        };

        const startEdit = (t) => {
          setEditingId(t.id);
          setEditForm({
            name: t.name || "",
            device_type: t.device_type || "",
            security_level: t.security_level ?? 1,
            priority: t.priority ?? 1,

            room_scope: (t.room_scope || []).join(", "),

                                    "border border-border rounded px-1 py-0.5 text-xs w-12",
                                  value: editForm.security_level,
                                  onChange: (e) =>

                          ),
                          // Floor Scope
                          h(
                            "td",
                            { className: "py-2 px-2" },
                            isEditing
                              ? h("input", {
                                  className:
                                    "border border-border rounded px-1 py-0.5 text-xs w-28",
                                  value: editForm.floor_scope,
                                  onChange: (e) =>
                                    setEditForm((f) => ({
                                      ...f,
                                      floor_scope: e.target.value,

                                  placeholder: "ALL",

                              : h(
                                  "span",
                                  { className: "text-xs" },

                          ),
                          // Room Scope
                          h(

                            { className: "py-2 px-2" },

                                  value: editForm.room_scope,

                                      room_scope: e.target.value,
                                    })),
                                  placeholder: "blank = all",
                                })
                              : h(
                                  "span",
                                  { className: "text-xs text-muted" },
                                  (t.room_scope || []).length > 0
                                    ? t.room_scope.join(", ")
                                    : "all",

                          ),
                          // Location
                          h(
                            "td",
                            { className: "py-2 px-2" },
                            h(

                              { className: "text-xs" },
                              t.trilateration_location || "—",

                            { className: "py-2 px-2" },
                            isEditing
                              ? h(
                                  "div",
                                  { className: "flex gap-1" },
                                  h(
                                    Button,
                                    {
                                      size: "sm",
                                      onClick: () => handleSaveEdit(t.id),
                                    },
                                    "Save",

                                  h(
                                    Button,
                                    {
                                      size: "sm",
                                      variant: "ghost",
                                      onClick: () => setEditingId(null),

                                  "button",
                                  {
                                    className:
                                      "text-xs text-muted hover:text-ink border border-border rounded px-2 py-0.5",
                                    onClick: () => startEdit(t),
                                  },
                                  "Edit",
                                ),
                          ),

                      }),

                  ),

        );
      }

      const METHOD_INFO = {
        trilateration: {
          label: "Trilateration",
          color: "blue",
          desc: "Distance-based positioning using RSSI path-loss model. Runs every scan cycle as a preview.",
        },
        fingerprinting: {
          label: "Fingerprinting",
          color: "purple",
          desc: "Pattern matching against a pre-recorded radiomap. Requires survey calibration first.",
        },
        gp: {
          label: "Sparse GP",
          color: "teal",
          desc: "Sparse Gaussian Process regression. Predicts continuous (x, y) coordinates with uncertainty from survey data.",
        },
        ble: {
          label: "BLE",
          color: "green",
          desc: "Bluetooth Low Energy proximity. Requires BLE-capable anchors (stub — not yet active).",
        },
        tof: {
          label: "ToF",
          color: "orange",
          desc: "Time-of-Flight trilateration from ESP32-S3 FTM ranging. Raw ranges arrive over MQTT; the engine runs least-squares positioning server-side.",
        },
        raw: {
          label: "Raw Trilat",
          color: "red",
          desc: "Trilateration on unfiltered raw RSSI — no smoothing applied. Use as a noise baseline for comparing filter performance.",

        kalman: {

        },
      };

      // Renders an SVG map of rooms + device dots — used at both small and expanded sizes
      function MethodMapSvg({ rooms, devices, fw, fh, width, height }) {
        const sx = width / (fw || 20),
          sy = height / (fh || 20);
        return h(
          "svg",
          {
            width,
            height,
            viewBox: `0 0 ${width} ${height}`,
            style: {
              background: "#18181b",
              display: "block",
              width: "100%",
              height: "100%",
            },
            preserveAspectRatio: "xMidYMid meet",
          },
          rooms.map((r, ri) =>
            r.polygon?.length
              ? h("polygon", {
                  key: ri,
                  points: r.polygon
                    .map(([px, py]) => `${px * sx},${py * sy}`)
                    .join(" "),
                  fill: "rgba(99,102,241,0.15)",
                  stroke: "#6366f1",
                  strokeWidth: 1,
                })
              : null,
          ),
          rooms.map((r, ri) => {
            if (!r.polygon?.length) return null;
            const cx =
              r.polygon.reduce((s, [px]) => s + px, 0) / r.polygon.length;
            const cy =
              r.polygon.reduce((s, [, py]) => s + py, 0) / r.polygon.length;
            const fontSize = width > 400 ? 13 : 9;
            return h(
              "text",
              {
                key: `lbl-${ri}`,
                x: cx * sx,
                y: cy * sy,
                textAnchor: "middle",
                dominantBaseline: "middle",
                fill: "#a5b4fc",
                fontSize,
              },
              r.name,
            );
          }),
          devices.map((d, di) => {
            const r = width > 400 ? 10 : 6;
            const fs = width > 400 ? 11 : 8;
            return h(
              "g",
              { key: di },
              h("circle", {
                cx: (d.x || 0) * sx,
                cy: (d.y || 0) * sy,
                r,
                fill: d.reachable ? "#22c55e" : "#f87171",
                stroke: "#fff",
                strokeWidth: 1,
              }),
              h(
                "text",
                {
                  x: (d.x || 0) * sx,
                  y: (d.y || 0) * sy - r - 3,
                  textAnchor: "middle",
                  fill: "#e4e4e7",
                  fontSize: fs,
                },
                d.device_id,
              ),
            );
          }),
        );
      }

      // Expanded overlay for a single method map
      function ExpandedMapOverlay({ method, onClose }) {
        const { data } = usePolling(
          () => engine.map(method).catch(() => null),
          2000,
        );
        const rooms = data?.rooms || [];
        const devices = data?.devices || [];
        const floor = data?.floor || {};
        const mi = METHOD_INFO[method] || {};

        return h(
          "div",
          {
            className: "fixed inset-0 z-50 flex items-center justify-center",
            style: {
              background: "rgba(0,0,0,0.6)",
              backdropFilter: "blur(4px)",
            },
            onClick: (e) => {
              if (e.target === e.currentTarget) onClose();
            },
          },
          h(
            "div",
            {
              className:
                "bg-panel border border-border rounded-xl shadow-2xl overflow-hidden",
              style: {
                width: "80vw",
                maxWidth: 900,
                height: "70vh",
                maxHeight: 650,
              },
            },
            // Header
            h(
              "div",
              {
                className:
                  "flex items-center justify-between px-5 py-3 border-b border-border bg-surface-dim",
              },
              h(
                "div",
                { className: "flex items-center gap-3" },
                h(Badge, { color: mi.color || "gray" }, mi.label || method),
                h(
                  "span",
                  { className: "text-sm text-muted" },

              h(

            h(
              "div",
              { style: { height: "calc(100% - 90px)" }, className: "p-2" },

                rooms,
                devices,
                fw: floor.width_m || 20,
                fh: floor.height_m || 20,

                    )
                    .join("   ·   "),
            ),
          ),
        );
      }

      // Try pywebview native window first, fall back to in-app overlay
      function _popOutMap(method, fallbackExpand) {
        if (window.pywebview && window.pywebview.api) {
          // Desktop app — open a real native OS window on any monitor
          window.pywebview.api.open_map_window(method).catch(() => {
            // If the native call fails, fall back to in-app overlay
            fallbackExpand && fallbackExpand(method);
          });
        } else {
          // Browser dev mode — use in-app overlay
          fallbackExpand && fallbackExpand(method);
        }
      }

              h(
                "button",
                {
                  className:
                    "text-xs text-muted hover:text-ink px-1.5 py-0.5 rounded hover:bg-panel border border-border",
                  title: "Open in separate OS window (drag to any monitor)",
                  onClick: () => _popOutMap(method, onExpand),
                },
                "⧉ pop out",
              ),
            ),
          ),
          h(MethodMapSvg, {
            rooms,
            devices,
            fw: floor.width_m || 20,
            fh: floor.height_m || 20,
            width: 260,
            height: 180,
          }),
        );
      }

      // ─── SURVEY PAGE ─────────────────────────────────────────────────────────

      function SurveyPage() {
        const [roomInput, setRoomInput] = useState("");
        const [ssidInput, setSsidInput] = useState("");
        const [samples, setSamples] = useState(10);
        const [msg, setMsg] = useState(null);
        const [deleting, setDeleting] = useState(null);
        const [confirmDelete, setConfirmDelete] = useState(null);
        const [loadingCfg, setLoadingCfg] = useState(false);
        const [selectedCampusId, setSelectedCampusId] = useState(null);
        const [selectedBuilding, setSelectedBuilding] = useState("");
        const [selectedFloor, setSelectedFloor] = useState("");
        // Vector viewer state
        const [viewingRoom, setViewingRoom] = useState(null);
        const [roomVectors, setRoomVectors] = useState(null);
        const [vectorsLoading, setVectorsLoading] = useState(false);

        // Campus hierarchy for location selector
        const { data: campuses } = useApi(() => platform.listCampuses());
        useEffect(() => {
          if (campuses?.length && !selectedCampusId) {
            const c = campuses[0];
            setSelectedCampusId(c.id);
            const b = c.buildings?.[0];
            if (b) {
              setSelectedBuilding(b.name);
              setSelectedFloor(b.floors?.[0]?.name ?? "");
            }
          }
        }, [campuses]);

        const activeCampus = campuses?.find((c) => c.id === selectedCampusId);
        const activeBuilding = activeCampus?.buildings?.find(
          (b) => b.name === selectedBuilding,
        );

        // Check engine health — if engine isn't reachable, show a clear message
        const { data: engHealth } = usePolling(
          () => engine.health().catch(() => null),
          4000,
        );
        const engineReachable = engHealth?.ok === true;
        const enginePollActive = engHealth?.poll_running === true;

        // Poll survey status while running, slower when idle
        const { data: surveyStatus } = usePolling(
          () =>
            engineReachable ? engine.surveyStatus().catch(() => null) : null,
          2000,
          [engineReachable],
        );

        // Poll radiomap summary
        const { data: radiomapData, error: rmError } = usePolling(
          () =>
            engineReachable ? engine.surveyRadiomap().catch(() => null) : null,
          5000,
          [engineReachable],
        );

        // Load configured target SSIDs from the engine
        const { data: targetsData, reload: reloadTargets } = useApi(() =>
          engineReachable
            ? engine.surveyTargets().catch(() => null)
            : Promise.resolve(null),
        );

        // Registered tags from the platform DB (for SSID combo suggestions)
        const { data: tagsData } = useApi(() =>
          platform.listTags({ limit: 200 }).catch(() => null),
        );
        const _tagsList = Array.isArray(tagsData)
          ? tagsData
          : (tagsData?.items ?? []);
        const registeredTagSsids = _tagsList
          .map((t) => ({ ssid: t.ssid, label: t.name || t.tag_id }))
          .filter((t) => t.ssid);

        const [showDebug, setShowDebug] = React.useState(false);

        const isRunning = surveyStatus?.status === "running";
        const isDone = surveyStatus?.status === "done";
        const progress = surveyStatus?.progress_pct ?? 0;
        const collected = surveyStatus?.collected_samples ?? 0;
        const total = surveyStatus?.total_samples ?? 0;
        const targets = targetsData?.targets ?? [];
        const rmRooms = radiomapData?.rooms ?? {};
        const rmExists = radiomapData?.exists ?? false;
        const totalRooms = radiomapData?.total_rooms ?? 0;

        // Poll survey activity logs — faster while a survey is running
        // (must be after isRunning is defined so the interval value is correct)
        const { data: surveyLogs } = usePolling(
          () =>
            platform
              .listEngineLogs({ source: "survey", limit: 30 })
              .catch(() => null),
          isRunning ? 3000 : 10000,
          [isRunning],
        );

        const STATUS_STYLE = {
          idle: "text-ink-secondary",
          running: "text-sky-400 font-semibold",
          done: "text-emerald-400 font-semibold",
          cancelled: "text-amber-400",
          error: "text-red-400 font-semibold",
        };

        const handleLoadConfig = async () => {
          if (!selectedCampusId) {
            setMsg({ ok: false, text: "Select a campus first." });
            return;
          }
          setLoadingCfg(true);
          setMsg(null);
          try {
            await platform.engineLoadConfig(
              selectedCampusId,
              selectedBuilding || undefined,
              selectedFloor || undefined,
            );
            setMsg({
              ok: true,
              text: "Config loaded — engine knows its APs and targets.",
            });
            reloadTargets();
          } catch (e) {
            setMsg({ ok: false, text: `Config load failed: ${e.message}` });
          } finally {
            setLoadingCfg(false);
          }
        };

        const handleStart = async () => {
          if (!roomInput.trim()) {
            setMsg({ ok: false, text: "Enter a room name." });
            return;
          }
          if (!engineReachable) {
            setMsg({
              ok: false,
              text: "Engine is not reachable on port 8000 — cannot start survey.",
            });
            return;
          }
          if (enginePollActive) {
            setMsg({
              ok: false,
              text: "Localization poll is active — stop it first on the Localization page.",
            });
            return;
          }
          setMsg(null);
          // Auto-push config before starting so env is always ready
          try {
            if (selectedCampusId) {
              await platform.engineLoadConfig(
                selectedCampusId,
                selectedBuilding || undefined,
                selectedFloor || undefined,
              );
            }
          } catch (cfgErr) {
            // Show as a non-blocking warning — engine may already have config
            console.warn("Config auto-push failed:", cfgErr);
          }
          try {
            await engine.surveyStart(
              roomInput.trim(),
              ssidInput.trim() || undefined,
              samples,
            );
            setMsg({
              ok: true,
              text: `Survey started for "${roomInput.trim()}".`,
            });
          } catch (e) {
            const txt = e.message?.includes("Failed to fetch")
              ? "Cannot reach engine on port 8000 — make sure it is running."
              : e.message;
            setMsg({ ok: false, text: txt });
          }
        };

        const handleCancel = async () => {
          try {
            await engine.surveyCancel();
            setMsg({ ok: true, text: "Survey cancelled." });
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          }
        };

        const handleDeleteRoom = async (room) => {
          if (confirmDelete !== room) {
            setConfirmDelete(room);
            return;
          }
          setConfirmDelete(null);
          setDeleting(room);
          try {
            await engine.surveyDeleteRoom(room);
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setDeleting(null);
          }
        };

        return h(
          "div",
          { className: "p-6 max-w-5xl mx-auto space-y-6" },

          // ── Header ────────────────────────────────────────────────────────
          h(
            "div",
            { className: "flex items-center justify-between" },
            h(
              "div",
              null,
              h(
                "h1",
                { className: "text-xl font-semibold text-ink" },
                "Site Survey",
              ),
              h(
                "p",
                { className: "text-sm text-muted mt-0.5" },
                "Calibrate the fingerprint radiomap — stand still in each room and collect RSSI samples.",
              ),
            ),
            rmExists &&
              h(
                "span",
                {
                  className:
                    "text-xs bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-medium",
                },
                `${totalRooms} room${totalRooms !== 1 ? "s" : ""} in radiomap`,
              ),
          ),

          // ── Debug Panel ────────────────────────────────────────────────────
          h(
            "div",
            {
              className:
                "bg-surface-dim border border-border rounded-lg p-3 text-xs space-y-2",
            },
            h(
              "button",
              {
                onClick: () => setShowDebug(!showDebug),
                className:
                  "text-muted hover:text-ink font-mono cursor-pointer underline",
              },
              `${showDebug ? "▼" : "▶"} Debug: Registered Tags (${registeredTagSsids.length} found)`,
            ),
            showDebug &&
              h(
                "div",
                {
                  className:
                    "font-mono text-xs space-y-1 bg-surface rounded p-2",
                },
                _tagsList.length > 0
                  ? h(
                      React.Fragment,
                      null,
                      h("div", null, `Raw tags fetched: ${_tagsList.length}`),
                      _tagsList.map((t) =>
                        h(
                          "div",
                          {
                            key: t.tag_id,
                            className: t.ssid
                              ? "text-emerald-400"
                              : "text-red-400",
                          },
                          `• ${t.tag_id} | name="${t.name || "—"}" | ssid="${t.ssid || "—"}" | enabled=${t.enabled}`,
                        ),
                      ),
                      h("div", {
                        className: "border-t border-border mt-1 pt-1",
                      }),
                      h(
                        "div",
                        null,
                        `Filtered (with SSID): ${registeredTagSsids.length}`,
                      ),
                      registeredTagSsids.map((t) =>
                        h(
                          "div",
                          { key: t.ssid, className: "text-emerald-400" },
                          `✓ ${t.ssid} (${t.label})`,
                        ),
                      ),
                    )
                  : h("div", { className: "text-muted" }, "Loading tags..."),
              ),
          ),

          // ── Two-column layout ──────────────────────────────────────────────
          h(
            "div",
            { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },

            // ── LEFT: Survey Controls ──────────────────────────────────────
            h(
              "div",
              {
                className:
                  "bg-panel rounded-xl border border-border p-5 space-y-4",
              },

              h(
                "h2",
                {
                  className:
                    "text-sm font-semibold text-ink-secondary uppercase tracking-wide",
                },
                "Survey Controls",
              ),

              // ── Location selector (drives which config.yaml gets generated) ─
              h(
                "div",
                { className: "space-y-2 pb-3 border-b border-border" },
                h(
                  "div",
                  { className: "flex items-center justify-between" },
                  h(
                    "p",
                    { className: "text-xs font-medium text-ink-secondary" },
                    "Location",
                  ),
                  h(
                    "button",
                    {
                      className:
                        "text-xs px-2 py-0.5 rounded border border-border text-muted hover:text-ink disabled:opacity-40",
                      disabled: loadingCfg || isRunning,
                      onClick: handleLoadConfig,
                    },
                    loadingCfg ? "Loading…" : "Load Config",
                  ),
                ),
                h(
                  "div",
                  { className: "grid grid-cols-3 gap-2" },
                  // Campus
                  h(
                    "select",
                    {
                      value: selectedCampusId ?? "",
                      onChange: (e) => {
                        const id = Number(e.target.value);
                        setSelectedCampusId(id);
                        const c = campuses?.find((x) => x.id === id);
                        const b = c?.buildings?.[0];
                        setSelectedBuilding(b?.name ?? "");
                        setSelectedFloor(b?.floors?.[0]?.name ?? "");
                      },
                      disabled: isRunning,
                      className:
                        "text-xs px-2 py-1 rounded border border-border bg-surface",
                    },
                    (campuses || []).map((c) =>
                      h("option", { key: c.id, value: c.id }, c.name),
                    ),
                  ),
                  // Building
                  h(
                    "select",
                    {
                      value: selectedBuilding,
                      onChange: (e) => {
                        setSelectedBuilding(e.target.value);
                        const b = activeCampus?.buildings?.find(
                          (x) => x.name === e.target.value,
                        );
                        setSelectedFloor(b?.floors?.[0]?.name ?? "");
                      },
                      disabled: isRunning,
                      className:
                        "text-xs px-2 py-1 rounded border border-border bg-surface",
                    },
                    (activeCampus?.buildings || []).map((b) =>
                      h("option", { key: b.name, value: b.name }, b.name),
                    ),
                  ),
                  // Floor
                  h(
                    "select",
                    {
                      value: selectedFloor,
                      onChange: (e) => setSelectedFloor(e.target.value),
                      disabled: isRunning,
                      className:
                        "text-xs px-2 py-1 rounded border border-border bg-surface",
                    },
                    (activeBuilding?.floors || []).map((f) =>
                      h("option", { key: f.name, value: f.name }, f.name),
                    ),
                  ),
                ),
                h(
                  "p",
                  { className: "text-xs text-muted" },
                  "Config is auto-loaded when you start a survey. Click 'Load Config' to refresh targets.",
                ),
              ),

              // Room name
              h(
                "div",
                { className: "space-y-1" },
                h(
                  "label",
                  { className: "text-xs font-medium text-ink-secondary" },
                  "Room Name",
                ),
                h("input", {
                  type: "text",
                  value: roomInput,
                  onChange: (e) => setRoomInput(e.target.value),
                  placeholder: "e.g. 324A, Hallway, Lab",
                  disabled: isRunning,
                  className:
                    "w-full px-3 py-1.5 text-sm rounded-md border border-border bg-surface focus:outline-none focus:ring-2 focus:ring-primary/40 disabled:opacity-50",
                }),
              ),

              // Target SSID — free-type or pick a registered tag / configured target
              h(
                "div",
                { className: "space-y-1" },
                h(
                  "label",
                  { className: "text-xs font-medium text-ink-secondary" },
                  "Target SSID",
                  targets.length > 0 &&
                    h(
                      "span",
                      { className: "ml-1 text-muted font-normal" },
                      `(configured: ${targets.join(", ")})`,
                    ),
                ),
                h(
                  "select",
                  {
                    value: ssidInput,
                    onChange: (e) => setSsidInput(e.target.value),
                    disabled: isRunning,
                    className:
                      "w-full px-3 py-1.5 text-sm rounded-md border border-border bg-surface focus:outline-none focus:ring-2 focus:ring-primary/40 disabled:opacity-50",
                  },
                  [
                    h(
                      "option",
                      { key: "__blank", value: "" },
                      "— Select a target SSID —",
                    ),
                    // Registered tags
                    ...registeredTagSsids.map((t) =>
                      h(
                        "option",
                        { key: `tag-${t.ssid}`, value: t.ssid },
                        t.label && t.label !== t.ssid
                          ? `${t.label} (${t.ssid})`
                          : t.ssid,
                      ),
                    ),
                    // Any configured targets not already listed
                    ...targets
                      .filter(
                        (s) => !registeredTagSsids.some((t) => t.ssid === s),
                      )
                      .map((s) =>
                        h("option", { key: `cfg-${s}`, value: s }, s),
                      ),
                  ],
                ),
                h(
                  "p",
                  { className: "text-xs text-muted" },
                  registeredTagSsids.length > 0
                    ? `${registeredTagSsids.length} registered tag${registeredTagSsids.length !== 1 ? "s" : ""} available. Leave blank to use first configured target.`
                    : "Leave blank to use the first configured target.",
                ),
              ),

              // Sample count
              h(
                "div",
                { className: "space-y-1" },
                h(
                  "div",
                  { className: "flex justify-between" },
                  h(
                    "label",
                    { className: "text-xs font-medium text-ink-secondary" },
                    "Samples",
                  ),
                  h(
                    "span",
                    { className: "text-xs font-semibold text-ink" },
                    samples,
                  ),
                ),
                h("input", {
                  type: "range",
                  min: 3,
                  max: 50,
                  step: 1,
                  value: samples,
                  onChange: (e) => setSamples(Number(e.target.value)),
                  disabled: isRunning,
                  className: "w-full accent-primary",
                }),
                h(
                  "div",
                  { className: "flex justify-between text-xs text-muted" },
                  h("span", null, "3 (quick)"),
                  h("span", null, "50 (thorough)"),
                ),
              ),

              // Engine status banners
              !engineReachable &&
                h(
                  "div",
                  {
                    className:
                      "flex items-start gap-2 text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2",
                  },
                  h("span", null, "❌"),
                  h(
                    "span",
                    null,
                    "Engine is not reachable (port 8000). Make sure the Hybrid engine is running. ",
                    "The desktop app should start it automatically — try restarting the app.",
                  ),
                ),
              engineReachable &&
                enginePollActive &&
                h(
                  "div",
                  {
                    className:
                      "flex items-start gap-2 text-xs text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-lg px-3 py-2",
                  },
                  h("span", null, "⚠"),
                  h(
                    "span",
                    null,
                    "The localization engine poll is active — stop it before surveying. ",
                    "Go to Localization → Stop.",
                  ),
                ),
              engineReachable &&
                !enginePollActive &&
                h(
                  "div",
                  {
                    className:
                      "flex items-start gap-2 text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded-lg px-3 py-2",
                  },
                  h("span", null, "✅"),
                  h("span", null, "Engine ready — you can start a survey."),
                ),

              // Buttons
              h(
                "div",
                { className: "flex gap-2 pt-1" },
                !isRunning
                  ? h(
                      "button",
                      {
                        onClick: handleStart,
                        disabled:
                          !roomInput.trim() ||
                          !engineReachable ||
                          enginePollActive,
                        className:
                          "flex-1 py-2 px-4 rounded-lg text-sm font-medium bg-primary text-white hover:bg-primary-hover disabled:opacity-40 disabled:cursor-not-allowed transition-colors",
                      },
                      "▶ Start Survey",
                    )
                  : h(
                      "button",
                      {
                        onClick: handleCancel,
                        className:
                          "flex-1 py-2 px-4 rounded-lg text-sm font-medium bg-red-600 text-white hover:bg-red-700 transition-colors",
                      },
                      "⏹ Cancel",
                    ),
              ),

              // Status / message
              msg &&
                h(
                  "div",
                  {
                    className: `text-sm px-3 py-2 rounded-lg ${
                      msg.ok
                        ? "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30"
                        : "bg-red-500/15 text-red-400 border border-red-500/30"
                    }`,
                  },
                  msg.text,
                ),

              // Live progress
              surveyStatus &&
                surveyStatus.status !== "idle" &&
                h(
                  "div",
                  { className: "space-y-2 pt-1" },
                  h(
                    "div",
                    { className: "flex justify-between items-center" },
                    h(
                      "span",
                      { className: "text-xs font-medium text-ink-secondary" },
                      surveyStatus.room_label
                        ? `Room: ${surveyStatus.room_label}`
                        : "Survey",
                    ),
                    h(
                      "span",
                      {
                        className: `text-xs ${STATUS_STYLE[surveyStatus.status] || ""}`,
                      },
                      surveyStatus.status === "running"
                        ? `${collected} / ${total} samples`
                        : surveyStatus.status.charAt(0).toUpperCase() +
                            surveyStatus.status.slice(1),
                    ),
                  ),
                  // Progress bar
                  h(
                    "div",
                    {
                      className:
                        "w-full h-2 bg-surface-dim rounded-full overflow-hidden",
                    },
                    h("div", {
                      className: `h-full rounded-full transition-all duration-300 ${
                        surveyStatus.status === "done"
                          ? "bg-emerald-500"
                          : surveyStatus.status === "error"
                            ? "bg-red-500"
                            : "bg-sky-500"
                      }`,
                      style: { width: `${progress}%` },
                    }),
                  ),
                  surveyStatus.error &&
                    h(
                      "p",
                      { className: "text-xs text-red-400" },
                      surveyStatus.error,
                    ),
                  surveyStatus.target_ssid &&
                    h(
                      "p",
                      { className: "text-xs text-muted" },
                      `SSID: ${surveyStatus.target_ssid}`,
                    ),
                ),
            ),

            // ── RIGHT: Radiomap Coverage ───────────────────────────────────
            h(
              "div",
              {
                className:
                  "bg-panel rounded-xl border border-border p-5 space-y-4",
              },

              h(
                "div",
                { className: "flex items-center justify-between" },
                h(
                  "h2",
                  {
                    className:
                      "text-sm font-semibold text-ink-secondary uppercase tracking-wide",
                  },
                  "Radiomap Coverage",
                ),
                !rmExists &&
                  h(
                    "span",
                    { className: "text-xs text-muted italic" },
                    "No radiomap yet",
                  ),
              ),

              rmError &&
                h(
                  "p",
                  { className: "text-xs text-red-400" },
                  "Could not load radiomap — is the engine running?",
                ),

              !rmExists
                ? h(
                    "div",
                    {
                      className:
                        "flex flex-col items-center justify-center py-12 text-center space-y-2",
                    },
                    h("div", { className: "text-4xl opacity-30" }, "📋"),
                    h(
                      "p",
                      { className: "text-sm text-muted" },
                      "Start a survey to begin building the radiomap.",
                    ),
                    h(
                      "p",
                      { className: "text-xs text-muted" },
                      "Each surveyed room adds fingerprint vectors that improve localization accuracy.",
                    ),
                  )
                : h(
                    "div",
                    { className: "space-y-1 overflow-y-auto max-h-96" },
                    Object.entries(rmRooms)
                      .sort(([a], [b]) => a.localeCompare(b))
                      .map(([room, info]) =>
                        h(
                          "div",
                          {
                            key: room,
                            className:
                              "flex items-center justify-between px-3 py-2 rounded-lg hover:bg-surface-dim group transition-colors",
                          },
                          h(
                            "div",
                            { className: "flex items-center gap-3 min-w-0" },
                            h(
                              "span",
                              {
                                className:
                                  "text-sm font-medium text-ink truncate",
                              },
                              room,
                            ),
                            h(
                              "span",
                              {
                                className:
                                  "text-xs bg-sky-500/10 text-sky-400 border border-sky-500/30 px-1.5 py-0.5 rounded-full whitespace-nowrap",
                              },
                              `${info.sample_count} samples`,
                            ),
                            info.ap_count > 0 &&
                              h(
                                "span",
                                {
                                  className:
                                    "text-xs text-muted whitespace-nowrap",
                                },
                                `${info.ap_count} AP${info.ap_count !== 1 ? "s" : ""}`,
                              ),
                          ),
                          // Inspect vectors button
                          h(
                            "button",
                            {
                              onClick: async () => {
                                setViewingRoom(room);
                                setRoomVectors(null);
                                setVectorsLoading(true);
                                try {
                                  const data =
                                    await engine.surveyRoomVectors(room);
                                  setRoomVectors(data);
                                } catch (e) {
                                  setRoomVectors({ error: String(e) });
                                } finally {
                                  setVectorsLoading(false);
                                }
                              },
                              title: "Inspect stored RSSI vectors",
                              className:
                                "text-xs px-2 py-1 rounded text-sky-400 hover:bg-sky-500/15 transition-colors opacity-0 group-hover:opacity-100",
                            },
                            "🔍",
                          ),
                          // Delete button
                          h(
                            "button",
                            {
                              onClick: () => handleDeleteRoom(room),
                              disabled: deleting === room,
                              title:
                                confirmDelete === room
                                  ? "Click again to confirm deletion"
                                  : "Delete room from radiomap",
                              className: `text-xs px-2 py-1 rounded transition-colors opacity-0 group-hover:opacity-100 ${
                                confirmDelete === room
                                  ? "bg-red-500/15 text-red-400 border border-red-500/30 opacity-100"
                                  : "text-muted hover:text-red-400 hover:bg-red-500/15"
                              }`,
                            },
                            deleting === room
                              ? "…"
                              : confirmDelete === room
                                ? "Confirm delete"
                                : "✕",
                          ),
                        ),
                      ),
                  ),

              // Hint on coverage quality
              rmExists &&
                h(

                  {
                    className: `text-xs px-3 py-2 rounded-lg border mt-2 ${

                    }`,

                  totalRooms >= 5
                    ? `✓ Good coverage — ${totalRooms} rooms surveyed. Fingerprinting is ready.`

                },
                // Header
                h(
