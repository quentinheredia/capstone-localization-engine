            width: 260,
            height: 170,
            methodColor: mi.color,
            focusRoomId: selectedRoomId,
          }),
        );
      }

      // ─── SURVEY PAGE ─────────────────────────────────────────────────────────

      function SurveyPage() {
        const [roomInput, setRoomInput] = useState("");
        const [ssidInput, setSsidInput] = useState("");
        const [samples, setSamples] = useState(10);
        const [msg, setMsg] = useState(null);
        const [deleting, setDeleting] = useState(null);
        const [confirmDelete, setConfirmDelete] = useState(null);
        const [loadingCfg, setLoadingCfg] = useState(false);
        const [selectedCampusId, setSelectedCampusId] = useState(null);
        const [selectedBuilding, setSelectedBuilding] = useState("");
        const [selectedFloor, setSelectedFloor] = useState("");
        // Vector viewer state
        const [viewingRoom, setViewingRoom] = useState(null);
        const [roomVectors, setRoomVectors] = useState(null);
        const [vectorsLoading, setVectorsLoading] = useState(false);

        // Campus hierarchy for location selector
        const { data: campuses } = useApi(() => platform.listCampuses());
        useEffect(() => {
          if (campuses?.length && !selectedCampusId) {
            const c = campuses[0];
            setSelectedCampusId(c.id);
            const b = c.buildings?.[0];
            if (b) {
              setSelectedBuilding(b.name);
              setSelectedFloor(b.floors?.[0]?.name ?? "");
            }
          }
        }, [campuses]);

        const activeCampus = campuses?.find((c) => c.id === selectedCampusId);
        const activeBuilding = activeCampus?.buildings?.find(
          (b) => b.name === selectedBuilding,
        );

        // Check engine health — if engine isn't reachable, show a clear message
        const { data: engHealth } = usePolling(
          () => engine.health().catch(() => null),
          4000,
        );
        const engineReachable = engHealth?.ok === true;
        const enginePollActive = engHealth?.poll_running === true;

        // Poll survey status while running, slower when idle
        const { data: surveyStatus } = usePolling(
          () =>
            engineReachable ? engine.surveyStatus().catch(() => null) : null,
          2000,
          [engineReachable],
        );

        // Poll radiomap summary
        const { data: radiomapData, error: rmError } = usePolling(
          () =>
            engineReachable ? engine.surveyRadiomap().catch(() => null) : null,
          5000,
          [engineReachable],
        );

        // Load configured target SSIDs from the engine
        const { data: targetsData, reload: reloadTargets } = useApi(() =>
          engineReachable
            ? engine.surveyTargets().catch(() => null)
            : Promise.resolve(null),
        );

        // Registered tags from the platform DB (for SSID combo suggestions)
        const { data: tagsData } = useApi(() =>
          platform.listTags({ limit: 200 }).catch(() => null),
        );
        const _tagsList = Array.isArray(tagsData)
          ? tagsData
          : (tagsData?.items ?? []);
        const registeredTagSsids = _tagsList
          .map((t) => ({ ssid: t.ssid, label: t.name || t.tag_id }))
          .filter((t) => t.ssid);

        const [showDebug, setShowDebug] = React.useState(false);

        const isRunning = surveyStatus?.status === "running";
        const isDone = surveyStatus?.status === "done";
        const progress = surveyStatus?.progress_pct ?? 0;
        const collected = surveyStatus?.collected_samples ?? 0;
        const total = surveyStatus?.total_samples ?? 0;
        const targets = targetsData?.targets ?? [];
        const rmRooms = radiomapData?.rooms ?? {};
        const rmExists = radiomapData?.exists ?? false;
        const totalRooms = radiomapData?.total_rooms ?? 0;

        // Poll survey activity logs — faster while a survey is running
        // (must be after isRunning is defined so the interval value is correct)
        const { data: surveyLogs } = usePolling(
          () =>
            platform
              .listEngineLogs({ source: "survey", limit: 30 })
              .catch(() => null),
          isRunning ? 3000 : 10000,
          [isRunning],
        );

        const STATUS_STYLE = {
          idle: "text-ink-secondary",
          running: "text-sky-400 font-semibold",
          done: "text-emerald-400 font-semibold",
          cancelled: "text-amber-400",
          error: "text-red-400 font-semibold",
        };

        const handleLoadConfig = async () => {
          if (!selectedCampusId) {
            setMsg({ ok: false, text: "Select a campus first." });
            return;
          }
          setLoadingCfg(true);
          setMsg(null);
          try {
            await platform.engineLoadConfig(
              selectedCampusId,
              selectedBuilding || undefined,
              selectedFloor || undefined,
            );
            setMsg({
              ok: true,
              text: "Config loaded — engine knows its APs and targets.",
            });
            reloadTargets();
          } catch (e) {
            setMsg({ ok: false, text: `Config load failed: ${e.message}` });
          } finally {
            setLoadingCfg(false);
          }
        };

        const handleStart = async () => {
          if (!roomInput.trim()) {
            setMsg({ ok: false, text: "Enter a room name." });
            return;
          }
          if (!engineReachable) {
            setMsg({
              ok: false,
              text: "Engine is not reachable on port 8000 — cannot start survey.",
            });
            return;
          }
          if (enginePollActive) {
            setMsg({
              ok: false,
              text: "Localization poll is active — stop it first on the Localization page.",
            });
            return;
          }
          setMsg(null);
          // Auto-push config before starting so env is always ready
          try {
            if (selectedCampusId) {
              await platform.engineLoadConfig(
                selectedCampusId,
                selectedBuilding || undefined,
                selectedFloor || undefined,
              );
            }
          } catch (cfgErr) {
            // Show as a non-blocking warning — engine may already have config
            console.warn("Config auto-push failed:", cfgErr);
          }
          try {
            await engine.surveyStart(
              roomInput.trim(),
              ssidInput.trim() || undefined,
              samples,
            );
            setMsg({
              ok: true,
              text: `Survey started for "${roomInput.trim()}".`,
            });
          } catch (e) {
            const txt = e.message?.includes("Failed to fetch")
              ? "Cannot reach engine on port 8000 — make sure it is running."
              : e.message;
            setMsg({ ok: false, text: txt });
          }
        };

        const handleCancel = async () => {
          try {
            await engine.surveyCancel();
            setMsg({ ok: true, text: "Survey cancelled." });
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          }
        };

        const handleDeleteRoom = async (room) => {
          if (confirmDelete !== room) {
            setConfirmDelete(room);
            return;
          }
          setConfirmDelete(null);
          setDeleting(room);
          try {
            await engine.surveyDeleteRoom(room);
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setDeleting(null);
          }
        };

        return h(
          "div",
          { className: "p-6 max-w-5xl mx-auto space-y-6" },

          // ── Header ────────────────────────────────────────────────────────
          h(
            "div",
            { className: "flex items-center justify-between" },
            h(
              "div",
              null,
              h(
                "h1",
                { className: "text-xl font-semibold text-ink" },
                "Site Survey",
              ),
              h(
                "p",
                { className: "text-sm text-muted mt-0.5" },
                "Calibrate the fingerprint radiomap — stand still in each room and collect RSSI samples.",
              ),
            ),
            rmExists &&
              h(
                "span",
                {
                  className:
                    "text-xs bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-medium",
                },
                `${totalRooms} room${totalRooms !== 1 ? "s" : ""} in radiomap`,
              ),
          ),

          // ── Debug Panel ────────────────────────────────────────────────────
          h(
            "div",
            {
              className:
                "bg-surface-dim border border-border rounded-lg p-3 text-xs space-y-2",
            },
            h(
              "button",
              {
                onClick: () => setShowDebug(!showDebug),
                className:
                  "text-muted hover:text-ink font-mono cursor-pointer underline",
              },
              `${showDebug ? "▼" : "▶"} Debug: Registered Tags (${registeredTagSsids.length} found)`,
            ),
            showDebug &&
              h(
                "div",
                {
                  className:
                    "font-mono text-xs space-y-1 bg-surface rounded p-2",
                },
                _tagsList.length > 0
                  ? h(
                      React.Fragment,
                      null,
                      h("div", null, `Raw tags fetched: ${_tagsList.length}`),
                      _tagsList.map((t) =>
                        h(
                          "div",
                          {
                            key: t.tag_id,
                            className: t.ssid
                              ? "text-emerald-400"
                              : "text-red-400",
                          },
                          `• ${t.tag_id} | name="${t.name || "—"}" | ssid="${t.ssid || "—"}" | enabled=${t.enabled}`,
                        ),
                      ),
                      h("div", {
                        className: "border-t border-border mt-1 pt-1",
                      }),
                      h(
                        "div",
                        null,
                        `Filtered (with SSID): ${registeredTagSsids.length}`,
                      ),
                      registeredTagSsids.map((t) =>
                        h(
                          "div",
                          { key: t.ssid, className: "text-emerald-400" },
                          `✓ ${t.ssid} (${t.label})`,
                        ),
                      ),
                    )
                  : h("div", { className: "text-muted" }, "Loading tags..."),
              ),
          ),

          // ── Two-column layout ──────────────────────────────────────────────
          h(
            "div",
            { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },

            // ── LEFT: Survey Controls ──────────────────────────────────────
            h(
              "div",
              {
                className:
                  "bg-panel rounded-xl border border-border p-5 space-y-4",
              },

              h(
                "h2",
                {
                  className:
                    "text-sm font-semibold text-ink-secondary uppercase tracking-wide",
                },
                "Survey Controls",
              ),

              // ── Location selector (drives which config.yaml gets generated) ─
              h(
                "div",
                { className: "space-y-2 pb-3 border-b border-border" },
                h(
                  "div",
                  { className: "flex items-center justify-between" },
                  h(
                    "p",
                    { className: "text-xs font-medium text-ink-secondary" },
                    "Location",
                  ),
                  h(
                    "button",
                    {
                      className:
                        "text-xs px-2 py-0.5 rounded border border-border text-muted hover:text-ink disabled:opacity-40",
                      disabled: loadingCfg || isRunning,
                      onClick: handleLoadConfig,
                    },
                    loadingCfg ? "Loading…" : "Load Config",
                  ),
                ),
                h(
                  "div",
                  { className: "grid grid-cols-3 gap-2" },
                  // Campus
                  h(
                    "select",
                    {
                      value: selectedCampusId ?? "",
                      onChange: (e) => {
                        const id = Number(e.target.value);
                        setSelectedCampusId(id);
                        const c = campuses?.find((x) => x.id === id);
                        const b = c?.buildings?.[0];
                        setSelectedBuilding(b?.name ?? "");
                        setSelectedFloor(b?.floors?.[0]?.name ?? "");
                      },
                      disabled: isRunning,
                      className:
                        "text-xs px-2 py-1 rounded border border-border bg-surface",
                    },
                    (campuses || []).map((c) =>
                      h("option", { key: c.id, value: c.id }, c.name),
                    ),
                  ),
                  // Building
                  h(
                    "select",
                    {
                      value: selectedBuilding,
                      onChange: (e) => {
                        setSelectedBuilding(e.target.value);
                        const b = activeCampus?.buildings?.find(
                          (x) => x.name === e.target.value,
                        );
                        setSelectedFloor(b?.floors?.[0]?.name ?? "");
                      },
                      disabled: isRunning,
                      className:
                        "text-xs px-2 py-1 rounded border border-border bg-surface",
                    },
                    (activeCampus?.buildings || []).map((b) =>
                      h("option", { key: b.name, value: b.name }, b.name),
                    ),
                  ),
                  // Floor
                  h(
                    "select",
                    {
                      value: selectedFloor,
                      onChange: (e) => setSelectedFloor(e.target.value),
                      disabled: isRunning,
                      className:
                        "text-xs px-2 py-1 rounded border border-border bg-surface",
                    },
                    (activeBuilding?.floors || []).map((f) =>
                      h("option", { key: f.name, value: f.name }, f.name),
                    ),
                  ),
                ),
                h(
                  "p",
                  { className: "text-xs text-muted" },
                  "Config is auto-loaded when you start a survey. Click 'Load Config' to refresh targets.",
                ),
              ),

              // Room name
              h(
                "div",
                { className: "space-y-1" },
                h(
                  "label",
                  { className: "text-xs font-medium text-ink-secondary" },
                  "Room Name",
                ),
                h("input", {
                  type: "text",
                  value: roomInput,
                  onChange: (e) => setRoomInput(e.target.value),
                  placeholder: "e.g. 324A, Hallway, Lab",
                  disabled: isRunning,
                  className:
                    "w-full px-3 py-1.5 text-sm rounded-md border border-border bg-surface focus:outline-none focus:ring-2 focus:ring-primary/40 disabled:opacity-50",
                }),
              ),

              // Target SSID — free-type or pick a registered tag / configured target
              h(
                "div",
                { className: "space-y-1" },
                h(
                  "label",
                  { className: "text-xs font-medium text-ink-secondary" },
                  "Target SSID",
                  targets.length > 0 &&
                    h(
                      "span",
                      { className: "ml-1 text-muted font-normal" },
                      `(configured: ${targets.join(", ")})`,
                    ),
                ),
                h(
                  "select",
                  {
                    value: ssidInput,
                    onChange: (e) => setSsidInput(e.target.value),
                    disabled: isRunning,
                    className:
                      "w-full px-3 py-1.5 text-sm rounded-md border border-border bg-surface focus:outline-none focus:ring-2 focus:ring-primary/40 disabled:opacity-50",
                  },
                  [
                    h(
                      "option",
                      { key: "__blank", value: "" },
                      "— Select a target SSID —",
                    ),
                    // Registered tags
                    ...registeredTagSsids.map((t) =>
                      h(
                        "option",
                        { key: `tag-${t.ssid}`, value: t.ssid },
                        t.label && t.label !== t.ssid
                          ? `${t.label} (${t.ssid})`
                          : t.ssid,
                      ),
                    ),
                    // Any configured targets not already listed
                    ...targets
                      .filter(
                        (s) => !registeredTagSsids.some((t) => t.ssid === s),
                      )
                      .map((s) =>
                        h("option", { key: `cfg-${s}`, value: s }, s),
                      ),
                  ],
                ),
                h(
                  "p",
                  { className: "text-xs text-muted" },
                  registeredTagSsids.length > 0
                    ? `${registeredTagSsids.length} registered tag${registeredTagSsids.length !== 1 ? "s" : ""} available. Leave blank to use first configured target.`
                    : "Leave blank to use the first configured target.",
                ),
              ),

              // Sample count
              h(
                "div",
                { className: "space-y-1" },
                h(
                  "div",
                  { className: "flex justify-between" },
                  h(
                    "label",
                    { className: "text-xs font-medium text-ink-secondary" },
                    "Samples",
                  ),
                  h(
                    "span",
                    { className: "text-xs font-semibold text-ink" },
                    samples,
                  ),
                ),
                h("input", {
                  type: "range",
                  min: 3,
                  max: 50,
                  step: 1,
                  value: samples,
                  onChange: (e) => setSamples(Number(e.target.value)),
                  disabled: isRunning,
                  className: "w-full accent-primary",
                }),
                h(
                  "div",
                  { className: "flex justify-between text-xs text-muted" },
                  h("span", null, "3 (quick)"),
                  h("span", null, "50 (thorough)"),
                ),
              ),

              // Engine status banners
              !engineReachable &&
                h(
                  "div",
                  {
                    className:
                      "flex items-start gap-2 text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2",
                  },
                  h("span", null, "❌"),
                  h(
                    "span",
                    null,
                    "Engine is not reachable (port 8000). Make sure the Hybrid engine is running. ",
                    "The desktop app should start it automatically — try restarting the app.",
                  ),
                ),
              engineReachable &&
                enginePollActive &&
                h(
                  "div",
                  {
                    className:
                      "flex items-start gap-2 text-xs text-amber-400 bg-amber-500/10 border border-amber-500/30 rounded-lg px-3 py-2",
                  },
                  h("span", null, "⚠"),
                  h(
                    "span",
                    null,
                    "The localization engine poll is active — stop it before surveying. ",
                    "Go to Localization → Stop.",
                  ),
                ),
              engineReachable &&
                !enginePollActive &&
                h(
                  "div",
                  {
                    className:
                      "flex items-start gap-2 text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 rounded-lg px-3 py-2",
                  },
                  h("span", null, "✅"),
                  h("span", null, "Engine ready — you can start a survey."),
                ),

              // Buttons
              h(
                "div",
                { className: "flex gap-2 pt-1" },
                !isRunning
                  ? h(
                      "button",
                      {
                        onClick: handleStart,
                        disabled:
                          !roomInput.trim() ||
                          !engineReachable ||
                          enginePollActive,
                        className:
                          "flex-1 py-2 px-4 rounded-lg text-sm font-medium bg-primary text-white hover:bg-primary-hover disabled:opacity-40 disabled:cursor-not-allowed transition-colors",
                      },
                      "▶ Start Survey",
                    )
                  : h(
                      "button",
                      {
                        onClick: handleCancel,
                        className:
                          "flex-1 py-2 px-4 rounded-lg text-sm font-medium bg-red-600 text-white hover:bg-red-700 transition-colors",
                      },
                      "⏹ Cancel",
                    ),
              ),

              // Status / message
              msg &&
                h(
                  "div",
                  {
                    className: `text-sm px-3 py-2 rounded-lg ${
                      msg.ok
                        ? "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30"
                        : "bg-red-500/15 text-red-400 border border-red-500/30"
                    }`,
                  },
                  msg.text,
                ),

              // Live progress
              surveyStatus &&
                surveyStatus.status !== "idle" &&
                h(
                  "div",
                  { className: "space-y-2 pt-1" },
                  h(
                    "div",
                    { className: "flex justify-between items-center" },
                    h(
                      "span",
                      { className: "text-xs font-medium text-ink-secondary" },
                      surveyStatus.room_label
                        ? `Room: ${surveyStatus.room_label}`
                        : "Survey",
                    ),
                    h(
                      "span",
                      {
                        className: `text-xs ${STATUS_STYLE[surveyStatus.status] || ""}`,
                      },
                      surveyStatus.status === "running"
                        ? `${collected} / ${total} samples`
                        : surveyStatus.status.charAt(0).toUpperCase() +
                            surveyStatus.status.slice(1),
                    ),
                  ),
                  // Progress bar
                  h(
                    "div",
                    {
                      className:
                        "w-full h-2 bg-surface-dim rounded-full overflow-hidden",
                    },
                    h("div", {
                      className: `h-full rounded-full transition-all duration-300 ${
                        surveyStatus.status === "done"
                          ? "bg-emerald-500"
                          : surveyStatus.status === "error"
                            ? "bg-red-500"
                            : "bg-sky-500"
                      }`,
                      style: { width: `${progress}%` },
                    }),
                  ),
                  surveyStatus.error &&
                    h(
                      "p",
                      { className: "text-xs text-red-400" },
                      surveyStatus.error,
                    ),
                  surveyStatus.target_ssid &&
                    h(
                      "p",
                      { className: "text-xs text-muted" },
                      `SSID: ${surveyStatus.target_ssid}`,
                    ),
                ),
            ),

            // ── RIGHT: Radiomap Coverage ───────────────────────────────────
            h(
              "div",
              {
                className:
                  "bg-panel rounded-xl border border-border p-5 space-y-4",
              },

              h(
                "div",
                { className: "flex items-center justify-between" },
                h(
                  "h2",
                  {
                    className:
                      "text-sm font-semibold text-ink-secondary uppercase tracking-wide",
                  },
                  "Radiomap Coverage",
                ),
                !rmExists &&
                  h(
                    "span",
                    { className: "text-xs text-muted italic" },
                    "No radiomap yet",
                  ),
              ),

              rmError &&
                h(
                  "p",
                  { className: "text-xs text-red-400" },
                  "Could not load radiomap — is the engine running?",
                ),

              !rmExists
                ? h(
                    "div",
                    {
                      className:
                        "flex flex-col items-center justify-center py-12 text-center space-y-2",
                    },
                    h("div", { className: "text-4xl opacity-30" }, "📋"),
                    h(
                      "p",
                      { className: "text-sm text-muted" },
                      "Start a survey to begin building the radiomap.",
                    ),
                    h(
                      "p",
                      { className: "text-xs text-muted" },
                      "Each surveyed room adds fingerprint vectors that improve localization accuracy.",
                    ),
                  )
                : h(
                    "div",
                    { className: "space-y-1 overflow-y-auto max-h-96" },
                    Object.entries(rmRooms)
                      .sort(([a], [b]) => a.localeCompare(b))
                      .map(([room, info]) =>
                        h(
                          "div",
                          {
                            key: room,
                            className:
                              "flex items-center justify-between px-3 py-2 rounded-lg hover:bg-surface-dim group transition-colors",
                          },
                          h(
                            "div",
                            { className: "flex items-center gap-3 min-w-0" },
                            h(
                              "span",
                              {
                                className:
                                  "text-sm font-medium text-ink truncate",
                              },
                              room,
                            ),
                            h(
                              "span",
                              {
                                className:
                                  "text-xs bg-sky-500/10 text-sky-400 border border-sky-500/30 px-1.5 py-0.5 rounded-full whitespace-nowrap",
                              },
                              `${info.sample_count} samples`,
                            ),
                            info.ap_count > 0 &&
                              h(
                                "span",
                                {
                                  className:
                                    "text-xs text-muted whitespace-nowrap",
                                },
                                `${info.ap_count} AP${info.ap_count !== 1 ? "s" : ""}`,
                              ),
                          ),
                          // Inspect vectors button
                          h(
                            "button",
                            {
                              onClick: async () => {
                                setViewingRoom(room);
                                setRoomVectors(null);
                                setVectorsLoading(true);
                                try {
                                  const data =
                                    await engine.surveyRoomVectors(room);
                                  setRoomVectors(data);
                                } catch (e) {
                                  setRoomVectors({ error: String(e) });
                                } finally {
                                  setVectorsLoading(false);
                                }
                              },
                              title: "Inspect stored RSSI vectors",
                              className:
                                "text-xs px-2 py-1 rounded text-sky-400 hover:bg-sky-500/15 transition-colors opacity-0 group-hover:opacity-100",
                            },
                            "🔍",
                          ),
                          // Delete button
                          h(
                            "button",
                            {
                              onClick: () => handleDeleteRoom(room),
                              disabled: deleting === room,
                              title:
                                confirmDelete === room
                                  ? "Click again to confirm deletion"
                                  : "Delete room from radiomap",
                              className: `text-xs px-2 py-1 rounded transition-colors opacity-0 group-hover:opacity-100 ${
                                confirmDelete === room
                                  ? "bg-red-500/15 text-red-400 border border-red-500/30 opacity-100"
                                  : "text-muted hover:text-red-400 hover:bg-red-500/15"
                              }`,
                            },
                            deleting === room
                              ? "…"
                              : confirmDelete === room
                                ? "Confirm delete"
                                : "✕",
                          ),
                        ),
                      ),
                  ),

              // Hint on coverage quality
              rmExists &&
                h(
                  "div",
                  {
                    className: `text-xs px-3 py-2 rounded-lg border mt-2 ${
                      totalRooms >= 5
                        ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/30"
                        : totalRooms >= 2
                          ? "bg-amber-500/10 text-amber-400 border-amber-500/30"
                          : "bg-surface-dim text-muted border-border"
                    }`,
                  },
                  totalRooms >= 5
                    ? `✓ Good coverage — ${totalRooms} rooms surveyed. Fingerprinting is ready.`
                    : totalRooms >= 2
                      ? `${totalRooms} room${totalRooms !== 1 ? "s" : ""} surveyed. Survey more rooms for better accuracy.`
                      : `Only ${totalRooms} room${totalRooms !== 1 ? "s" : ""} surveyed — fingerprinting may be inaccurate.`,
                ),
            ),
          ),

          // ── Room Vector Inspector Modal ───────────────────────────────────
          viewingRoom &&
            h(
              "div",
              {
                className:
                  "fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm",
                onClick: (e) => {
                  if (e.target === e.currentTarget) setViewingRoom(null);
                },
              },
              h(
                "div",
                {
                  className:
                    "bg-panel border border-border rounded-2xl shadow-2xl w-full max-w-2xl mx-4 flex flex-col max-h-[80vh]",
                },
                // Header
                h(
                  "div",
                  {
                    className:
                      "flex items-center justify-between px-5 py-4 border-b border-border",
                  },
                  h(
                    "div",
                    null,
                    h(
                      "h2",
                      { className: "font-semibold text-ink text-sm" },
                      `RSSI Vectors — ${viewingRoom}`,
                    ),
                    !vectorsLoading &&
                      roomVectors &&
                      !roomVectors.error &&
                      h(
                        "p",
                        { className: "text-xs text-muted mt-0.5" },
                        `${roomVectors.count} sample${roomVectors.count !== 1 ? "s" : ""}`,
                        roomVectors.averages &&
                          Object.keys(roomVectors.averages).length > 0 &&
                          ` · averages: ${Object.entries(roomVectors.averages)
                            .sort(([a], [b]) => a.localeCompare(b))
                            .map(([ap, v]) => `${ap}: ${v > 0 ? "+" : ""}${v}`)
                            .join(", ")}`,
                      ),
                  ),
                  h(
                    "button",
                    {
                      onClick: () => setViewingRoom(null),
                      className:
                        "text-muted hover:text-ink text-xl leading-none px-2",
                    },
                    "✕",
                  ),
                ),
                // Body
                h(
                  "div",
                  { className: "overflow-y-auto flex-1 p-4" },
                  vectorsLoading &&
                    h(
                      "div",
                      {
                        className:
                          "flex items-center justify-center py-12 text-muted text-sm",
                      },
                      "Loading vectors…",
                    ),
                  roomVectors?.error &&
                    h(
                      "p",
                      { className: "text-red-400 text-sm p-2" },
                      roomVectors.error,
                    ),
                  !vectorsLoading &&
                    roomVectors &&
                    !roomVectors.error &&
                    h(
                      "div",
                      { className: "space-y-1.5" },
                      (roomVectors.vectors || []).map((vec, i) => {
                        const apKeys = Object.keys(vec).sort();
                        return h(
                          "div",
                          {
                            key: i,
                            className:
                              "flex items-center gap-3 px-3 py-2 rounded-lg bg-surface-dim text-xs font-mono",
                          },
                          h(
                            "span",
                            { className: "text-muted w-6 shrink-0 text-right" },
                            `#${i + 1}`,
                          ),
                          h(
                            "div",
                            { className: "flex flex-wrap gap-x-4 gap-y-0.5" },
                            apKeys.map((ap) =>
                              h(
                                "span",
                                { key: ap },
                                h("span", { className: "text-sky-400" }, ap),
                                h(
                                  "span",
                                  { className: "text-ink ml-1" },
                                  `${vec[ap] > 0 ? "+" : ""}${vec[ap].toFixed(0)}`,
                                ),
                              ),
                            ),
                          ),
                        );
                      }),
                    ),
                ),
              ),
            ),

          // ── Survey Activity Log ───────────────────────────────────────────
          h(
            "div",
            { className: "bg-panel border border-border rounded-xl p-4" },
            h(
              "div",
              { className: "flex items-center justify-between mb-3" },
              h(
                "h3",
                { className: "font-semibold text-ink text-sm" },
                "Survey Activity",
              ),
              isRunning &&
                h(
                  "span",
                  {
                    className:
                      "inline-flex items-center gap-1.5 text-xs text-sky-400 font-medium",
                  },
                  h("span", {
                    className:
                      "w-1.5 h-1.5 rounded-full bg-sky-500 pulse-dot inline-block",
                  }),
                  "Live",
                ),
            ),
            !surveyLogs || surveyLogs.length === 0
              ? h(
                  "p",
                  { className: "text-xs text-muted italic" },
                  "No survey events recorded yet. Start a survey to see activity here.",
                )
              : h(
                  "div",
                  {
                    className:
                      "max-h-48 overflow-y-auto space-y-0 font-mono text-xs",
                  },
                  surveyLogs.map((entry) => {
                    const levelColor =
                      entry.level === "alert"
                        ? "text-orange-400"
                        : entry.level === "warn"
                          ? "text-amber-400"
                          : "text-emerald-400";
                    const ts = new Date(entry.timestamp);
                    const timeStr = ts.toLocaleTimeString([], {
                      hour: "2-digit",
                      minute: "2-digit",
                      second: "2-digit",
                    });
                    return h(
                      "div",
                      {
                        key: entry.id,
                        className:
                          "flex gap-2 items-start py-1 border-b border-border/50 last:border-0",
                      },
                      h(
                        "span",
                        { className: "text-muted shrink-0 tabular-nums" },
                        timeStr,
                      ),
                      h(
                        "span",
                        {
                          className: `${levelColor} shrink-0 uppercase font-semibold`,
                        },
                        entry.level,
                      ),
                      h("span", { className: "text-ink" }, entry.message),
                    );
                  }),
                ),
          ),

          // ── How-to guide ──────────────────────────────────────────────────
          h(
            "div",
            {
              className:
                "bg-panel border border-border rounded-xl p-5 text-sm text-ink-secondary",
            },
            h(
              "h3",
              { className: "font-semibold text-ink mb-2 text-sm" },
              "How to Survey a Floor",
            ),
            h(
              "ol",
              { className: "space-y-1.5 list-decimal list-inside text-xs" },
              h(
                "li",
                null,
                "Go to Localization and stop the engine (if running).",
              ),
              h(
                "li",
                null,
                "Stand still at the centre of the room you want to calibrate.",
              ),
              h(
                "li",
                null,
                "Enter the exact room name (must match your floor plan room IDs).",
              ),
              h(
                "li",
                null,
                "Enter the target SSID or leave blank to use the configured default.",
              ),
              h(
                "li",
                null,
                "Click Start Survey — wait for all samples to be collected.",
              ),
              h(
                "li",
                null,
                "Move to the next room and repeat. Aim for ≥10 samples per room.",
              ),
              h(
                "li",
                null,
                "Once all rooms are surveyed, restart localization — fingerprinting will activate automatically.",
              ),
            ),
          ),
        );
      }

      function LocalizationPage() {
        const [pollInterval, setPollInterval] = useState(1.5);
        const [testingMode, setTestingMode] = useState(false);
        const [selectedMethods, setSelectedMethods] = useState([
          "trilateration",
        ]);
        const [starting, setStarting] = useState(false);
        const [stopping, setStopping] = useState(false);
        const [msg, setMsg] = useState(null);
        const [selectedCampusId, setSelectedCampusId] = useState(null);
        const [expandedMethod, setExpandedMethod] = useState(null);
        const [logLevelFilter, setLogLevelFilter] = useState("");

        // Floor hierarchy for method map panels
        const [mapBuilding, setMapBuilding] = useState(null);
        const [mapFloor, setMapFloor] = useState(null);
        const [mapRooms, setMapRooms] = useState([]);

        const { data: campuses } = useApi(() => platform.listCampuses());
        useEffect(() => {
          if (campuses?.length && !selectedCampusId)
            setSelectedCampusId(campuses[0].id);
        }, [campuses]);

        // Load building+floor for method maps (auto-pick first available)
        useEffect(() => {
          if (!campuses?.length) return;
          const campus = campuses[0];
          platform
            .listBuildings(campus.id)
            .then((bs) => {
              if (!bs?.length) return;
              const b = bs[0];
              setMapBuilding(b);
              platform
                .listFloors(b.id)
                .then((fs) => {
                  if (!fs?.length) return;
                  setMapFloor(fs[0]);
                })
                .catch(() => {});
            })
            .catch(() => {});
        }, [campuses]);

        useEffect(() => {
          if (!mapFloor) return;
          platform
            .listRooms(mapFloor.id)
            .then((r) => setMapRooms(r || []))
            .catch(() => {});
        }, [mapFloor?.id]);

        const { data: engStatus } = usePolling(
          () => platform.engineStatus().catch(() => null),
          3000,
        );
        const { data: engHealth } = usePolling(
          () => engine.health().catch(() => null),
          3000,
        );
        const { data: logsData } = usePolling(
          () =>
            platform.listEngineLogs({
              limit: 100,
              level: logLevelFilter || undefined,
            }),
          4000,
          [logLevelFilter],
        );

        // Engine is running only if poll is actually active (direct engine check)
        const isRunning = engHealth?.poll_running === true;
        const engineOnline =
          engHealth?.ok === true || engStatus?.local_engine === "online";
        const logs = logsData || [];

        const LEVEL_STYLE = {
          info: "text-emerald-400",
          warn: "text-amber-400",
          alert: "text-orange-400",
          config: "text-sky-400",
          security: "text-red-400",
        };
        const LEVEL_BG = {
          info: "bg-emerald-500/10",
          warn: "bg-amber-500/10",
          alert: "bg-orange-500/10",
          config: "bg-sky-500/10",
          security: "bg-red-500/15",
        };

        const toggleMethod = (m) =>
          setSelectedMethods((prev) =>
            prev.includes(m) ? prev.filter((x) => x !== m) : [...prev, m],
          );

        const handleStart = async () => {
          if (!selectedCampusId) {
            setMsg({ ok: false, text: "Select a campus first." });
            return;
          }
          setStarting(true);
          setMsg(null);
          try {
            const res = await platform.startEngine({
              campus_id: selectedCampusId,
              poll_interval_s: pollInterval,
              testing_mode: testingMode,
              methods: selectedMethods.join(","),
            });
            if (res?.ok) {
              const localOk =
                res.local_config?.ok !== false && res.local_poll?.ok !== false;
              setMsg({
                ok: true,
                text: localOk
                  ? "Engine started successfully."
                  : `Engine start partial — config: ${res.local_config?.error || "ok"}, poll: ${res.local_poll?.error || "ok"}`,
              });
            } else {
              const details = [];
              if (res?.local_config?.error)
                details.push(`Config: ${res.local_config.error}`);
              if (res?.local_poll?.error)
                details.push(`Poll: ${res.local_poll.error}`);
              if (res?.error) details.push(`Docker: ${res.error}`);
              setMsg({
                ok: false,
                text: details.length
                  ? details.join(" | ")
                  : "Engine start failed — check logs for details.",
              });
            }
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setStarting(false);
          }
        };

        const handleStop = async () => {
          setStopping(true);
          setMsg(null);
          try {
            await platform.stopEngine();
            setMsg({ ok: true, text: "Engine stopped." });
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setStopping(false);
          }
        };

        return h(
          "div",
          { className: "fade-in space-y-6" },
          // Header
          h(
            "div",
            null,
            h(
              "h1",
              { className: "text-2xl font-semibold text-ink" },
              "Localization",
            ),
            h(
              "p",
              { className: "text-muted text-sm mt-1" },
              "Configure and monitor the Hybrid localization engine",
            ),
          ),

          // Status bar
          h(
            Card,
            null,
            h(
              "div",
              {
                className: "flex items-center justify-between flex-wrap gap-4",
              },
              h(
                "div",
                { className: "flex items-center gap-4" },
                h(
                  "div",
                  { className: "flex items-center gap-2" },
                  h(StatusDot, {
                    status: engineOnline ? "online" : "offline",
                  }),
                  h(
                    "span",
                    { className: "text-sm font-medium" },
                    engineOnline ? "Engine online" : "Engine offline",
                  ),
                ),
                isRunning &&
                  h(
                    "div",
                    { className: "flex items-center gap-2" },
                    h(StatusDot, { status: "polling" }),
                    h(
                      "span",
                      { className: "text-sm text-muted" },
                      "Polling active",
                    ),
                  ),
                engineOnline &&
                  !isRunning &&
                  h(
                    "div",
                    {
                      className:
                        "flex items-center gap-2 text-xs text-amber-400",
                    },
                    "Engine ready — poll not started",
                  ),
              ),
              h(
                "div",
                { className: "flex gap-2" },
                h(
                  Button,
                  {
                    variant: isRunning ? "ghost" : "primary",
                    size: "sm",
                    disabled: starting || isRunning,
                    onClick: handleStart,
                  },
                  starting ? "Starting…" : "▶ Start",
                ),
                h(
                  Button,
                  {
                    variant: "danger",
                    size: "sm",
                    disabled: stopping || !isRunning,
                    onClick: handleStop,
                  },
                  stopping ? "Stopping…" : "■ Stop",
                ),
              ),
            ),
            msg &&
              h(
                "div",
                {
                  className: `mt-3 text-sm px-3 py-2 rounded ${msg.ok ? "bg-emerald-500/15 text-emerald-400" : "bg-red-500/15 text-red-400"}`,
                },
                msg.text,
              ),
          ),

          // Settings + method selection
          h(
            "div",
            { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
            // Settings panel
            h(
              Card,
              { title: "Engine Settings" },
              h(
                "div",
                { className: "space-y-4" },
                h(
                  "div",
                  null,
                  h(
                    "label",
                    { className: "block text-xs font-medium text-muted mb-1" },
                    "Campus",
                  ),
                  h(
                    "select",
                    {
                      value: selectedCampusId || "",
                      onChange: (e) => setSelectedCampusId(+e.target.value),
                      className:
                        "w-full border border-border rounded px-2 py-1.5 text-sm bg-surface",
                    },
                    (campuses || []).map((c) =>
                      h("option", { key: c.id, value: c.id }, c.name),
                    ),
                  ),
                ),
                h(
                  "div",
                  null,
                  h(
                    "label",
                    { className: "block text-xs font-medium text-muted mb-1" },
                    `Poll Interval: ${pollInterval}s`,
                  ),
                  h("input", {
                    type: "range",
                    min: 0.5,
                    max: 5,
                    step: 0.5,
                    value: pollInterval,
                    onChange: (e) => setPollInterval(+e.target.value),
                    className: "w-full accent-accent",
                  }),
                  h(
                    "div",
                    {
                      className: "flex justify-between text-xs text-muted mt-1",
                    },
                    h("span", null, "0.5s (fast)"),
                    h("span", null, "5s (slow)"),
                  ),
                ),
                h(
                  "div",
                  { className: "flex items-start gap-3" },
                  h("input", {
                    type: "checkbox",
                    id: "testingMode",
                    checked: testingMode,
                    onChange: (e) => setTestingMode(e.target.checked),
                    className: "mt-0.5",
                  }),
                  h(
                    "label",
                    { htmlFor: "testingMode", className: "cursor-pointer" },
                    h(
                      "div",
                      { className: "text-sm font-medium" },
                      "Testing Mode",
                    ),
                    h(
                      "div",
                      { className: "text-xs text-muted" },
                      "Accept scans with only 1 AP visible (useful when not all APs are deployed)",
                    ),
                  ),
                ),
              ),
            ),

            // Method selection
            h(
              Card,
              { title: "Localization Methods" },
              h(
                "div",
                { className: "space-y-3" },
                Object.entries(METHOD_INFO).map(([key, info]) =>
                  h(
                    "div",
                    {
                      key,
                      className: `flex items-start gap-3 p-3 rounded-lg border transition-colors cursor-pointer ${
                        selectedMethods.includes(key)
                          ? "border-accent bg-accent/5"
                          : "border-border hover:border-border/80"
                      }`,
                      onClick: () => toggleMethod(key),
                    },
                    h("input", {
                      type: "checkbox",
                      checked: selectedMethods.includes(key),
                      onChange: () => toggleMethod(key),
                      className: "mt-0.5",
                    }),
                    h(
                      "div",
                      null,
                      h(
                        "div",
                        { className: "flex items-center gap-2 mb-0.5" },
                        h(
                          "span",
                          { className: "text-sm font-medium" },
                          info.label,
                        ),
                        h(Badge, { color: info.color }, key),
                      ),
                      h("div", { className: "text-xs text-muted" }, info.desc),
                    ),
                  ),
                ),
              ),
            ),
          ),

          // Expanded map overlay
          expandedMethod &&
            h(ExpandedMapOverlay, {
              method: expandedMethod,
              onClose: () => setExpandedMethod(null),
            }),

          // Per-method maps
          h(
            Card,
            {
              title: "Live Maps",
              actions:
                mapFloor &&
                h(
                  "span",
                  { className: "text-xs text-muted" },
                  `Floor: ${mapBuilding?.name || ""} — ${mapFloor?.name || ""}`,
                ),
            },
            h(
              "div",
              {
                className:
                  "grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4",
              },
              Object.keys(METHOD_INFO).map((m) =>
                h(MethodMapPanel, {
                  key: m,
                  method: m,
                  onExpand: setExpandedMethod,
                  platformRooms: mapRooms,
                  floorW: mapFloor?.width_m || 20,
                  floorH: mapFloor?.height_m || 15,
                }),
              ),
            ),
          ),

          // Live engine log stream
          h(
            Card,
            {
              title: "Engine Log Stream",
              actions: h(
                "div",
                { className: "flex gap-2 items-center" },
                h(
                  "select",
                  {
                    value: logLevelFilter,
                    onChange: (e) => setLogLevelFilter(e.target.value),
                    className:
                      "text-xs border border-border rounded px-2 py-1 bg-surface",
                  },
                  h("option", { value: "" }, "All levels"),
                  ["info", "warn", "alert", "config", "security"].map((l) =>
                    h("option", { key: l, value: l }, l.toUpperCase()),
                  ),
                ),
                h(
                  Button,
                  {
                    variant: "ghost",
                    size: "sm",
                    onClick: () => platform.clearEngineLogs().catch(() => {}),
                  },
                  "Clear All",
                ),
              ),
            },
            logs.length === 0
              ? h(EmptyState, {
                  icon: "📋",
                  title: "No engine log entries",
                  description:
                    "Logs are generated by the connectivity poller and scope checker as the engine runs",
                })
              : h(
                  "div",
                  { className: "max-h-96 overflow-y-auto" },
                  h(
                    "div",
                    { className: "space-y-0.5 font-mono text-xs" },
                    logs.map((l) =>
                      l.source === "system"
                        ? h(
                            "div",
                            {
                              key: l.id,
                              className:
                                "flex items-center gap-2 py-2 px-3 select-none",
                            },
                            h("div", {
                              className:
                                "flex-1 border-t border-dashed border-gray-300",
                            }),
                            h(
                              "span",
                              {
                                className:
                                  "text-[11px] text-muted whitespace-nowrap font-sans px-2",
                              },
                              new Date(l.timestamp).toLocaleTimeString() +
                                " \u00B7 " +
                                l.message,
                            ),
                            h("div", {
                              className:
                                "flex-1 border-t border-dashed border-gray-300",
                            }),
                          )
                        : h(
                            "div",
                            {
                              key: l.id,
                              className: `flex gap-3 px-3 py-1.5 rounded items-start ${LEVEL_BG[l.level] || "hover:bg-surface-dim"}`,
                            },
                            h(
                              "span",
                              {
                                className:
                                  "text-muted whitespace-nowrap shrink-0",
                              },
                              new Date(l.timestamp).toLocaleTimeString(),
                            ),
                            h(
                              "span",
                              {
                                className: `w-14 shrink-0 font-bold ${LEVEL_STYLE[l.level] || "text-muted"}`,
                              },
                              (l.level || "info").toUpperCase(),
                            ),
                            h(
                              "span",
                              {
                                className:
                                  "text-ink-secondary shrink-0 w-20 truncate",
                              },
                              l.source || "",
                            ),
                            l.tag_id &&
                              h(
                                "span",
                                {
                                  className:
                                    "text-indigo-700 shrink-0 font-medium",
                                },
                                l.tag_id,
                              ),
                            h(
                              "span",
                              { className: "text-ink flex-1 break-all" },
                              l.message,
                            ),
                            !l.acknowledged &&
                              h(
                                "button",
                                {
                                  className:
                                    "shrink-0 text-muted hover:text-ink text-xs border border-border rounded px-1.5 py-0.5",
                                  onClick: () =>
                                    platform
                                      .ackEngineLog(l.id, "admin")
                                      .catch(() => {}),
                                },
                                "ack",
                              ),
                          ),
                    ),
                  ),
                ),
          ),
        );
      }

      // ═════════════════════════════════════════════════════════════════════
      // PAGE: LOGS
      // ═════════════════════════════════════════════════════════════════════

      const LOG_LEVEL_TABS = [
        { id: "all", label: "All", color: "bg-muted" },
        { id: "info", label: "Info", color: "bg-emerald-500" },
        { id: "warn", label: "Warn", color: "bg-amber-500" },
        { id: "alert", label: "Alert", color: "bg-orange-500" },
        { id: "config", label: "Config", color: "bg-sky-500" },
        { id: "security", label: "Security", color: "bg-red-500" },
        {
          id: "system",
          label: "System",
          color: "bg-violet-500",
          isSource: true,
        },
      ];

      function LogsPage() {
        const [tab, setTab] = useState("all");
        const activeTab = LOG_LEVEL_TABS.find((t) => t.id === tab) || {};
        const {
          data: logsData,
          loading,
          error,
          reload,
        } = usePolling(
          () =>
            platform.listEngineLogs({
              limit: 200,
              level: activeTab.isSource
                ? undefined
                : tab === "all"
                  ? undefined
                  : tab,
              source: activeTab.isSource ? "system" : undefined,
            }),
          4000,
          [tab],
        );
        const logs = logsData || [];

        const LEVEL_STYLE = {
          info: "text-emerald-400 font-medium",
          warn: "text-amber-400 font-semibold",
          alert: "text-orange-400 font-semibold",
          config: "text-sky-400 font-semibold",
