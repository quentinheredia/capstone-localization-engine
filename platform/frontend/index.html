      function WizardAnchors({ floor, onBack }) {
        // Anchors already placed on this floor
        const { data, loading, error, reload } = useApi(
          () => platform.listAnchors(floor.id),
          [floor.id],
        );
        // Full inventory (for "From Inventory" tab)
        const { data: allAnchors, reload: reloadInventory } = useApi(() =>
          platform.listAllAnchors(),
        );

        const [mode, setMode] = useState("create"); // "create" | "assign"

        // ── Create-new form ──────────────────────────────────────────────────
        const [form, setForm] = useState({
          anchor_id: "",
          anchor_type: "engenius_ap",
          ip_address: "",
          mac_address: "",
          x_m: 0,
          y_m: 0,
          username: "admin",
          password: "admin",
        });
        const [creating, setCreating] = useState(false);

        // ── Assign-from-inventory form ───────────────────────────────────────
        const [selectedId, setSelectedId] = useState("");
        const [assignPos, setAssignPos] = useState({ x_m: 0, y_m: 0 });
        const [assigning, setAssigning] = useState(false);

        // Unassigned devices available to pick from
        const inventory = (allAnchors || []).filter((a) => a.floor_id == null);
        const selectedAnchor =
          inventory.find((a) => String(a.id) === selectedId) || null;

        // Reload both lists
        const reloadAll = () => {
          reload();
          reloadInventory();
        };

        const handleDeleteAnchor = async (a) => {
          if (
            !window.confirm(
              `Delete anchor "${a.anchor_id}"? This cannot be undone.`,
            )
          )
            return;
          try {
            await platform.deleteAnchor(a.id);
            reloadAll();
          } catch (e) {
            alert(e.message);
          }
        };

        const handleUnassign = async (a) => {
          if (
            !window.confirm(
              `Remove "${a.anchor_id}" from this floor and return it to inventory?`,
            )
          )
            return;
          try {
            await platform.updateAnchor(a.id, { floor_id: null });
            reloadAll();
          } catch (e) {
            alert(e.message);
          }
        };

        const handleCreate = async () => {
          if (!form.anchor_id.trim()) return;
          setCreating(true);
          try {
            await platform.createAnchor(floor.id, {
              ...form,
              anchor_id: form.anchor_id.trim(),
              x_m: +form.x_m,
              y_m: +form.y_m,
            });
            setForm((f) => ({
              ...f,
              anchor_id: "",
              ip_address: "",
              mac_address: "",
              x_m: 0,
              y_m: 0,
            }));
            reloadAll();
          } catch (e) {
            alert(e.message);
          } finally {
            setCreating(false);
          }
        };

        const handleAssign = async () => {
          if (!selectedId) return;
          setAssigning(true);
          try {
            await platform.updateAnchor(+selectedId, {
              floor_id: floor.id,
              x_m: +assignPos.x_m,
              y_m: +assignPos.y_m,
              device_status: "in_use",
            });
            setSelectedId("");
            setAssignPos({ x_m: 0, y_m: 0 });
            reloadAll();
          } catch (e) {
            alert(e.message);
          } finally {
            setAssigning(false);
          }
        };

        if (loading) return h(LoadingSpinner);
        if (error) return h(ErrorBanner, { message: error, onRetry: reload });

        return h(
          "div",
          { className: "fade-in" },
          h(
            "button",
            {
              onClick: onBack,
              className:
                "flex items-center gap-1 text-sm text-muted hover:text-accent mb-4",
            },
            "\u2190 Back to Floor Plan",
          ),
          h(
            "div",
            { className: "flex items-center justify-between mb-4" },
            h(
              "div",
              { className: "text-sm text-muted" },
              `Floor: ${floor.name}`,
            ),
            h(Badge, { color: "green" }, `${data?.length || 0} anchors placed`),
          ),
          h(
            "div",
            { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },

            // ── Left: Add Anchor panel ─────────────────────────────────────
            h(
              Card,
              { title: "Add Anchor" },
              // Tab toggle
              h(
                "div",
                {
                  className:
                    "flex mb-4 rounded-lg overflow-hidden border border-border text-sm font-medium",
                },
                h(
                  "button",
                  {
                    onClick: () => setMode("create"),
                    className: `flex-1 py-1.5 transition-colors ${mode === "create" ? "bg-accent text-white" : "bg-panel text-muted hover:bg-surface"}`,
                  },
                  "Create New",
                ),
                h(
                  "button",
                  {
                    onClick: () => {
                      setMode("assign");
                      setSelectedId("");
                    },
                    className: `flex-1 py-1.5 transition-colors ${mode === "assign" ? "bg-accent text-white" : "bg-panel text-muted hover:bg-surface"}`,
                  },
                  `From Inventory${inventory.length > 0 ? ` (${inventory.length})` : ""}`,
                ),
              ),

              // ── Create-new form ──────────────────────────────────────────
              mode === "create" &&
                h(
                  "div",
                  { className: "space-y-3" },
                  h(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    h(Input, {
                      label: "Anchor ID",
                      value: form.anchor_id,
                      onChange: (v) => setForm((f) => ({ ...f, anchor_id: v })),
                      placeholder: "e.g. AP1",
                    }),
                    h(Select, {
                      label: "Type",
                      value: form.anchor_type,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, anchor_type: v })),
                      options: [
                        { value: "engenius_ap", label: "EnGenius AP" },
                        { value: "esp32", label: "ESP32" },
                      ],
                    }),
                  ),
                  form.anchor_type === "engenius_ap" &&
                    h(
                      "div",
                      { className: "grid grid-cols-2 gap-3" },
                      h(Input, {
                        label: "IP Address",
                        value: form.ip_address,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, ip_address: v })),
                        placeholder: "192.168.1.xxx",
                      }),
                      h(Input, {
                        label: "MAC Address",
                        value: form.mac_address,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, mac_address: v })),
                        placeholder: "AA:BB:CC:DD:EE:FF",
                      }),
                    ),
                  form.anchor_type === "esp32" &&
                    h(Input, {
                      label: "MAC Address",
                      value: form.mac_address,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, mac_address: v })),
                      placeholder: "AA:BB:CC:DD:EE:FF",
                    }),
                  h(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    h(Input, {
                      label: "X Position (m)",
                      type: "number",
                      value: form.x_m,
                      onChange: (v) => setForm((f) => ({ ...f, x_m: v })),
                    }),
                    h(Input, {
                      label: "Y Position (m)",
                      type: "number",
                      value: form.y_m,
                      onChange: (v) => setForm((f) => ({ ...f, y_m: v })),
                    }),
                  ),
                  form.anchor_type === "engenius_ap" &&
                    h(
                      "div",
                      { className: "grid grid-cols-2 gap-3" },

                        value: form.username,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, username: v })),
                      }),
                      h(Input, {
                        label: "Password",
                        type: "password",
                        value: form.password,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, password: v })),
                      }),

                  h(
                    Button,
                    {
                      onClick: handleCreate,
                      disabled: creating || !form.anchor_id.trim(),

                    "Place Anchor",
                  ),

              // ── From-inventory form ──────────────────────────────────────
              mode === "assign" &&
                h(
                  "div",
                  { className: "space-y-3" },
                  inventory.length === 0
                    ? h(
                        "div",
                        { className: "text-sm text-muted py-4 text-center" },
                        "No unassigned devices in inventory.",
                        h("br", null),
                        h(
                          "span",
                          { className: "text-xs" },
                          "Register devices in the Devices tab first.",
                        ),
                      )
                    : h(
                        "div",
                        { className: "space-y-3" },
                        h(
                          "div",
                          null,
                          h(
                            "div",
                            {
                              className:
                                "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                            },
                            "Select Device",
                          ),
                          h(
                            "select",
                            {
                              value: selectedId,
                              onChange: (e) => setSelectedId(e.target.value),
                              className:
                                "w-full px-2 py-1.5 border border-border rounded text-sm bg-panel text-ink",
                            },
                            h("option", { value: "" }, "— Pick an anchor —"),
                            inventory.map((a) =>
                              h(
                                "option",
                                { key: a.id, value: String(a.id) },
                                `${a.anchor_id}  (${a.anchor_type}${a.ip_address ? " · " + a.ip_address : ""}${a.mac_address ? " · " + a.mac_address : ""})`,
                              ),
                            ),
                          ),
                        ),
                        selectedAnchor &&
                          h(
                            "div",
                            {
                              className:
                                "p-2 rounded bg-surface text-xs space-y-0.5",
                            },
                            h(
                              "div",
                              null,
                              h("span", { className: "text-muted" }, "Type: "),
                              h(
                                Badge,
                                {
                                  color:
                                    selectedAnchor.anchor_type === "esp32"
                                      ? "purple"
                                      : "blue",
                                },
                                selectedAnchor.anchor_type,
                              ),
                            ),
                            selectedAnchor.ip_address &&
                              h(
                                "div",
                                null,
                                h("span", { className: "text-muted" }, "IP: "),
                                h(
                                  "span",
                                  { className: "font-mono" },
                                  selectedAnchor.ip_address,
                                ),
                              ),
                            selectedAnchor.mac_address &&
                              h(
                                "div",
                                null,
                                h("span", { className: "text-muted" }, "MAC: "),
                                h(
                                  "span",
                                  { className: "font-mono" },
                                  selectedAnchor.mac_address,
                                ),
                              ),
                          ),
                        h(
                          "div",
                          { className: "grid grid-cols-2 gap-3" },
                          h(Input, {
                            label: "X Position (m)",
                            type: "number",
                            value: assignPos.x_m,
                            onChange: (v) =>
                              setAssignPos((p) => ({ ...p, x_m: v })),
                          }),
                          h(Input, {
                            label: "Y Position (m)",
                            type: "number",
                            value: assignPos.y_m,
                            onChange: (v) =>
                              setAssignPos((p) => ({ ...p, y_m: v })),
                          }),
                        ),
                        h(
                          Button,
                          {
                            onClick: handleAssign,
                            disabled: assigning || !selectedId,
                          },
                          assigning ? "Assigning…" : "Assign to Floor",
                        ),
                      ),
                ),
            ),

            // ── Right: Placed Anchors panel ────────────────────────────────
            h(
              Card,
              { title: "Placed Anchors" },
              !data || data.length === 0
                ? h(EmptyState, {
                    icon: "\uD83D\uDCE1",
                    title: "No anchors placed yet",
                  })
                : h(
                    "div",
                    { className: "space-y-2" },
                    data.map((a) =>
                      h(
                        "div",
                        {
                          key: a.id,
                          className:
                            "p-3 rounded-lg border border-border text-sm flex items-start justify-between gap-2",
                        },
                        h(
                          "div",
                          { className: "flex-1 min-w-0" },
                          h(
                            "div",
                            { className: "flex items-center gap-2 flex-wrap" },
                            h(StatusDot, { status: a.status }),
                            h(
                              "span",
                              { className: "font-medium font-mono" },
                              a.anchor_id,
                            ),
                            h(
                              Badge,
                              {
                                color:
                                  a.anchor_type === "esp32" ? "purple" : "blue",
                              },
                              a.anchor_type,
                            ),
                          ),
                          h(
                            "div",
                            { className: "text-xs text-muted mt-0.5" },
                            `(${a.x_m}, ${a.y_m}) m`,
                            a.ip_address ? ` \u00B7 ${a.ip_address}` : "",
                            a.mac_address ? ` \u00B7 ${a.mac_address}` : "",
                          ),
                        ),
                        // Actions
                        h(
                          "div",
                          {
                            className: "flex items-center gap-1 flex-shrink-0",
                          },
                          h(
                            "button",
                            {
                              onClick: () => handleUnassign(a),
                              className:
                                "text-xs px-2 py-1 rounded border border-border text-muted hover:border-accent hover:text-accent transition-colors",
                              title: "Remove from floor (keep in inventory)",
                            },
                            "Unassign",
                          ),
                          h(
                            "button",
                            {
                              onClick: () => handleDeleteAnchor(a),
                              className:
                                "text-muted hover:text-danger transition-colors p-1",
                              title: "Delete anchor permanently",
                            },
                            "\uD83D\uDDD1",
                          ),
                        ),
                      ),
                    ),
                  ),
            ),
          ),

          // ── Mini floor preview ─────────────────────────────────────────────
          data?.length > 0 &&
            h(
              Card,
              { title: "Anchor Placement Preview", className: "mt-6" },
              h(FloorCanvas, {
                width: floor.width_m,
                height: floor.height_m,
                rooms: [],
                anchors: data,
                devices: [],
                className: "w-full",
              }),
            ),
        );
      }

      // ═════════════════════════════════════════════════════════════════════
      // PAGE: MAP VIEW
      // ═════════════════════════════════════════════════════════════════════

      function FloorCanvas({
        width,
        height,
        rooms = [],
        anchors = [],
        devices = [],
        accessLevels = [],
        showFpGrid = false,
        gridSize = 1.0,
        className = "",
        dxfWalls = [],
        dxfRooms = [],
        focusRoomId = null,
        rotation = 0,
        showAnchors = true,
        showRoomColors = true,
        showRoomBorders = true,
        showAnchorLabels = true,
        showTagLabels = true,
        // ── New overlay props ─────────────────────────────────────────────
        showRangeCircles = false, // dashed circles: each anchor radius = dist_m to device
        showRangeLines = false, // line from anchor to device + distance label
        showAllMethods = false, // ghost pins for every active method
        anchorRanging = {}, // {device_id: {anchor_id: {x,y,rssi_dbm,dist_m,weight}}}
        allMethodsData = {}, // {method_key: [{device_id,x,y,room_id}]}
      }) {
        const PADDING = 40;
        const svgRef = useRef(null);
        const [dims, setDims] = useState({ w: 800, h: 600 });
        const [zoom, setZoom] = useState(1);
        const [pan, setPan] = useState({ x: 0, y: 0 });
        // Use a ref for drag detection to avoid stale-closure issues in global listeners
        const isDraggingRef = useRef(false);
        const [dragging, setDragging] = useState(false); // drives cursor CSS only
        const dragRef = useRef({ sx: 0, sy: 0, px: 0, py: 0 });

        // Responsive sizing
        useEffect(() => {
          const ro = new ResizeObserver((entries) => {
            for (const e of entries) {
              const w = e.contentRect.width;
              if (w > 0) {
                const aspect = (height || 10) / (width || 10);
                setDims({ w, h: Math.max(300, w * aspect) });
              }
            }
          });
          if (svgRef.current?.parentElement)
            ro.observe(svgRef.current.parentElement);
          return () => ro.disconnect();
        }, [width, height]);

        const fw = width || 10,
          fh = height || 10;
        const scaleX = (dims.w - PADDING * 2) / fw;
        const scaleY = (dims.h - PADDING * 2) / fh;
        const scale = Math.min(scaleX, scaleY);
        const tx = (v) => PADDING + v * scale;
        const ty = (v) => PADDING + v * scale;

        // Wheel zoom toward cursor
        const handleWheel = useCallback(
          (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            const rect = svgRef.current?.getBoundingClientRect();
            if (!rect) return;
            const mx = ((e.clientX - rect.left) * dims.w) / rect.width;
            const my = ((e.clientY - rect.top) * dims.h) / rect.height;
            setZoom((z) => {
              const nz = Math.max(0.5, Math.min(14, z * factor));
              setPan((p) => ({
                x: mx - ((mx - p.x) * nz) / z,
                y: my - ((my - p.y) * nz) / z,
              }));
              return nz;
            });
          },
          [dims],
        );

        useEffect(() => {
          const el = svgRef.current;
          if (!el) return;
          el.addEventListener("wheel", handleWheel, { passive: false });
          return () => el.removeEventListener("wheel", handleWheel);
        }, [handleWheel]);

        // Global mouse listeners so pan continues even when cursor leaves the SVG
        useEffect(() => {
          const onMove = (e) => {
            if (!isDraggingRef.current) return;
            const { sx, sy, px, py } = dragRef.current;
            setPan({ x: px + e.clientX - sx, y: py + e.clientY - sy });
          };
          const onUp = () => {
            if (!isDraggingRef.current) return;
            isDraggingRef.current = false;
            setDragging(false);
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
          return () => {
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          };
        }, []); // eslint-disable-line

        const handleMouseDown = (e) => {
          if (e.button !== 0) return;
          isDraggingRef.current = true;
          setDragging(true);
          dragRef.current = {
            sx: e.clientX,
            sy: e.clientY,
            px: pan.x,
            py: pan.y,
          };
        };

        // Room focus — animate zoom+pan to fit the selected room
        useEffect(() => {
          if (!focusRoomId) {
            setZoom(1);
            setPan({ x: 0, y: 0 });
            return;
          }
          const room = rooms.find((r) => String(r.id) === String(focusRoomId));
          if (!room?.polygon?.length) return;
          const xs = room.polygon.map((p) => p[0]);
          const ys = room.polygon.map((p) => p[1]);
          const minX = Math.min(...xs),
            maxX = Math.max(...xs);
          const minY = Math.min(...ys),
            maxY = Math.max(...ys);
          const rw = (maxX - minX) * scale || scale * 0.5;
          const rh = (maxY - minY) * scale || scale * 0.5;
          const margin = 80;
          const nz = Math.max(
            1.5,
            Math.min(
              14,
              Math.min((dims.w - margin) / rw, (dims.h - margin) / rh) * 0.72,
            ),
          );
          const contentCX = tx((minX + maxX) / 2);
          const contentCY = ty((minY + maxY) / 2);
          setPan({
            x: dims.w / 2 - contentCX * nz,
            y: dims.h / 2 - contentCY * nz,
          });
          setZoom(nz);
        }, [focusRoomId, rooms]); // eslint-disable-line

        // Access-level colour map
        const alMap = useMemo(() => {
          const m = {};
          (accessLevels || []).forEach((a) => {
            m[a.id] = a.color;
          });
          return m;
        }, [accessLevels]);

        const DEF_FILLS = [
          "#3b82f628",
          "#10b98128",
          "#f59e0b28",
          "#ef444428",
          "#8b5cf628",
          "#06b6d428",
        ];
        const DEF_BORDERS = [
          "#3b82f6",
          "#10b981",
          "#f59e0b",
          "#ef4444",
          "#8b5cf6",
          "#06b6d4",
        ];

        return h(
          "div",
          { style: { position: "relative" } },
          h(
            "svg",
            {
              ref: svgRef,
              viewBox: `0 0 ${dims.w} ${dims.h}`,
              className: `no-drag ${className} w-full bg-panel rounded-lg border border-border select-none`,
              style: {
                display: "block",
                cursor: dragging ? "grabbing" : "grab",
                transform: rotation ? `rotate(${rotation}deg)` : undefined,
                transformOrigin: "center",
              },
              onMouseDown: handleMouseDown,
            },
            h(
              "g",
              { transform: `translate(${pan.x},${pan.y}) scale(${zoom})` },
              // DXF walls
              ...dxfWalls.map((w, wi) =>
                h("line", {
                  key: `dw${wi}`,
                  x1: tx(w.x1),
                  y1: ty(w.y1),
                  x2: tx(w.x2),
                  y2: ty(w.y2),
                  stroke: "#6b7280",
                  strokeWidth: 1.5,
                  strokeLinecap: "round",
                }),
              ),
              // DXF room outlines
              ...dxfRooms.map((rm, ri) => {
                if (!rm.polygon?.length) return null;
                const pts = rm.polygon
                  .map((p) => `${tx(p[0])},${ty(p[1])}`)
                  .join(" ");
                const cx =
                  rm.polygon.reduce((s, p) => s + p[0], 0) / rm.polygon.length;
                const cy =
                  rm.polygon.reduce((s, p) => s + p[1], 0) / rm.polygon.length;
                return h(
                  "g",
                  { key: `dr${ri}` },
                  h("polygon", {
                    points: pts,
                    fill: "#3b82f610",
                    stroke: "#3b82f650",
                    strokeWidth: 1,
                    strokeDasharray: "4,3",
                  }),
                  h(
                    "text",
                    {
                      x: tx(cx),
                      y: ty(cy),
                      textAnchor: "middle",
                      dominantBaseline: "central",
                      fontSize: 10,
                      fill: "#3b82f6",
                      opacity: 0.7,
                    },
                    rm.name,
                  ),
                );
              }),
              // Floor boundary
              h("rect", {
                x: tx(0),
                y: ty(0),
                width: fw * scale,
                height: fh * scale,
                fill: "none",
                stroke: "#374151",
                strokeWidth: 2,
                strokeDasharray: "6,3",
              }),
              // Rooms
              ...rooms.map((r, i) => {
                const poly = r.polygon;
                if (!poly || poly.length < 3) return null;
                const pts = poly
                  .map((p) => `${tx(p[0])},${ty(p[1])}`)
                  .join(" ");
                const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length;
                const cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
                const isFocused = String(r.id) === String(focusRoomId);
                const alColor = alMap[r.access_level_id];
                const fillC = showRoomColors
                  ? alColor
                    ? alColor + "35"
                    : DEF_FILLS[i % DEF_FILLS.length]
                  : "#1f1f2818";
                const strkC = showRoomColors
                  ? alColor || DEF_BORDERS[i % DEF_BORDERS.length]
                  : "#3a3a4a";
                return h(
                  "g",
                  { key: `room-${i}` },
                  h("polygon", {
                    points: pts,
                    fill: fillC,
                    stroke: showRoomBorders
                      ? isFocused
                        ? "#ae5630"
                        : strkC
                      : "none",
                    strokeWidth: isFocused ? 3 : 1.5,
                  }),
                  h(
                    "text",
                    {
                      x: tx(cx),
                      y: ty(cy),
                      textAnchor: "middle",
                      dominantBaseline: "central",
                      fontSize: 11,
                      fontWeight: "500",
                      fill: strkC,
                    },
                    r.name,
                  ),
                );
              }),
              // Fingerprint grid overlay
              ...(showFpGrid
                ? rooms.map((r, ri) => {
                    const poly = r.polygon;
                    if (!poly || poly.length < 3) return null;
                    const gs = r.grid_size_override || gridSize;
                    const xs = poly.map((p) => p[0]),
                      ys = poly.map((p) => p[1]);
                    const minX = Math.floor(Math.min(...xs) / gs) * gs;
                    const maxX = Math.ceil(Math.max(...xs) / gs) * gs;
                    const minY = Math.floor(Math.min(...ys) / gs) * gs;
                    const maxY = Math.ceil(Math.max(...ys) / gs) * gs;
                    function pip(px, py, v) {
                      let inside = false;
                      for (let i = 0, j = v.length - 1; i < v.length; j = i++) {
                        const xi = v[i][0],
                          yi = v[i][1],
                          xj = v[j][0],
                          yj = v[j][1];
                        if (
                          yi > py !== yj > py &&
                          px < ((xj - xi) * (py - yi)) / (yj - yi) + xi
                        )
                          inside = !inside;
                      }
                      return inside;
                    }
                    const cells = [];
                    for (let gx = minX; gx < maxX; gx += gs) {
                      for (let gy = minY; gy < maxY; gy += gs) {
                        const cx = gx + gs / 2,
                          cy = gy + gs / 2;
                        if (pip(cx, cy, poly)) {
                          cells.push(
                            h("rect", {
                              key: `gc${ri}-${gx}-${gy}`,
                              x: tx(gx),
                              y: ty(gy),
                              width: gs * scale,
                              height: gs * scale,
                              fill: "none",
                              stroke: "#8b5cf680",
                              strokeWidth: 0.7,
                              strokeDasharray: "2,2",
                            }),
                          );
                          cells.push(
                            h("circle", {
                              key: `gd${ri}-${gx}-${gy}`,
                              cx: tx(cx),
                              cy: ty(cy),
                              r: 2,
                              fill: "#8b5cf660",
                            }),
                          );
                        }
                      }
                    }
                    return h("g", { key: `fpg-${ri}` }, ...cells);
                  })
                : []),
              // Anchors
              ...(showAnchors
                ? anchors.map((a, i) =>
                    h(
                      "g",
                      { key: `anchor-${i}` },
                      h("rect", {
                        x: tx(a.x_m) - 8,
                        y: ty(a.y_m) - 8,
                        width: 16,
                        height: 16,
                        rx: 3,
                        fill: "#1e40af",
                        stroke: "#fff",
                        strokeWidth: 2,
                      }),
                      h(
                        "text",
                        {
                          x: tx(a.x_m),
                          y: ty(a.y_m),
                          textAnchor: "middle",
                          dominantBaseline: "central",
                          fontSize: 8,
                          fontWeight: "bold",
                          fill: "#fff",
                        },
                        (a.anchor_id || "")
                          .replace("AP", "")
                          .replace("ESP_", "E")
                          .slice(0, 2),
                      ),
                      showAnchorLabels &&
                        h(
                          "text",
                          {
                            x: tx(a.x_m),
                            y: ty(a.y_m) + 18,
                            textAnchor: "middle",
                            fontSize: 9,
                            fill: "#6b7280",
                          },
                          a.anchor_id,
                        ),
                    ),
                  )
                : []),
              // ── Range circles (anchor → estimated distance ring) ─────────
              ...(showRangeCircles
                ? devices.flatMap((d) => {
                    const ranging = anchorRanging[d.device_id] || {};
                    return Object.entries(ranging).map(([aid, info]) =>
                      h("circle", {
                        key: `rc-${d.device_id}-${aid}`,
                        cx: tx(info.x),
                        cy: ty(info.y),
                        r: Math.max(2, info.dist_m * scale),
                        fill: "none",
                        stroke: `rgba(236,72,153,${Math.max(0.2, info.weight * 0.7)})`,
                        strokeWidth: 1.2,
                        strokeDasharray: "5,3",
                      }),
                    );
                  })
                : []),
              // ── Range lines (anchor → device) with distance + RSSI labels ─
              ...(showRangeLines
                ? devices.flatMap((d) => {
                    const ranging = anchorRanging[d.device_id] || {};
                    return Object.entries(ranging).flatMap(([aid, info]) => {
                      const x1 = tx(info.x),
                        y1 = ty(info.y);
                      const x2 = tx(d.x || 0),
                        y2 = ty(d.y || 0);
                      const mx = (x1 + x2) / 2,
                        my = (y1 + y2) / 2;
                      const w = Math.max(0.2, info.weight);
                      return [
                        h("line", {
                          key: `rl-${d.device_id}-${aid}`,
                          x1,
                          y1,
                          x2,
                          y2,
                          stroke: `rgba(236,72,153,${(w * 0.6 + 0.2).toFixed(2)})`,
                          strokeWidth: 1,
                          strokeDasharray: "3,2",
                        }),
                        h(
                          "text",
                          {
                            key: `rlt-${d.device_id}-${aid}`,
                            x: mx,
                            y: my - 3,
                            textAnchor: "middle",
                            fontSize: 8,
                            fill: "#f9a8d4",
                            style: { pointerEvents: "none" },
                          },
                          `${info.dist_m.toFixed(1)}m  ${info.rssi_dbm.toFixed(0)}dBm`,
                        ),
                      ];
                    });
                  })
                : []),
              // ── All-methods ghost pins ────────────────────────────────────
              ...(showAllMethods
                ? Object.entries(allMethodsData).flatMap(
                    ([method, entries]) => {
                      const color = METHOD_GHOST_COLORS[method] || "#6b7280";
                      return (entries || []).map((e, i) =>
                        h(
                          "g",
                          { key: `gm-${method}-${i}` },
                          h("circle", {
                            cx: tx(e.x || 0),
                            cy: ty(e.y || 0),
                            r: 6,
                            fill: color + "55",
                            stroke: color,
                            strokeWidth: 1.5,
                          }),
                          h(
                            "text",
                            {
                              x: tx(e.x || 0),
                              y: ty(e.y || 0) - 9,
                              textAnchor: "middle",
                              fontSize: 7,
                              fill: color,
                              style: { pointerEvents: "none" },
                            },
                            (METHOD_INFO[method] || {}).label || method,
                          ),
                        ),
                      );
                    },
                  )
                : []),
              // Devices
              ...devices.map((d, i) =>
                h(
                  "g",
                  { key: `dev-${i}` },
                  h("circle", {
                    cx: tx(d.x || 0),
                    cy: ty(d.y || 0),
                    r: 10,
                    fill: d.reachable ? "#10b981" : "#9ca3af",
                    stroke: "#fff",
                    strokeWidth: 2.5,
                  }),
                  h("circle", {
                    cx: tx(d.x || 0),
                    cy: ty(d.y || 0),
                    r: 16,
                    fill: "none",
                    stroke: d.reachable ? "#10b98140" : "none",
                    strokeWidth: 2,
                    className: d.reachable ? "pulse-dot" : "",
                  }),
                  showTagLabels &&
                    h(
                      "text",
                      {

      function MapView() {
        const [selectedCampus, setSelectedCampus] = useState(null);
        const [selectedBuilding, setSelectedBuilding] = useState(null);
        const [selectedFloor, setSelectedFloor] = useState(null);
        const [selectedRoomId, setSelectedRoomId] = useState(null);
        const [platformRooms, setPlatformRooms] = useState([]);
        const [platformAnchors, setPlatformAnchors] = useState([]);
        const [accessLevels, setAccessLevels] = useState([]);
        const [mapDxfWalls, setMapDxfWalls] = useState([]);
        const [mapDxfRooms, setMapDxfRooms] = useState([]);
        const [floorGridSize, setFloorGridSize] = useState(1.0);
        const [rotation, setRotation] = useState(0);
        const [isFullscreen, setIsFullscreen] = useState(false);
        const [activeMethod, setActiveMethod] = useState("trilateration");
        const mapContainerRef = useRef(null);

        // Visual toggles
        const [showAnchors, setShowAnchors] = useState(true);
        const [showRoomColors, setShowRoomColors] = useState(true);
        const [showRoomBorders, setShowRoomBorders] = useState(true);
        const [showAnchorLabels, setShowAnchorLabels] = useState(true);
        const [showTagLabels, setShowTagLabels] = useState(true);
        const [showFpGrid, setShowFpGrid] = useState(false);
        const [showRangeCircles, setShowRangeCircles] = useState(false);
        const [showRangeLines, setShowRangeLines] = useState(false);
        const [showAllMethods, setShowAllMethods] = useState(false);

        // Engine data for selected method
        const { data: mapData, error: mapError } = usePolling(
          () => engine.map(activeMethod).catch(() => null),
          3000,
          [activeMethod],
        );

        // Anchor ranging detail (range circles + lines)
        const { data: anchorDetailData } = usePolling(
          () =>
            showRangeCircles || showRangeLines
              ? fetch(`${ENGINE_API}/map/anchor-detail`)
                  .then((r) => r.json())
                  .catch(() => null)
              : Promise.resolve(null),
          2000,
          [showRangeCircles, showRangeLines],
        );

        // All-methods overlay
        const { data: allMethodsRaw } = usePolling(
          () =>
            showAllMethods
              ? fetch(`${ENGINE_API}/map/all`)
                  .then((r) => r.json())
                  .catch(() => null)
              : Promise.resolve(null),
          3000,
          [showAllMethods],
        );

        // Hierarchy
        const { data: campuses } = useApi(() => platform.listCampuses());
        useEffect(() => {
          if (campuses?.length && !selectedCampus)
            setSelectedCampus(campuses[0]);
        }, [campuses]);

        const { data: buildings } = useApi(
          () =>
            selectedCampus
              ? platform.listBuildings(selectedCampus.id)
              : Promise.resolve([]),

        useEffect(() => {
          if (buildings?.length && !selectedBuilding)
            setSelectedBuilding(buildings[0]);

        const { data: floors } = useApi(
          () =>
            selectedBuilding
              ? platform.listFloors(selectedBuilding.id)
              : Promise.resolve([]),
          [selectedBuilding?.id],
        );
        useEffect(() => {
          if (floors?.length && !selectedFloor) setSelectedFloor(floors[0]);
        }, [floors]);

        // Load floor geometry + access levels
        useEffect(() => {
          if (!selectedFloor) return;
          setSelectedRoomId(null);
          platform
            .listRooms(selectedFloor.id)
            .then((r) => setPlatformRooms(r || []))
            .catch(() => {});
          platform
            .listAnchors(selectedFloor.id)
            .then((a) => setPlatformAnchors(a || []))
            .catch(() => {});
          platform
            .getEditorData(selectedFloor.id)
            .then((ed) => {
              setMapDxfWalls(ed.data?.dxf_walls || []);
              setMapDxfRooms(ed.data?.dxf_rooms || []);
            })
            .catch(() => {});
          setFloorGridSize(selectedFloor.default_grid_size_m || 1.0);
        }, [selectedFloor?.id]);

        useEffect(() => {
          if (!selectedBuilding) return;

            .listAccessLevels(selectedBuilding.id)
            .then((a) => setAccessLevels(a || []))
            .catch(() => {});

        // Pure React fullscreen — no browser Fullscreen API (avoids pywebview click-to-dismiss quirks).
        // Stamp a body class so the CSS rule kills the TopBar drag-region while fullscreen is active,
        // preventing the window from being moved by clicking blank space in the overlay.
        const toggleFullscreen = () => setIsFullscreen((v) => !v);
        useEffect(() => {
          if (isFullscreen) {
            document.body.classList.add("map-fullscreen");

            document.body.classList.remove("map-fullscreen");

          return () => document.body.classList.remove("map-fullscreen");

        // Merge: prefer platform geometry, fallback to engine

            val: showRoomColors,
            set: setShowRoomColors,

            label: "Borders",
            val: showRoomBorders,
            set: setShowRoomBorders,
          },
          {
            key: "apLabels",

            val: showAnchorLabels,

            label: "Tag Labels",
            val: showTagLabels,
            set: setShowTagLabels,

            label: "Range Circles",

        return h(

          h(

            { className: "flex items-center justify-between mb-5" },

                { className: "text-2xl font-semibold text-ink" },

                { className: "text-muted text-sm mt-1" },

          // ── Row 1: Hierarchy + Method selector ───────────────────────────
          h(

            { className: "flex items-center gap-2 mb-2 flex-wrap" },

            floors?.length > 0 &&

                      onClick: () => setSelectedFloor(f),
                      className: `px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                        selectedFloor?.id === f.id

                      }`,
                    },
                    f.name,
                  ),
                ),
              ),
            // Room focus selector
            rooms.length > 0 &&
              h(
                "select",
                {
                  value: selectedRoomId || "",
                  onChange: (e) => setSelectedRoomId(e.target.value || null),
                  className:
                    "border border-border rounded-lg px-2.5 py-1.5 text-sm bg-surface text-ink",
                  style: { minWidth: 130 },
                },
                h("option", { value: "" }, "All Rooms"),
                rooms.map((r) =>
                  h("option", { key: r.id, value: r.id }, r.name),
                ),
              ),
            // Localization method overlay
            h(
              "select",
              {
                value: activeMethod,
                onChange: (e) => setActiveMethod(e.target.value),
                className:
                  "border border-border rounded-lg px-2.5 py-1.5 text-sm bg-surface text-ink ml-auto",
                style: { minWidth: 150 },
              },
              Object.entries(METHOD_INFO).map(([k, v]) =>
                h("option", { key: k, value: k }, v.label),

          ),
          // ── Row 2: Toggle chips + Map actions ────────────────────────────
          h(
            "div",
            { className: "flex items-center gap-1.5 mb-4 flex-wrap" },
            TOGGLES.map((tg) =>

            h(

              { className: "ml-auto flex gap-2" },
              h(

                {

                  className:
                    "px-2.5 py-1 rounded text-xs font-medium border border-border bg-surface-dim text-ink-secondary hover:text-ink",
                  title: "Rotate 90°",

              h(

                {

                  className:
                    "px-2.5 py-1 rounded text-xs font-medium border border-border bg-surface-dim text-ink-secondary hover:text-ink",
                  title: isFullscreen ? "Exit fullscreen" : "Enter fullscreen",

          ),
          // ── Map canvas ────────────────────────────────────────────────────
          h(

            },

                { className: "flex items-center gap-2 flex-wrap shrink-0" },

                  { className: "text-sm font-medium text-ink" },

                      onChange: (e) =>

                      className:

                h(

                  },

            !rooms.length && !devices.length && !anchors.length

              : h(FloorCanvas, {

                  focusRoomId: selectedRoomId,
                  rotation,
                  showAnchors,
                  showRoomColors,
                  showRoomBorders,
                  showAnchorLabels,
                  showTagLabels,
                  className: isFullscreen ? "flex-1" : "",
                  // Overlay props
                  showRangeCircles,

          ),
          // ── Device cards ──────────────────────────────────────────────────
          devices.length > 0 &&
            h(

              {
                className:
                  "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4",
              },
              devices.map((d, i) => {

                const hasRanging = Object.keys(ranging).length > 0;
                return h(
                  "div",
                  {
                    key: i,
                    className: "bg-panel rounded-lg border border-border p-4",
                  },
                  h(
                    "div",
                    { className: "flex items-center justify-between mb-2" },
                    h(
                      "span",
                      { className: "font-medium text-sm" },
                      d.device_id,
                    ),
                    h(StatusDot, {
                      status: d.reachable ? "online" : "offline",
                    }),
                  ),
                  h(
                    "div",
                    { className: "text-xs text-muted space-y-1" },
                    d.room_id && h("div", null, `Room: ${d.room_id}`),
                    d.x != null &&
                      d.y != null &&
                      h(
                        "div",
                        { className: "font-mono" },
                        `(${Number(d.x).toFixed(1)}, ${Number(d.y).toFixed(1)})m`,
                      ),
                    d.timestamp &&
                      h(
                        "div",
                        null,
                        new Date(d.timestamp).toLocaleTimeString(),
                      ),
                  ),
                  // Per-anchor RSSI → distance detail (only shown when anchor-detail is active)
                  hasRanging &&
                    h(
                      "div",
                      { className: "mt-3 pt-3 border-t border-border" },
                      h(
                        "div",
                        {
                          className:
                            "text-xs font-medium text-ink-secondary mb-1.5",
                        },
                        "Anchor Ranging",
                      ),
                      h(
                        "div",
                        { className: "space-y-1" },
                        Object.entries(ranging).map(([aid, info]) =>
                          h(
                            "div",
                            {
                              key: aid,
                              className:
                                "flex items-center justify-between text-xs",
                            },
                            h(
                              "span",
                              { className: "text-muted font-mono" },
                              aid,
                            ),
                            h(
                              "div",
                              { className: "flex gap-2 items-center" },
                              h(
                                "span",
                                {
                                  className: "font-mono",
                                  style: {
                                    color: `rgba(236,72,153,${Math.max(0.5, info.weight)})`,
                                  },
                                },
                                `${info.dist_m.toFixed(1)}m`,
                              ),
                              h(
                                "span",
                                { className: "text-muted font-mono" },
                                `${info.rssi_dbm.toFixed(0)}dBm`,
                              ),
                              h(
                                "span",
                                {
                                  className: "text-muted",
                                  title: `Variance weight: ${(info.weight * 100).toFixed(0)}%`,
                                },
                                `w=${(info.weight * 100).toFixed(0)}%`,
                              ),
                            ),
                          ),
                        ),
                      ),
                    ),
                );
              }),

      function DeviceTables() {
        const [tab, setTab] = useState("anchors");
        return h(
          "div",
          { className: "fade-in" },
          h(
            "div",
            { className: "mb-6" },
            h(
              "h1",
              { className: "text-2xl font-semibold text-ink" },
              "Devices",
            ),
            h(
              "p",
              { className: "text-muted text-sm mt-1" },
              "Manage anchors and tracked tags",
            ),
          ),
          h(
            "div",
            { className: "flex gap-1 mb-6" },
            ["anchors", "tags"].map((t) =>
              h(
                "button",
                {
                  key: t,
                  onClick: () => setTab(t),
                  className: `px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                    tab === t
                      ? "bg-accent text-white"
                      : "bg-surface-dim text-ink-secondary hover:text-ink hover:bg-panel border border-transparent hover:border-border"
                  }`,

      // ── Device status / flag metadata ─────────────────────────────────────────

      const DEVICE_STATUSES = [
        { value: "in_stock", label: "In Stock", badgeColor: "gray" },
        { value: "in_use", label: "In Use", badgeColor: "green" },
        {
          value: "deployment_in_progress",
          label: "Deployment In Progress",
          badgeColor: "yellow",
        },
        { value: "decommissioned", label: "Decommissioned", badgeColor: "red" },
      ];

      const ANCHOR_FLAGS = [
        {
          value: "needs_provision",
          label: "Needs Provision",
          badgeColor: "yellow",
        },
        {
          value: "ready_to_deploy",
          label: "Ready to Deploy",
          badgeColor: "blue",
        },
        {
          value: "admin_down",
          label: "Administratively Down",
          badgeColor: "red",
        },
        { value: "shutdown", label: "Shutdown", badgeColor: "red" },
      ];

      function DeviceStatusBadge({ value }) {

          label: value,
          badgeColor: "gray",
        };
        return h(Badge, { color: meta.badgeColor }, meta.label);

          return h("span", { className: "text-muted text-xs" }, "—");
        return h(
          "div",
          { className: "flex gap-1 flex-wrap" },
          flags.map((f) => {
            const meta = ANCHOR_FLAGS.find((af) => af.value === f) || {
              label: f,
              badgeColor: "gray",
            };

      function AnchorsTable() {
        const { data, loading, error, reload } = useApi(() =>
          platform.listAllAnchors(),
        );
        const [filter, setFilter] = useState("");
        const [statusFilter, setStatusFilter] = useState("");
        const [showRegister, setShowRegister] = useState(false);
        const [editId, setEditId] = useState(null); // anchor.id being edited
        const [editData, setEditData] = useState({});
        const [saving, setSaving] = useState(false);
        const [polling, setPolling] = useState(false);
        const [pollMsg, setPollMsg] = useState(null);

        // Registration form state
        const [form, setForm] = useState({
          anchor_id: "",
          anchor_type: "engenius_ap",
          ip_address: "",
          mac_address: "",
          brand: "",
          model: "",
          device_status: "in_stock",
          flags: [],
          username: "admin",
          password: "admin",
        });
        const [registering, setRegistering] = useState(false);
        const [registerError, setRegisterError] = useState(null);

        // Ping debug state
        const [debugIp, setDebugIp] = useState("");
        const [debugResult, setDebugResult] = useState(null);
        const [debugLoading, setDebugLoading] = useState(false);

        const handlePingDebug = async () => {
          if (!debugIp.trim()) return;
          setDebugLoading(true);
          setDebugResult(null);
          try {
            const res = await platform.pingDebug(debugIp.trim());
            setDebugResult(res);
          } catch (e) {
            setDebugResult({ error: e.message, reachable: false });
          } finally {
            setDebugLoading(false);
          }
        };

        const handlePollNow = async () => {
          setPolling(true);
          setPollMsg(null);
          try {
            const res = await platform.pollAnchorsNow();
            const online = res.results?.filter((r) => r.reachable).length ?? 0;
            const total = res.polled ?? 0;
            setPollMsg({
              ok: true,
              text: `Polled ${total} device${total !== 1 ? "s" : ""} — ${online} online`,
            });
            reload();
          } catch (e) {
            const msg = e.message?.includes("Failed to fetch")
              ? "Cannot reach platform backend — is it running?"
              : e.message;
            setPollMsg({ ok: false, text: msg });
          } finally {
            setPolling(false);
          }
        };

        const handleRegister = async () => {
          if (!form.anchor_id.trim()) return;
          setRegistering(true);
          setRegisterError(null);
          try {
            await platform.registerAnchor({
              ...form,
              anchor_id: form.anchor_id.trim(),
            });
            setForm({
              anchor_id: "",
              anchor_type: "engenius_ap",
              ip_address: "",
              mac_address: "",
              brand: "",
              model: "",
              device_status: "in_stock",
              flags: [],
              username: "admin",
              password: "admin",
            });
            setShowRegister(false);
            reload();
          } catch (e) {
            const msg = e.message?.includes("Failed to fetch")
              ? "Cannot reach platform backend — make sure the backend service is running on port 8080."
              : e.message;
            setRegisterError(msg);
          } finally {
            setRegistering(false);
          }
        };

        const startEdit = (a) => {
          setEditId(a.id);
          setEditData({
            device_status: a.device_status || "in_stock",
            flags: a.flags || [],
          });
        };
        const cancelEdit = () => {
          setEditId(null);
          setEditData({});
        };
        const saveEdit = async (a) => {
          setSaving(true);
          try {
            await platform.updateAnchor(a.id, editData);
            setEditId(null);
            reload();
          } catch (e) {
            alert(e.message);
          } finally {
            setSaving(false);
          }
        };
        const handleDelete = async (a) => {
          if (!window.confirm(`Delete anchor "${a.anchor_id}"?`)) return;
          try {
            await platform.deleteAnchor(a.id);
            reload();
          } catch (e) {
            alert(e.message);
          }
        };
        const toggleFlag = (flag, current) => {
          const next = current.includes(flag)
            ? current.filter((f) => f !== flag)
            : [...current, flag];
          setEditData((d) => ({ ...d, flags: next }));
        };

        if (loading) return h(LoadingSpinner);
        if (error)
          return h(ErrorBanner, {
            message: `Could not load anchors: ${error}`,
            onRetry: reload,
          });

        const items = (data || []).filter((a) => {
          const q = filter.toLowerCase();
          const matchText =
            !q ||
            a.anchor_id.toLowerCase().includes(q) ||
            (a.ip_address || "").includes(q) ||
            (a.mac_address || "").toLowerCase().includes(q);
          const matchStatus = !statusFilter || a.device_status === statusFilter;
          return matchText && matchStatus;
        });

        const COLS = [
          "ID",
          "Type",
          "IP",
          "MAC",
          "Device Status",
          "Flags",
          "Connectivity",
          "Last Reached",
          "Floor",
          "Actions",
        ];

                                      : a.status === "trying"
                                        ? "text-amber-400"
                                        : a.status === "offline"

                                  (() => {
                                    const diff =
                                      Date.now() -
                                      new Date(a.last_reached).getTime();
                                    const mins = Math.floor(diff / 60000);
                                    const secs = Math.floor(
                                      (diff % 60000) / 1000,
                                    );
                                    if (mins > 60)
                                      return `${Math.floor(mins / 60)}h ago`;
                                    if (mins > 0) return `${mins}m ago`;
                                    return `${secs}s ago`;

                              : h(

      const PRIORITY_COLORS = [
        "gray",

      ];
      const PRIORITY_LABELS = ["—", "Low", "P2", "P3", "High", "Critical"];

      function TagsTable() {
        const { data, loading, error, reload } = useApi(() =>
          platform.listTags(),
        );
        const [filter, setFilter] = useState("");
        const [showCreate, setShowCreate] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [editForm, setEditForm] = useState({});
        const [form, setForm] = useState({
          tag_id: "",
          name: "",
          device_type: "",
          ssid: "",
          mac_address: "",
          rssi_at_1m_dbm: -22,
          path_loss_n: 4.0,
          security_level: 1,
          priority: 1,
          floor_scope: "ALL",
          room_scope: "",
        });
        const [creating, setCreating] = useState(false);
        const [tagPolling, setTagPolling] = useState(false);
        const [tagPollMsg, setTagPollMsg] = useState(null);

        const handleTagPollNow = async () => {
          setTagPolling(true);
          setTagPollMsg(null);
          try {
            const res = await platform.pollTagsNow();
            const seen = res.results?.filter((r) => r.seen).length ?? 0;
            const total = res.polled ?? 0;
            setTagPollMsg({
              ok: true,
              text: `Scanned ${total} tag${total !== 1 ? "s" : ""} — ${seen} detected`,
            });
            reload();
          } catch (e) {
            const msg = e.message?.includes("Failed to fetch")
              ? "Cannot reach platform backend — is it running?"
              : e.message;
            setTagPollMsg({ ok: false, text: msg });
          } finally {
            setTagPolling(false);
          }
        };

        const parseScope = (val) =>
          val.trim() === "" || val.trim() === "ALL"
            ? ["ALL"]
            : val
                .split(",")
                .map((s) => s.trim())
                .filter(Boolean);
        const parseScopeRoom = (val) =>
          val.trim() === ""
            ? []
            : val
                .split(",")
                .map((s) => s.trim())
                .filter(Boolean);

        const handleCreate = async () => {
          if (!form.tag_id.trim()) return;
          setCreating(true);
          try {
            await platform.createTag({
              ...form,
              tag_id: form.tag_id.trim(),
              name: form.name.trim(),
              rssi_at_1m_dbm: +form.rssi_at_1m_dbm,
              path_loss_n: +form.path_loss_n,
              security_level: +form.security_level,
              priority: +form.priority,
              floor_scope: parseScope(form.floor_scope),
              room_scope: parseScopeRoom(form.room_scope),
            });
            setForm({
              tag_id: "",
              name: "",
              device_type: "",
              ssid: "",
              mac_address: "",
              rssi_at_1m_dbm: -22,
              path_loss_n: 4.0,
              security_level: 1,
              priority: 1,
              floor_scope: "ALL",
              room_scope: "",
            });
            setShowCreate(false);
            reload();
          } catch (e) {
            alert(e.message);
          } finally {
            setCreating(false);
          }
        };

        const startEdit = (t) => {
          setEditingId(t.id);
          setEditForm({
            name: t.name || "",
            device_type: t.device_type || "",
            security_level: t.security_level ?? 1,
            priority: t.priority ?? 1,
            floor_scope: (t.floor_scope || ["ALL"]).join(", "),
            room_scope: (t.room_scope || []).join(", "),
          });
        };

        const handleSaveEdit = async (id) => {
          try {
            await platform.updateTag(id, {
              name: editForm.name.trim(),
              device_type: editForm.device_type.trim(),
              security_level: +editForm.security_level,
              priority: +editForm.priority,
              floor_scope: parseScope(editForm.floor_scope),
              room_scope: parseScopeRoom(editForm.room_scope),
            });
            setEditingId(null);
            reload();
          } catch (e) {
            alert(e.message);
          }
        };

        if (loading) return h(LoadingSpinner);
        if (error)
          return h(ErrorBanner, {
            message: `Could not load tags: ${error}`,
            onRetry: reload,
          });

        const items = (data || []).filter(
          (t) =>
            !filter ||
            t.tag_id.toLowerCase().includes(filter.toLowerCase()) ||
            (t.name || "").toLowerCase().includes(filter.toLowerCase()) ||
            (t.ssid || "").toLowerCase().includes(filter.toLowerCase()),
        );

        const COLS = [
          "Tag ID / Name",
          "Type",
          "SSID / MAC",
          "Priority",
          "Sec Lvl",
          "Floor Scope",
          "Room Scope",
          "Location",
          "Status",
          "",
        ];

        return h(
          "div",
          { className: "space-y-4" },
          showCreate &&
            h(
              Card,
              { title: "Register Tag" },
              h(
                "div",
                { className: "grid grid-cols-2 lg:grid-cols-3 gap-3 mb-3" },
                h(Input, {
                  label: "Tag ID *",
                  value: form.tag_id,
                  onChange: (v) => setForm((f) => ({ ...f, tag_id: v })),
                  placeholder: "e.g. tag_001",
                }),
                h(Input, {
                  label: "Friendly Name",
                  value: form.name,
                  onChange: (v) => setForm((f) => ({ ...f, name: v })),
                  placeholder: "e.g. Dr. Smith's Laptop",
                }),
                h(Input, {
                  label: "Device Type",
                  value: form.device_type,
                  onChange: (v) => setForm((f) => ({ ...f, device_type: v })),
                  placeholder: "laptop / phone / badge…",
                }),
                h(Input, {
                  label: "SSID",
                  value: form.ssid,
                  onChange: (v) => setForm((f) => ({ ...f, ssid: v })),
                  placeholder: "e.g. NothingPhone",
                }),
                h(Input, {
                  label: "MAC Address",
                  value: form.mac_address,
                  onChange: (v) => setForm((f) => ({ ...f, mac_address: v })),
                  placeholder: "AA:BB:CC:DD:EE:FF",
                }),
                h(Input, {
                  label: "RSSI @ 1m (dBm)",
                  type: "number",
                  value: form.rssi_at_1m_dbm,
                  onChange: (v) =>
                    setForm((f) => ({ ...f, rssi_at_1m_dbm: v })),
                }),
                h(Input, {
                  label: "Path Loss (n)",
                  type: "number",
                  step: "0.1",
                  value: form.path_loss_n,
                  onChange: (v) => setForm((f) => ({ ...f, path_loss_n: v })),
                }),
                h(Input, {
                  label: "Priority (1–5)",
                  type: "number",
                  min: 1,
                  max: 5,
                  value: form.priority,
                  onChange: (v) => setForm((f) => ({ ...f, priority: v })),
                }),
                h(Input, {
                  label: "Security Level",
                  type: "number",
                  min: 1,
                  value: form.security_level,
                  onChange: (v) =>
                    setForm((f) => ({ ...f, security_level: v })),
                }),
                h(Input, {
                  label: "Floor Scope (comma-sep or ALL)",

      // Compact SVG map — used in small cards
      function MethodMapSvg({
        rooms,
        devices,
        fw,
        fh,
        width,
        height,
        methodColor = "blue",
        focusRoomId = null,
      }) {
        const W = width || 260,
          H = height || 180;
        const PAD = 16;
        const cols = METHOD_SVG_COLORS[methodColor] || METHOD_SVG_COLORS.gray;
        const baseScale = Math.min(
          (W - PAD * 2) / (fw || 20),
          (H - PAD * 2) / (fh || 20),
        );

        // If a room is focused, compute zoom+pan into it
        let zoom = 1,
          panX = 0,
          panY = 0;
        if (focusRoomId) {
          const room = rooms.find(
            (r) => String(r.id || r.name) === String(focusRoomId),
          );
          if (room?.polygon?.length) {
            const xs = room.polygon.map(([px]) => px);
            const ys = room.polygon.map(([, py]) => py);
            const minX = Math.min(...xs),
              maxX = Math.max(...xs);
            const minY = Math.min(...ys),
              maxY = Math.max(...ys);
            const rw = (maxX - minX) * baseScale || baseScale * 0.5;
            const rh = (maxY - minY) * baseScale || baseScale * 0.5;
            zoom = Math.max(
              1.2,
              Math.min(
                8,
                Math.min((W - PAD * 2) / rw, (H - PAD * 2) / rh) * 0.72,
              ),
            );
            const contentCX = PAD + ((minX + maxX) / 2) * baseScale;
            const contentCY = PAD + ((minY + maxY) / 2) * baseScale;
            panX = W / 2 - contentCX * zoom;
            panY = H / 2 - contentCY * zoom;
          }
        }

        const tx = (v) => PAD + v * baseScale;
        const ty = (v) => PAD + v * baseScale;
        const small = W <= 300;

        return h(
          "svg",
          {
            viewBox: `0 0 ${W} ${H}`,
            style: {
              background: "#18181b",
              display: "block",
              width: "100%",
              height: "100%",
            },
            preserveAspectRatio: "xMidYMid meet",
          },
          h(
            "g",
            { transform: `translate(${panX},${panY}) scale(${zoom})` },
            // Floor boundary
            h("rect", {
              x: tx(0),
              y: ty(0),
              width: (fw || 20) * baseScale,
              height: (fh || 20) * baseScale,
              fill: "none",
              stroke: "#374151",
              strokeWidth: 1,
              strokeDasharray: "4,2",
            }),
            // Rooms
            ...rooms.map((r, ri) => {
              if (!r.polygon?.length) return null;
              const pts = r.polygon
                .map(([px, py]) => `${tx(px)},${ty(py)}`)
                .join(" ");
              const cx =
                r.polygon.reduce((s, [px]) => s + px, 0) / r.polygon.length;
              const cy =
                r.polygon.reduce((s, [, py]) => s + py, 0) / r.polygon.length;
              const isFocused = String(r.id || r.name) === String(focusRoomId);
              return h(
                "g",
                { key: ri },
                h("polygon", {
                  points: pts,
                  fill: cols.fill,
                  stroke: isFocused ? "#ae5630" : cols.stroke + "88",
                  strokeWidth: isFocused ? 2 : 1,
                }),
                h(
                  "text",
                  {
                    x: tx(cx),
                    y: ty(cy),
                    textAnchor: "middle",
                    dominantBaseline: "middle",
                    fill: cols.text,
                    fontSize: small ? 8 : 11,
                  },
                  r.name,
                ),
              );
            }),
            // Devices
            ...devices.map((d, di) => {
              const r = small ? 5 : 8;
              const fs = small ? 7 : 10;
              return h(
                "g",
                { key: di },
                h("circle", {
                  cx: tx(d.x || 0),
                  cy: ty(d.y || 0),
                  r,
                  fill: d.reachable ? "#22c55e" : "#f87171",
                  stroke: "#fff",
                  strokeWidth: 1,
                }),
                h(
                  "text",
                  {
                    x: tx(d.x || 0),
                    y: ty(d.y || 0) - r - 2,
                    textAnchor: "middle",
                    fill: "#e4e4e7",
                    fontSize: fs,
                  },
                  d.device_id,
                ),
              );
            }),
          ),
        );
      }
