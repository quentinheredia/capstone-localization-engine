        theme: {

            colors: {
              ink: "#dddde3",

              "surface-dim": "#111115",

              "accent-light": "#ae563022",
              success: "#4ade80",
              warn: "#fbbf24",
              danger: "#f87171",

              border: "#2a2a33",

              "chrome-border": "#222229",

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap");
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Crimson Pro", "Georgia", serif;
      }
      code,
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .fade-in {
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .pulse-dot {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      svg text {
        user-select: none;
      }
      /* Frameless-window drag region support.
         Default the entire body to no-drag so only explicitly marked
         elements (the TopBar) can move the window.                        */
      body {
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      .drag-region {
        -webkit-app-region: drag;
        app-region: drag;
      }
      .no-drag {
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      /* When the map is in fullscreen mode, kill ALL drag regions so the
         window cannot be moved by clicking blank space in the overlay.     */
      body.map-fullscreen .drag-region {
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      ::selection {
        background: #ae563040;
      }
      input:focus,
      select:focus,
      textarea:focus {
        box-shadow: 0 0 0 2px #ae563040;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2a33;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a45;
      }
    </style>
  </head>
  <body
    class="bg-surface text-ink min-h-screen antialiased"
    style="color-scheme: dark"
  >
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script>
      if (window.pdfjsLib)
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>

    <script>
      const React = window.React;
      const { createRoot } = window.ReactDOM;
      const {
        useState,
        useEffect,
        useCallback,
        useRef,
        useMemo,
        createElement: h,
        Fragment,
      } = React;

      // ─── CONFIG ──────────────────────────────────────────────────────────
      const PLATFORM_API =
        window.__IPS_PLATFORM_API || "http://localhost:8080/api/v1";
      const ENGINE_API = window.__IPS_ENGINE_API || "http://localhost:8000";

      // ─── API CLIENT ──────────────────────────────────────────────────────
      async function api(base, path, opts = {}) {
        const { method = "GET", body, params } = opts;
        let url = `${base}${path}`;
        if (params) {
          const sp = new URLSearchParams();
          Object.entries(params).forEach(([k, v]) => {
            if (v != null) sp.set(k, String(v));
          });
          const qs = sp.toString();
          if (qs) url += `?${qs}`;
        }
        const headers = {};
        if (body) headers["Content-Type"] = "application/json";
        const res = await fetch(url, {
          method,
          headers,
          body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 204) return null;
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`${res.status} ${res.statusText}: ${text}`);
        }
        return res.json();
      }

      const platform = {
        // Campuses
        listCampuses: () => api(PLATFORM_API, "/campuses"),
        createCampus: (d) =>
          api(PLATFORM_API, "/campuses", { method: "POST", body: d }),
        deleteCampus: (id) =>
          api(PLATFORM_API, `/campuses/${id}`, { method: "DELETE" }),
        // Buildings
        listBuildings: (cid) => api(PLATFORM_API, `/campuses/${cid}/buildings`),
        createBuilding: (cid, d) =>
          api(PLATFORM_API, `/campuses/${cid}/buildings`, {
            method: "POST",
            body: d,
          }),
        deleteBuilding: (id) =>
          api(PLATFORM_API, `/buildings/${id}`, { method: "DELETE" }),
        // Floors
        listFloors: (bid) => api(PLATFORM_API, `/buildings/${bid}/floors`),
        createFloor: (bid, d) =>
          api(PLATFORM_API, `/buildings/${bid}/floors`, {
            method: "POST",
            body: d,
          }),
        deleteFloor: (id) =>
          api(PLATFORM_API, `/floors/${id}`, { method: "DELETE" }),
        getFloor: (id) => api(PLATFORM_API, `/floors/${id}`),
        // Rooms
        listRooms: (fid) => api(PLATFORM_API, `/floors/${fid}/rooms`),
        createRoom: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/rooms`, {
            method: "POST",
            body: d,
          }),
        deleteRoom: (id) =>
          api(PLATFORM_API, `/rooms/${id}`, { method: "DELETE" }),
        updateRoom: (id, d) =>
          api(PLATFORM_API, `/rooms/${id}`, { method: "PATCH", body: d }),
        // Anchors
        listAnchors: (fid) => api(PLATFORM_API, `/floors/${fid}/anchors`),
        listAllAnchors: (p) => api(PLATFORM_API, "/anchors", { params: p }),
        registerAnchor: (d) =>
          api(PLATFORM_API, "/anchors", { method: "POST", body: d }),
        createAnchor: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/anchors`, {
            method: "POST",
            body: d,
          }),
        deleteAnchor: (id) =>
          api(PLATFORM_API, `/anchors/${id}`, { method: "DELETE" }),
        pollAnchorsNow: () =>
          api(PLATFORM_API, "/anchors/poll", { method: "POST" }),
        pingDebug: (ip) =>
          api(PLATFORM_API, "/anchors/ping-debug", { params: { ip } }),
        updateAnchor: (id, d) =>
          api(PLATFORM_API, `/anchors/${id}`, { method: "PATCH", body: d }),
        // Tags
        listTags: (p) => api(PLATFORM_API, "/tags", { params: p }),
        createTag: (d) =>
          api(PLATFORM_API, "/tags", { method: "POST", body: d }),
        deleteTag: (id) =>
          api(PLATFORM_API, `/tags/${id}`, { method: "DELETE" }),
        updateTag: (id, d) =>
          api(PLATFORM_API, `/tags/${id}`, { method: "PATCH", body: d }),
        pollTagsNow: () => api(PLATFORM_API, "/tags/poll", { method: "POST" }),
        // Logs
        listCrossings: (p) => api(PLATFORM_API, "/crossings", { params: p }),
        listAlerts: (p) => api(PLATFORM_API, "/alerts", { params: p }),
        ackAlert: (id, by) =>
          api(PLATFORM_API, `/alerts/${id}/ack`, {
            method: "POST",
            body: { acknowledged_by: by },
          }),
        // Engine logs (stored in platform DB by background tasks)
        listEngineLogs: (p) => api(PLATFORM_API, "/engine-logs", { params: p }),
        ackEngineLog: (id, by) =>
          api(PLATFORM_API, `/engine-logs/${id}/ack`, {
            method: "POST",
            body: { acknowledged_by: by },
          }),
        clearEngineLogs: (hours) =>
          api(PLATFORM_API, "/engine-logs", {
            method: "DELETE",
            params: hours != null ? { older_than_hours: hours } : {},
          }),
        // Config / Engine
        generateConfig: (p) =>
          api(PLATFORM_API, "/config/generate", { method: "POST", params: p }),
        startEngine: (p) =>
          api(PLATFORM_API, "/engine/start", { method: "POST", params: p }),
        stopEngine: () => api(PLATFORM_API, "/engine/stop", { method: "POST" }),
        engineStatus: () => api(PLATFORM_API, "/engine/status"),
        // Push generated config to engine WITHOUT starting the poll (used by Survey page)
        engineLoadConfig: (campus_id, building, floor) =>
          api(PLATFORM_API, "/engine/load-config", {
            method: "POST",
            params: { campus_id, building, floor },

        // Floor Plan Editor
        getEditorData: (fid) => api(PLATFORM_API, `/floors/${fid}/editor-data`),
        saveEditorData: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/editor-data`, {

            body: d,

        syncEditorRooms: (fid, d) =>
          api(PLATFORM_API, `/floors/${fid}/editor-sync-rooms`, {
            method: "POST",
            body: d,
          }),
        copyFloorplan: (fid, srcId) =>
          api(PLATFORM_API, `/floors/${fid}/copy-from/${srcId}`, {
            method: "POST",

        uploadEditorPdf: async (fid, file) => {
          const fd = new FormData();
          fd.append("file", file);
          const res = await fetch(`${PLATFORM_API}/floors/${fid}/editor-pdf`, {
            method: "POST",
            body: fd,
          });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t);
          }
          return res.json();
        },
        getEditorPdfUrl: (fid) => `${PLATFORM_API}/floors/${fid}/editor-pdf`,
        deleteEditorPdf: (fid) =>
          api(PLATFORM_API, `/floors/${fid}/editor-pdf`, { method: "DELETE" }),
        importDxf: async (fid, file, scale) => {
          const fd = new FormData();
          fd.append("file", file);
          const url = new URL(`${PLATFORM_API}/floors/${fid}/import-dxf`);
          if (scale) url.searchParams.set("scale", String(scale));
          const res = await fetch(url.toString(), { method: "POST", body: fd });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t);
          }
          return res.json();
        },
        importRoomsJson: (fid, data) =>
          api(PLATFORM_API, `/floors/${fid}/import-rooms-json`, {
            method: "POST",
            body: data,

        // Access Levels

        clientLog: (level, message, source = "client", meta = null) =>

            method: "POST",
            params: { level, message, source },
            body: meta || undefined,

      const engine = {

        status: () => api(ENGINE_API, "/status"),
        config: () => api(ENGINE_API, "/config"),
        map: (method) =>

        devices: () => api(ENGINE_API, "/devices"),
        decisions: (limit) =>

        decisionsByMethod: (method, limit) =>

        raw: () => api(ENGINE_API, "/raw"),
        logs: (p) => api(ENGINE_API, "/logs", { params: p }),
        // Survey / fingerprint calibration
        surveyTargets: () => api(ENGINE_API, "/survey/targets"),
        surveyStart: (room_label, target_ssid, samples) =>

            method: "POST",
            params: { room_label, target_ssid, samples },

        surveyStatus: () => api(ENGINE_API, "/survey/status"),
        surveyCancel: () =>

        surveyDeleteRoom: (room) =>

          api(ENGINE_API, `/survey/radiomap/${encodeURIComponent(room)}`),

      // ─── SHARED COMPONENTS ───────────────────────────────────────────────

      function Badge({ color = "gray", children }) {

          green:
            "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30",
          red: "bg-red-500/15 text-red-400 border border-red-500/30",
          yellow: "bg-amber-500/10 text-amber-400 border border-amber-500/30",
          blue: "bg-sky-500/10 text-sky-400 border border-sky-500/30",
          gray: "bg-surface-dim text-ink-secondary border border-border",
          purple:
            "bg-violet-500/15 text-violet-400 border border-violet-500/30",
          teal: "bg-teal-500/15 text-teal-400 border border-teal-500/30",

          "span",

            className: `inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${colors[color] || colors.gray}`,
          },

      }

      function Button({
        variant = "primary",
        size = "md",
        disabled,
        onClick,
        children,
        className = "",
      }) {

          "inline-flex items-center justify-center font-medium rounded-md transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-accent disabled:opacity-40 disabled:cursor-not-allowed";
        const variants = {
          primary: "bg-accent text-white hover:bg-accent-dim shadow-sm",
          secondary:
            "bg-surface-dim text-ink border border-border hover:bg-panel",
          danger:
            "bg-red-500/15 text-danger border border-red-500/30 hover:bg-red-500/25",
          ghost: "text-ink-secondary hover:bg-surface-dim hover:text-ink",
        };
        const sizes = {
          sm: "px-2.5 py-1 text-xs",
          md: "px-4 py-2 text-sm",
          lg: "px-5 py-2.5 text-sm",

        return h(
          "button",
          {
            className: `${base} ${variants[variant]} ${sizes[size]} ${className}`,
            disabled,
            onClick,

      function Input({

        onChange,

          h("input", {

            onChange: (e) => onChange(e.target.value),

      }

      function Select({ label, value, onChange, options, className = "" }) {
        return h(
          "div",
          { className },
          label &&
            h(
              "label",
              { className: "block text-sm font-medium text-muted mb-1" },
              label,
            ),
          h(
            "select",
            {
              value,
              onChange: (e) => onChange(e.target.value),

                "w-full px-3 py-2 bg-panel border border-border rounded-md text-sm text-ink focus:border-accent outline-none transition",

      function Card({ title, actions, children, className = "" }) {

          "div",
          {
            className: `bg-panel rounded-lg border border-border ${className}`,

      function EmptyState({

      function LoadingSpinner() {
        return h(
          "div",
          { className: "flex items-center justify-center py-12" },
          h("div", {
            className:
              "w-7 h-7 border-2 border-accent border-t-transparent rounded-full animate-spin",

      }

      function ErrorBanner({ message, onRetry }) {
        return h(
          "div",
          {
            className:
              "bg-red-500/10 border border-red-500/30 rounded-md p-4 flex items-center justify-between",
          },
          h(
            "div",
            { className: "flex items-center gap-2" },
            h("span", { className: "text-danger" }, "\u26A0"),
            h("span", { className: "text-sm text-danger" }, message),
          ),
          onRetry &&
            h(
              Button,
              { variant: "ghost", size: "sm", onClick: onRetry },
              "Retry",
            ),

      }

      function StatusDot({ status }) {
        const color =
          status === "online"
            ? "bg-emerald-500"
            : status === "polling"
              ? "bg-amber-400 pulse-dot"
              : status === "trying"
                ? "bg-amber-400 pulse-dot"
                : status === "offline"
                  ? "bg-red-400"
                  : "bg-border";
        return h("span", {
          className: `inline-block w-2 h-2 rounded-full ${color}`,
        });
      }

      // ─── HOOKS ───────────────────────────────────────────────────────────

      function useApi(fn, deps = []) {
        const [data, setData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const reload = useCallback(async () => {
          setLoading(true);
          setError(null);
          try {
            setData(await fn());
          } catch (e) {
            setError(e.message);
          } finally {
            setLoading(false);
          }
        }, deps);
        useEffect(() => {
          reload();
        }, [reload]);
        return { data, loading, error, reload };
      }

      function usePolling(fn, intervalMs, deps = []) {
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);
        useEffect(() => {
          let active = true;
          const tick = async () => {
            try {
              const d = await fn();
              if (active) {
                setData(d);
                setError(null);
              }
            } catch (e) {
              if (active) setError(e.message);
            }
          };
          tick();
          const id = setInterval(tick, intervalMs);
          return () => {
            active = false;
            clearInterval(id);
          };
        }, deps);
        return { data, error };
      }

      // ─── CONNECTION MONITOR ──────────────────────────────────────────────
      // Detects when the platform backend becomes unreachable and logs
      // reconnections with downtime duration via POST /client-log.
      function useConnectionMonitor() {
        const [platformDown, setPlatformDown] = useState(false);

        const [downtimeSecs, setDowntimeSecs] = useState(0);

        const wasDownRef = useRef(false);

        const downSinceRef = useRef(null);

        // Require 2 consecutive failures before declaring the backend down.
        // This prevents a single slow WebView2 localhost fetch from triggering
        // the disconnection banner spuriously.
        const consecutiveFailures = useRef(0);
        const FAILURES_TO_DOWN = 2;
        const FETCH_TIMEOUT_MS = 8000;

        // Health-check loop — runs every 5s

        useEffect(() => {
          let active = true;

          const check = async () => {
            let isUp = false;

            try {
              const ctrl = new AbortController();

              const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);

              const res = await fetch(
                `${PLATFORM_API.replace("/api/v1", "")}/health`,

                { signal: ctrl.signal },
              );

              clearTimeout(timer);

              isUp = res.ok;
            } catch {
              isUp = false;
            }

            if (!active) return;

            if (!isUp) {
              consecutiveFailures.current += 1;
            } else {
              consecutiveFailures.current = 0;
            }

            if (
              !isUp &&
              consecutiveFailures.current >= FAILURES_TO_DOWN &&
              !wasDownRef.current
            ) {
              // Transition: up → down (only after FAILURES_TO_DOWN consecutive misses)

              wasDownRef.current = true;

              downSinceRef.current = Date.now();

              setPlatformDown(true);

              setDowntimeSecs(0);
            } else if (isUp && wasDownRef.current) {
              // Transition: down → up

              wasDownRef.current = false;

              const downtime = Math.round(
                (Date.now() - downSinceRef.current) / 1000,
              );

              const wentDown = new Date(downSinceRef.current).toISOString();

              downSinceRef.current = null;

              setPlatformDown(false);

              setDowntimeSecs(0);

              // Write reconnect log now that backend is reachable again

              platform

                .clientLog(
                  "warn",

                  `Frontend reconnected to platform backend — was unreachable for ${downtime}s`,

                  "client",

                  { downtime_s: downtime, went_down_at: wentDown },
                )

                .catch(() => {});
            }
          };

          check();

          const id = setInterval(check, 5000);

          return () => {
            active = false;

            clearInterval(id);
          };
        }, []);

        // Ticker — updates elapsed seconds every second while platform is down

        useEffect(() => {
          if (!platformDown) return;

          const id = setInterval(() => {
            if (downSinceRef.current) {
              setDowntimeSecs(
                Math.round((Date.now() - downSinceRef.current) / 1000),
              );
            }
          }, 1000);

          return () => clearInterval(id);
        }, [platformDown]);

        const downtimeLabel = useMemo(() => {
          if (downtimeSecs < 60) return `${downtimeSecs}s`;

          const m = Math.floor(downtimeSecs / 60);

          const s = downtimeSecs % 60;

          return `${m}m ${s}s`;

          floor.default_grid_size_m || 1.0,
        );
        const [showGrid, setShowGrid] = useState(false);
        const [showEditorGrid, setShowEditorGrid] = useState(true);
        const [snapGrid, setSnapGrid] = useState(true);
        const [saving, setSaving] = useState(false);
        const [dirty, setDirty] = useState(false);
        const [editLength, setEditLength] = useState("");
        const [roomName, setRoomName] = useState("");
        const [alForm, setAlForm] = useState({ name: "", color: "#6b7280" });
        const [copyFloorId, setCopyFloorId] = useState("");
        const [allFloors, setAllFloors] = useState([]);
        const [dragPt, setDragPt] = useState(null);
        const [dragStart, setDragStart] = useState(null);
        // Multi-point selection (shift+click)
        const [multiSel, setMultiSel] = useState(new Set()); // Set of point IDs
        const [multiEditX, setMultiEditX] = useState("");
        const [multiEditY, setMultiEditY] = useState("");
        // Copy/paste clipboard: array of {x, y} relative to centroid
        const [clipboard, setClipboard] = useState(null); // null | {pts: [{dx,dy}], centroid:{x,y}}
        const [pasteCount, setPasteCount] = useState(0); // tracks successive pastes for offset
        // Zoom / pan state
        const [vb, setVb] = useState({ x: 0, y: 0, w: 900, h: 600 });
        const vbRef = useRef({ x: 0, y: 0, w: 900, h: 600 });
        const [panDrag, setPanDrag] = useState(null); // {clientX, clientY, vbSnap}
        // Cursor position in floor-plan metres (shown as a HUD overlay)
        const [cursorPos, setCursorPos] = useState(null); // null | {x, y}
        // DXF import state
        const [dxfWalls, setDxfWalls] = useState([]);
        const [dxfRooms, setDxfRooms] = useState([]);
        const [dxfImporting, setDxfImporting] = useState(false);
        const [dxfMsg, setDxfMsg] = useState(null);
        const [roomJsonText, setRoomJsonText] = useState("");
        const [roomImporting, setRoomImporting] = useState(false);
        const [roomImportMsg, setRoomImportMsg] = useState(null);

        const svgRef = useRef(null);
        const [dims, setDims] = useState({ w: 900, h: 600 });

        const fw = floor.width_m || 20;
        const fh = floor.height_m || 15;
        const PADDING = 40;

        // Responsive sizing — reset viewBox when container size changes
        useEffect(() => {
          const ro = new ResizeObserver((entries) => {
            for (const e of entries) {
              const w = e.contentRect.width;
              if (w > 0) {
                const aspect = fh / fw;
                const newH = Math.max(350, Math.min(700, w * aspect));
                setDims({ w, h: newH });
                const freshVb = { x: 0, y: 0, w, h: newH };
                vbRef.current = freshVb;
                setVb(freshVb);
              }
            }
          });
          if (svgRef.current?.parentElement)
            ro.observe(svgRef.current.parentElement);
          return () => ro.disconnect();
        }, [fw, fh]);

        const scaleX = (dims.w - PADDING * 2) / fw;
        const scaleY = (dims.h - PADDING * 2) / fh;
        const sc = Math.min(scaleX, scaleY);
        const tx = (v) => PADDING + v * sc;
        const ty = (v) => PADDING + v * sc;
        const fromSvgX = (px) => (px - PADDING) / sc;
        const fromSvgY = (py) => (py - PADDING) / sc;

        // Accurate SVG coordinate from a pointer event using the CTM.
        // Handles viewBox zoom/pan and any CSS scaling automatically.
        const clientToSVG = useCallback((e) => {
          const svgEl = svgRef.current;
          if (!svgEl) return { x: 0, y: 0 };
          const pt = svgEl.createSVGPoint();
          pt.x = e.clientX;
          pt.y = e.clientY;
          return pt.matrixTransform(svgEl.getScreenCTM().inverse());
        }, []);

        // Scroll-wheel zoom (must be non-passive to preventDefault)
        useEffect(() => {
          const svgEl = svgRef.current;
          if (!svgEl) return;
          const onWheel = (e) => {
            e.preventDefault();
            const cur = vbRef.current;
            const factor = e.deltaY < 0 ? 1.25 : 1 / 1.25;
            // Clamp zoom between 0.5× and 20× of original dims
            const minW = dims.w / 20;
            const maxW = dims.w * 1.5;
            const newW = Math.max(minW, Math.min(maxW, cur.w / factor));
            const newH = newW * (cur.h / cur.w);
            // Zoom to cursor
            const pt = svgEl.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            const anchor = pt.matrixTransform(svgEl.getScreenCTM().inverse());
            const fx = (anchor.x - cur.x) / cur.w;
            const fy = (anchor.y - cur.y) / cur.h;
            const newVb = {
              x: anchor.x - fx * newW,
              y: anchor.y - fy * newH,
              w: newW,
              h: newH,
            };
            vbRef.current = newVb;
            setVb(newVb);
          };
          svgEl.addEventListener("wheel", onWheel, { passive: false });
          return () => svgEl.removeEventListener("wheel", onWheel);
        }, [dims.w, dims.h]);

        const SNAP = 0.15; // metres
        const snapToPoint = (wx, wy) => {
          for (const p of points) {
            if (Math.abs(p.x - wx) < SNAP && Math.abs(p.y - wy) < SNAP)
              return p;
          }
          return null;
        };

        // Snap coordinates to nearest grid intersection
        const snapToGrid = (wx, wy) => {
          if (!snapGrid)
            return {
              x: Math.round(wx * 100) / 100,
              y: Math.round(wy * 100) / 100,
            };
          const gs = gridSize;
          return {
            x: Math.round(wx / gs) * gs,
            y: Math.round(wy / gs) * gs,
          };
        };

        // Apply right-angle constraint from a reference point
        const applyRightAngle = (wx, wy, refX, refY) => {
          const dx = Math.abs(wx - refX);
          const dy = Math.abs(wy - refY);
          if (dx > dy) return { x: wx, y: refY }; // more horizontal → lock Y
          return { x: refX, y: wy }; // more vertical → lock X
        };

        // Load data on mount
        useEffect(() => {
          platform
            .getEditorData(floor.id)
            .then((res) => {
              const d = res.data || {};
              if (d.points?.length) {
                setPoints(d.points);
                _fpId =
                  Math.max(
                    _fpId,
                    ...d.points.map(
                      (p) => parseInt(p.id.replace(/\D/g, "")) || 0,
                    ),
                  ) + 1;
              }
              if (d.lines?.length) {
                setLines(d.lines);
                _fpId =
                  Math.max(
                    _fpId,
                    ...d.lines.map(
                      (l) => parseInt(l.id.replace(/\D/g, "")) || 0,
                    ),
                  ) + 1;
              }
              if (d.rooms?.length) {
                setEditorRooms(d.rooms);
                _fpId =
                  Math.max(
                    _fpId,
                    ...d.rooms.map(
                      (r) => parseInt(r.id.replace(/\D/g, "")) || 0,
                    ),
                  ) + 1;
              }
              if (res.default_grid_size_m) setGridSize(res.default_grid_size_m);
              setHasPdf(!!res.has_pdf);
              if (d.dxf_walls?.length) setDxfWalls(d.dxf_walls);
              if (d.dxf_rooms?.length) setDxfRooms(d.dxf_rooms);
            })
            .catch(() => {});
          if (building) {
            platform
              .listAccessLevels(building.id)
              .then(setAccessLevels)
              .catch(() => {});
            platform
              .listFloors(building.id)
              .then((f) => setAllFloors(f.filter((fl) => fl.id !== floor.id)))
              .catch(() => {});
          }
        }, [floor.id]);

        // Load PDF background
        useEffect(() => {
          if (!hasPdf) return;
          const url = platform.getEditorPdfUrl(floor.id);
          if (window.pdfjsLib) {
            pdfjsLib
              .getDocument(url)
              .promise.then((pdf) => pdf.getPage(1))
              .then((page) => {
                const vp = page.getViewport({ scale: 2 });
                const canvas = document.createElement("canvas");
                canvas.width = vp.width;
                canvas.height = vp.height;
                page
                  .render({
                    canvasContext: canvas.getContext("2d"),
                    viewport: vp,
                  })
                  .promise.then(() => {
                    setPdfDataUrl(canvas.toDataURL("image/png"));
                  });
              })
              .catch(() => {});
          }
        }, [hasPdf, floor.id]);

        // Mark dirty on changes
        const markDirty = () => setDirty(true);

        // Live refs for keyboard handler (must be after markDirty is defined)
        const pointsRef = useRef(points);
        const selectedRef = useRef(selected);
        const multiSelRef = useRef(multiSel);
        const clipboardRef = useRef(clipboard);
        const pasteCountRef = useRef(pasteCount);
        useEffect(() => {
          pointsRef.current = points;
        }, [points]);
        useEffect(() => {
          selectedRef.current = selected;
        }, [selected]);
        useEffect(() => {
          multiSelRef.current = multiSel;
        }, [multiSel]);
        useEffect(() => {
          clipboardRef.current = clipboard;
        }, [clipboard]);
        useEffect(() => {
          pasteCountRef.current = pasteCount;
        }, [pasteCount]);

        // Ctrl+C / Ctrl+V keyboard shortcuts
        useEffect(() => {
          const onKey = (e) => {
            const tag = document.activeElement?.tagName?.toLowerCase();
            if (tag === "input" || tag === "textarea" || tag === "select")
              return;
            if (!e.ctrlKey && !e.metaKey) return;

            if (e.key === "c" || e.key === "C") {
              const pts = pointsRef.current,
                ms = multiSelRef.current,
                sel = selectedRef.current;
              let ids = [];
              if (ms.size >= 1) ids = [...ms];
              else if (sel?.type === "point") ids = [sel.id];
              if (!ids.length) return;
              e.preventDefault();
              const srcPts = ids
                .map((id) => pts.find((p) => p.id === id))
                .filter(Boolean);
              if (!srcPts.length) return;
              const cx = srcPts.reduce((s, p) => s + p.x, 0) / srcPts.length;
              const cy = srcPts.reduce((s, p) => s + p.y, 0) / srcPts.length;
              setClipboard({
                pts: srcPts.map((p) => ({ dx: p.x - cx, dy: p.y - cy })),
                centroid: { x: cx, y: cy },
              });
              setPasteCount(0);
            } else if (e.key === "v" || e.key === "V") {
              const cb = clipboardRef.current;
              if (!cb) return;
              e.preventDefault();
              const n = pasteCountRef.current + 1,
                OFFSET = 0.5,
                ox = cb.centroid.x + n * OFFSET,
                oy = cb.centroid.y + n * OFFSET;
              const newIds = new Set();
              setPoints((prev) => {
                const next = [...prev];
                cb.pts.forEach(({ dx, dy }) => {
                  const id = `p${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
                  newIds.add(id);
                  next.push({
                    id,
                    x: Math.max(0, ox + dx),
                    y: Math.max(0, oy + dy),
                  });
                });
                return next;
              });
              if (newIds.size === 1) {
                setSelected({ type: "point", id: [...newIds][0] });
                setMultiSel(new Set());
              } else {
                setMultiSel(new Set(newIds));
              }
              setPasteCount(n);
              markDirty();
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, []);

        // SVG click handler
        const handleSvgClick = (e) => {
          if (dragPt) return; // was a drag, not a click
          if (panDrag) return; // was a pan, not a click
          const svgPt = clientToSVG(e);
          const wx = fromSvgX(svgPt.x);
          const wy = fromSvgY(svgPt.y);

          if (wx < 0 || wx > fw || wy < 0 || wy > fh) return;

          if (tool === "point") {
            const existing = snapToPoint(wx, wy);
            // Shift+click on existing point → toggle multi-selection
            if (e.shiftKey && existing) {
              setMultiSel((prev) => {
                const next = new Set(prev);
                if (next.has(existing.id)) next.delete(existing.id);
                else next.add(existing.id);
                return next;
              });
              setSelected({ type: "point", id: existing.id });
              return;
            }
            if (existing) {
              setSelected({ type: "point", id: existing.id });
              if (!e.shiftKey) setMultiSel(new Set());
              return;
            }
            if (e.shiftKey) return; // shift+click on empty space does nothing
            const snapped = snapToGrid(wx, wy);
            const np = {
              id: fpId("p"),
              x: Math.max(0, Math.min(fw, snapped.x)),
              y: Math.max(0, Math.min(fh, snapped.y)),
            };
            setPoints((prev) => [...prev, np]);
            setSelected({ type: "point", id: np.id });
            setMultiSel(new Set());
            markDirty();
          } else if (tool === "line") {
            // Compute snapped position: right-angle from lineStart, then grid snap
            let tx2 = wx,
              ty2 = wy;
            const startPt = lineStart
              ? points.find((p) => p.id === lineStart)
              : null;
            if (startPt) {
              const ra = applyRightAngle(wx, wy, startPt.x, startPt.y);
              tx2 = ra.x;
              ty2 = ra.y;
            }
            const gs2 = snapToGrid(tx2, ty2);
            tx2 = Math.max(0, Math.min(fw, gs2.x));
            ty2 = Math.max(0, Math.min(fh, gs2.y));

            // Prefer an existing nearby point; otherwise create one at snapped pos
            let hit = snapToPoint(tx2, ty2) || snapToPoint(wx, wy);
            if (!hit) {
              if (!lineStart) {
                // No start yet and no existing point nearby — create one at grid snap
                hit = { id: fpId("p"), x: tx2, y: ty2 };
                setPoints((prev) => [...prev, hit]);
                markDirty();
              } else {
                // Have a start — create endpoint at right-angle + grid snap
                hit = { id: fpId("p"), x: tx2, y: ty2 };
                setPoints((prev) => [...prev, hit]);
                markDirty();
              }
            }

            if (!lineStart) {
              setLineStart(hit.id);
            } else if (hit.id !== lineStart) {
              const pA = points.find((p) => p.id === lineStart) || startPt;
              const nl = {
                id: fpId("l"),
                from: lineStart,
                to: hit.id,
                length_m: pA
                  ? Math.round(Math.hypot(hit.x - pA.x, hit.y - pA.y) * 100) /
                    100
                  : 0,
              };
              setLines((prev) => [...prev, nl]);
              setSelected({ type: "line", id: nl.id });
              setEditLength(String(nl.length_m));
              setLineStart(null);
              markDirty();
            }
          } else if (tool === "room") {
            const gs3 = snapToGrid(wx, wy);
            const hit = snapToPoint(wx, wy) || snapToPoint(gs3.x, gs3.y);
            if (!hit) return;
            if (
              roomPts.length > 0 &&
              hit.id === roomPts[0] &&
              roomPts.length >= 3
            ) {
              // Close the room
              const name = prompt(
                "Room name:",
                `Room ${editorRooms.length + 1}`,
              );
              if (name) {
                const nr = {
                  id: fpId("r"),
                  name,
                  pointIds: [...roomPts],
                  access_level_id: null,
                  grid_size_override: null,
                };
                setEditorRooms((prev) => [...prev, nr]);
                markDirty();
              }
              setRoomPts([]);
            } else if (!roomPts.includes(hit.id)) {
              setRoomPts((prev) => [...prev, hit.id]);
            }
          } else if (tool === "select") {
            const hit = snapToPoint(wx, wy);
            if (hit) {
              if (e.shiftKey) {
                // Shift+click → add/remove from multi-selection
                setMultiSel((prev) => {
                  const next = new Set(prev);
                  if (next.has(hit.id)) next.delete(hit.id);
                  else next.add(hit.id);
                  return next;
                });
                setSelected({ type: "point", id: hit.id });
              } else {
                setSelected({ type: "point", id: hit.id });
                setMultiSel(new Set());
              }
              return;
            }
            // Non-shift click on empty space clears multi-selection
            if (!e.shiftKey) setMultiSel(new Set());
            // Check room hit
            for (const rm of editorRooms) {
              const poly = rm.pointIds
                .map((pid) => points.find((p) => p.id === pid))
                .filter(Boolean);
              if (poly.length >= 3 && pointInPoly(wx, wy, poly)) {
                setSelected({ type: "room", id: rm.id });
                return;
              }
            }
            // Check line hit
            for (const ln of lines) {
              const pA = points.find((p) => p.id === ln.from);
              const pB = points.find((p) => p.id === ln.to);
              if (pA && pB && distToLine(wx, wy, pA, pB) < 0.3) {
                setSelected({ type: "line", id: ln.id });
                setEditLength(String(ln.length_m));
                return;
              }
            }
            setSelected(null);
          } else if (tool === "delete") {
            const hit = snapToPoint(wx, wy);
            if (hit) {
              setPoints((prev) => prev.filter((p) => p.id !== hit.id));
              setLines((prev) =>
                prev.filter((l) => l.from !== hit.id && l.to !== hit.id),
              );
              setEditorRooms((prev) =>
                prev.filter((r) => !r.pointIds.includes(hit.id)),
              );
              setSelected(null);
              markDirty();
              return;
            }
            for (const ln of lines) {
              const pA = points.find((p) => p.id === ln.from);
              const pB = points.find((p) => p.id === ln.to);
              if (pA && pB && distToLine(wx, wy, pA, pB) < 0.3) {
                setLines((prev) => prev.filter((l) => l.id !== ln.id));
                setSelected(null);
                markDirty();
                return;
              }
            }
            for (const rm of editorRooms) {
              const poly = rm.pointIds
                .map((pid) => points.find((p) => p.id === pid))
                .filter(Boolean);
              if (poly.length >= 3 && pointInPoly(wx, wy, poly)) {
                setEditorRooms((prev) => prev.filter((r) => r.id !== rm.id));
                setSelected(null);
                markDirty();
                return;
              }
            }
          }
        };

        // Point dragging + viewport panning (right-click drag)
        const handleSvgMouseDown = (e) => {
          // Right-click or middle-click → pan viewport
          if (e.button === 2 || e.button === 1) {
            setPanDrag({
              clientX: e.clientX,
              clientY: e.clientY,
              vbSnap: vbRef.current,
            });
            e.preventDefault();
            return;
          }
          if (tool !== "select") return;
          const svgPt = clientToSVG(e);
          const wx = fromSvgX(svgPt.x);
          const wy = fromSvgY(svgPt.y);
          const hit = snapToPoint(wx, wy);
          if (hit) {
            setDragPt(hit.id);
            setDragStart({ x: e.clientX, y: e.clientY });
            e.preventDefault();
          }
        };
        const handleSvgMouseMove = (e) => {
          // Always track cursor position in floor-plan metres
          const svgPtC = clientToSVG(e);
          const cx = Math.max(0, Math.min(fw, fromSvgX(svgPtC.x)));
          const cy = Math.max(0, Math.min(fh, fromSvgY(svgPtC.y)));
          setCursorPos({ x: cx, y: cy });

          // Pan viewport
          if (panDrag) {
            const svgEl = svgRef.current;
            if (!svgEl) return;
            const cur = panDrag.vbSnap;
            const rect = svgEl.getBoundingClientRect();
            const dxScreen = e.clientX - panDrag.clientX;
            const dyScreen = e.clientY - panDrag.clientY;
            // Convert screen delta to SVG-space delta
            const dxSvg = (dxScreen / rect.width) * cur.w;
            const dySvg = (dyScreen / rect.height) * cur.h;
            const newVb = { ...cur, x: cur.x - dxSvg, y: cur.y - dySvg };
            vbRef.current = newVb;
            setVb(newVb);
            return;
          }
          if (!dragPt) return;
          const svgPt = clientToSVG(e);
          const wx = Math.max(0, Math.min(fw, fromSvgX(svgPt.x)));
          const wy = Math.max(0, Math.min(fh, fromSvgY(svgPt.y)));
          const dragSnapped = snapToGrid(wx, wy);
          setPoints((prev) =>
            prev.map((p) =>
              p.id === dragPt
                ? { ...p, x: dragSnapped.x, y: dragSnapped.y }
                : p,
            ),
          );
        };
        const handleSvgMouseUp = (e) => {
          if (panDrag) {
            setPanDrag(null);
            return;
          }
          if (dragPt) {
            markDirty();
            setDragPt(null);
            setDragStart(null);
          }
        };
        const handleContextMenu = (e) => e.preventDefault();

        // Geometry helpers
        function pointInPoly(x, y, poly) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x,
              yi = poly[i].y,
              xj = poly[j].x,
              yj = poly[j].y;
            if (
              yi > y !== yj > y &&
              x < ((xj - xi) * (y - yi)) / (yj - yi) + xi
            )
              inside = !inside;
          }
          return inside;
        }
        function distToLine(px, py, a, b) {
          const dx = b.x - a.x,
            dy = b.y - a.y;
          const len2 = dx * dx + dy * dy;
          if (len2 === 0) return Math.hypot(px - a.x, py - a.y);
          let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
          t = Math.max(0, Math.min(1, t));
          return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
        }
        function polyArea(pts) {
          let a = 0;
          for (let i = 0; i < pts.length; i++) {
            const j = (i + 1) % pts.length;
            a += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
          }
          return Math.abs(a / 2);
        }

        // Save
        const handleSave = async () => {
          setSaving(true);
          try {
            await platform.saveEditorData(floor.id, {
              data: { points, lines, rooms: editorRooms },
              default_grid_size_m: gridSize,
            });
            // Sync rooms to database
            const dbRooms = editorRooms.map((r) => {
              const poly = r.pointIds
                .map((pid) => points.find((p) => p.id === pid))
                .filter(Boolean)
                .map((p) => [p.x, p.y]);
              return {
                editor_id: r.id,
                name: r.name,
                polygon: poly,
                access_level_id: r.access_level_id,
                grid_size_override: r.grid_size_override,
              };
            });
            await platform.syncEditorRooms(floor.id, { rooms: dbRooms });
            setDirty(false);
          } catch (e) {
            alert("Save failed: " + e.message);
          } finally {
            setSaving(false);
          }
        };

        // PDF upload
        const handlePdfUpload = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            await platform.uploadEditorPdf(floor.id, file);
            setHasPdf(true);
          } catch (err) {
            alert("PDF upload failed: " + err.message);
          }
          e.target.value = "";
        };

        // Copy floor plan
        const handleCopy = async () => {
          if (!copyFloorId) return;
          try {
            await platform.copyFloorplan(floor.id, copyFloorId);
            // Reload
            const res = await platform.getEditorData(floor.id);
            const d = res.data || {};
            setPoints(d.points || []);
            setLines(d.lines || []);
            setEditorRooms(d.rooms || []);
            setHasPdf(!!res.has_pdf);
            setDirty(false);
          } catch (e) {
            alert("Copy failed: " + e.message);
          }
        };

        // Access level CRUD
        const handleCreateAL = async () => {
          if (!alForm.name.trim() || !building) return;
          try {
            const al = await platform.createAccessLevel(building.id, alForm);
            setAccessLevels((prev) => [...prev, al]);
            setAlForm({ name: "", color: "#6b7280" });
          } catch (e) {
            alert(e.message);
          }
        };
        const handleDeleteAL = async (id) => {
          try {
            await platform.deleteAccessLevel(id);
            setAccessLevels((prev) => prev.filter((a) => a.id !== id));
            setEditorRooms((prev) =>
              prev.map((r) =>
                r.access_level_id === id ? { ...r, access_level_id: null } : r,
              ),
            );
            markDirty();
          } catch (e) {
            alert(e.message);
          }
        };

        // Room colors
        const ROOM_FILLS = [
          "#3b82f620",
          "#10b98120",
          "#f59e0b20",
          "#ef444420",
          "#8b5cf620",
          "#06b6d420",
        ];
        const ROOM_STROKES = [
          "#3b82f6",
          "#10b981",
          "#f59e0b",
          "#ef4444",
          "#8b5cf6",
          "#06b6d4",
        ];

        // Tool buttons
        const TOOLS = [
          { id: "select", label: "Select", icon: "\u25C7" },
          { id: "point", label: "Point", icon: "\u25CF" },
          { id: "line", label: "Line", icon: "\u2571" },
          { id: "room", label: "Room", icon: "\u25A1" },
          { id: "delete", label: "Delete", icon: "\u2715" },
        ];

        const selLine =
          selected?.type === "line"
            ? lines.find((l) => l.id === selected.id)
            : null;
        const selRoom =
          selected?.type === "room"
            ? editorRooms.find((r) => r.id === selected.id)
            : null;
        const selPoint =
          selected?.type === "point"
            ? points.find((p) => p.id === selected.id)
            : null;

        // ── Multi-selection axis detection ─────────────────────────────────
        // Collect all points in the multi-selection set
        const multiSelPts = points.filter((p) => multiSel.has(p.id));
        // Axis tolerance: points are "same axis" if within 5cm of each other
        const AXIS_TOL = 0.05;
        const multiAxisX =
          multiSelPts.length >= 2 &&
          multiSelPts.every((p) => Math.abs(p.x - multiSelPts[0].x) < AXIS_TOL);
        const multiAxisY =
          multiSelPts.length >= 2 &&
          multiSelPts.every((p) => Math.abs(p.y - multiSelPts[0].y) < AXIS_TOL);
        // Shared values (average of the axis values)
        const sharedX = multiSelPts.length
          ? Math.round(
              (multiSelPts.reduce((s, p) => s + p.x, 0) / multiSelPts.length) *
                1000,
            ) / 1000
          : 0;
        const sharedY = multiSelPts.length
          ? Math.round(
              (multiSelPts.reduce((s, p) => s + p.y, 0) / multiSelPts.length) *
                1000,
            ) / 1000
          : 0;
        // Whether we should show the multi-select panel
        const showMultiPanel = multiSel.size >= 2;

        return h(
          "div",
          { className: "fade-in" },
          // Top bar
          h(
            "div",
            { className: "flex items-center justify-between mb-4" },
            h(
              "button",
              {
                onClick: onBack,
                className:
                  "flex items-center gap-1 text-sm text-muted hover:text-accent",
              },
              "\u2190 Back to Floors",
            ),
            h(
              "div",
              { className: "flex items-center gap-3" },
              dirty && h(Badge, { color: "yellow" }, "Unsaved changes"),
              h(
                Button,
                {
                  onClick: handleSave,
                  disabled: saving,
                  variant: "primary",
                  size: "sm",
                },
                saving ? "Saving..." : "Save Floor Plan",
              ),
              h(
                Button,
                { onClick: onNext, variant: "secondary", size: "sm" },
                "Next: Anchors \u2192",
              ),
            ),
          ),
          h(
            "div",
            { className: "flex items-center justify-between mb-2" },
            h(
              "span",
              { className: "text-sm text-muted" },
              `${floor.name} \u2014 ${fw}m \u00D7 ${fh}m`,
            ),
            h(
              "span",
              { className: "text-xs text-muted opacity-60" },
              "Scroll to zoom  ·  Right-click drag to pan",
            ),
          ),

          // Toolbar
          h(
            "div",
            { className: "flex items-center gap-1 mb-3 flex-wrap" },
            TOOLS.map((t) =>
              h(
                "button",
                {
                  key: t.id,
                  onClick: () => {
                    setTool(t.id);
                    setLineStart(null);
                    setRoomPts([]);
                  },
                  className: `px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${
                    tool === t.id
                      ? "bg-accent text-white shadow-sm"
                      : "bg-surface-dim text-ink-secondary hover:bg-panel border border-transparent hover:border-border"
                  }`,
                },
                `${t.icon} ${t.label}`,
              ),
            ),
            h("div", { className: "w-px h-6 bg-border mx-2" }),
            // Zoom controls
            h(
              "button",
              {
                title: "Zoom in (or scroll up)",
                onClick: () => {
                  const cur = vbRef.current;
                  const newW = Math.max(dims.w / 20, cur.w / 1.4);
                  const newH = newW * (cur.h / cur.w);
                  const cx = cur.x + cur.w / 2,
                    cy = cur.y + cur.h / 2;
                  const newVb = {
                    x: cx - newW / 2,
                    y: cy - newH / 2,
                    w: newW,
                    h: newH,
                  };
                  vbRef.current = newVb;
                  setVb(newVb);
                },
                className:
                  "px-2 py-1 rounded text-sm bg-surface-dim hover:bg-panel border border-transparent hover:border-border text-ink-secondary",
              },
              "＋",
            ),
            h(
              "button",
              {
                title: "Zoom out (or scroll down)",
                onClick: () => {
                  const cur = vbRef.current;
                  const newW = Math.min(dims.w * 1.5, cur.w * 1.4);
                  const newH = newW * (cur.h / cur.w);
                  const cx = cur.x + cur.w / 2,
                    cy = cur.y + cur.h / 2;
                  const newVb = {
                    x: cx - newW / 2,
                    y: cy - newH / 2,
                    w: newW,
                    h: newH,
                  };
                  vbRef.current = newVb;
                  setVb(newVb);
                },
                className:
                  "px-2 py-1 rounded text-sm bg-surface-dim hover:bg-panel border border-transparent hover:border-border text-ink-secondary",
              },
              "－",
            ),
            h(
              "button",
              {
                title: "Reset zoom to fit",
                onClick: () => {
                  const freshVb = { x: 0, y: 0, w: dims.w, h: dims.h };
                  vbRef.current = freshVb;
                  setVb(freshVb);
                },
                className:
                  "px-2 py-1 rounded text-sm bg-surface-dim hover:bg-panel border border-transparent hover:border-border text-ink-secondary",
              },
              "⊡ Fit",
            ),
            h("div", { className: "w-px h-6 bg-border mx-2" }),
            h(
              "label",
              {
                className:
                  "flex items-center gap-1.5 text-sm text-ink-secondary cursor-pointer",
              },
              h("input", {
                type: "checkbox",
                checked: showEditorGrid,
                onChange: (e) => setShowEditorGrid(e.target.checked),
                className: "rounded",
              }),
              "Grid",
            ),
            h(
              "label",
              {
                className:
                  "flex items-center gap-1.5 text-sm text-ink-secondary cursor-pointer ml-2",
              },
              h("input", {
                type: "checkbox",
                checked: snapGrid,
                onChange: (e) => setSnapGrid(e.target.checked),
                className: "rounded",
              }),
              "Snap",
            ),
            h(
              "label",
              {
                className:
                  "flex items-center gap-1.5 text-sm text-ink-secondary cursor-pointer ml-2",
              },
              h("input", {
                type: "checkbox",
                checked: showGrid,
                onChange: (e) => setShowGrid(e.target.checked),
                className: "rounded",
              }),
              "Fingerprint Grid",
            ),
            // Status hints
            tool === "line" &&
              lineStart &&
              h(Badge, { color: "blue" }, "Click second point"),
            tool === "room" &&
              roomPts.length > 0 &&
              h(
                Badge,
                { color: "purple" },
                `${roomPts.length} pts \u2014 click first to close`,
              ),
          ),

          // Main layout: canvas + side panel
          h(
            "div",
            { className: "flex gap-4" },
            // Canvas
            h(
              "div",
              { className: "flex-1 min-w-0", style: { position: "relative" } },
              // Coordinate HUD — bottom-left corner of the canvas
              cursorPos &&
                h(
                  "div",
                  {
                    style: {
                      position: "absolute",
                      bottom: 8,
                      left: 8,
                      zIndex: 10,
                      background: "rgba(0,0,0,0.65)",
                      color: "#e2e8f0",
                      fontSize: 11,
                      fontFamily: "monospace",
                      padding: "3px 8px",
                      borderRadius: 4,
                      pointerEvents: "none",
                      userSelect: "none",
                    },
                  },
                  `x: ${cursorPos.x.toFixed(2)} m  y: ${cursorPos.y.toFixed(2)} m`,
                ),
              h(
                "svg",
                {
                  ref: svgRef,
                  viewBox: `${vb.x} ${vb.y} ${vb.w} ${vb.h}`,
                  className: "w-full bg-panel rounded-lg border border-border",
                  style: {
                    height: dims.h,
                    cursor: panDrag ? "grabbing" : "crosshair",
                    userSelect: "none",
                  },
                  onClick: handleSvgClick,
                  onMouseDown: handleSvgMouseDown,
                  onMouseMove: handleSvgMouseMove,
                  onMouseUp: handleSvgMouseUp,
                  onMouseLeave: (e) => {
                    handleSvgMouseUp(e);
                    setCursorPos(null);
                  },
                  onContextMenu: handleContextMenu,
                },
                // Background grid (snap grid lines)
                ...(showEditorGrid
                  ? Array.from(
                      { length: Math.ceil(fw / gridSize) + 1 },
                      (_, i) =>
                        h("line", {
                          key: `gx${i}`,
                          x1: tx(i * gridSize),
                          y1: ty(0),
                          x2: tx(i * gridSize),
                          y2: ty(fh),
                          stroke: "#e5e7eb",
                          strokeWidth: 0.5,
                        }),
                    )
                  : []),
                ...(showEditorGrid
                  ? Array.from(
                      { length: Math.ceil(fh / gridSize) + 1 },
                      (_, i) =>
                        h("line", {
                          key: `gy${i}`,
                          x1: tx(0),
                          y1: ty(i * gridSize),
                          x2: tx(fw),
                          y2: ty(i * gridSize),
                          stroke: "#e5e7eb",
                          strokeWidth: 0.5,
                        }),
                    )
                  : []),
                // PDF background
                pdfDataUrl &&
                  h("image", {
                    href: pdfDataUrl,
                    x: tx(pdfOffsetX),
                    y: ty(pdfOffsetY),
                    width: fw * sc * pdfScale,
                    height: fh * sc * pdfScale,
                    preserveAspectRatio: "none",
                    opacity: pdfOpacity,
                  }),
                // DXF imported rooms (filled polygons — rendered before walls so walls overlay)
                ...dxfRooms.map((rm, ri) => {
                  if (!rm.polygon || rm.polygon.length < 3) return null;
                  const pts = rm.polygon
                    .map((p) => `${tx(p[0])},${ty(p[1])}`)
                    .join(" ");
                  const cx =
                    rm.polygon.reduce((s, p) => s + p[0], 0) /
                    rm.polygon.length;
                  const cy =
                    rm.polygon.reduce((s, p) => s + p[1], 0) /
                    rm.polygon.length;
                  return h(
                    "g",
                    { key: `dr${ri}` },
                    h("polygon", {
                      points: pts,
                      fill: "#3b82f610",
                      stroke: "#3b82f650",
                      strokeWidth: 1,
                      strokeDasharray: "4,3",
                    }),
                    h(
                      "text",
                      {
                        x: tx(cx),
                        y: ty(cy),
                        textAnchor: "middle",
                        dominantBaseline: "central",
                        className: "text-[10px]",
                        fill: "#3b82f6",
                        opacity: 0.7,
                      },
                      rm.name,
                    ),
                  );
                }),
                // DXF wall segments (imported from .dxf file)
                ...dxfWalls.map((w, wi) =>
                  h("line", {
                    key: `dw${wi}`,
                    x1: tx(w.x1),
                    y1: ty(w.y1),
                    x2: tx(w.x2),
                    y2: ty(w.y2),
                    stroke: "#9ca3af",
                    strokeWidth: 1.2,
                    strokeLinecap: "round",
                  }),
                ),
                // Floor boundary
                h("rect", {
                  x: tx(0),
                  y: ty(0),
                  width: fw * sc,
                  height: fh * sc,
                  fill: "none",
                  stroke: "#374151",
                  strokeWidth: 2,
                  strokeDasharray: "6,3",
                }),
                // Axis labels
                h(
                  "text",
                  {
                    x: tx(fw / 2),
                    y: dims.h - 6,
                    textAnchor: "middle",
                    className: "text-[10px] fill-gray-400",
                  },
                  `${fw}m`,
                ),
                h(
                  "text",
                  {
                    x: 10,
                    y: ty(fh / 2),
                    textAnchor: "middle",
                    className: "text-[10px] fill-gray-400",
                    transform: `rotate(-90, 10, ${ty(fh / 2)})`,
                  },
                  `${fh}m`,
                ),
                // Rooms (filled polygons)
                ...editorRooms.map((rm, ri) => {
                  const poly = rm.pointIds
                    .map((pid) => points.find((p) => p.id === pid))
                    .filter(Boolean);
                  if (poly.length < 3) return null;
                  const pts = poly
                    .map((p) => `${tx(p.x)},${ty(p.y)}`)
                    .join(" ");
                  const cx = poly.reduce((s, p) => s + p.x, 0) / poly.length;
                  const cy = poly.reduce((s, p) => s + p.y, 0) / poly.length;
                  const isSel =
                    selected?.type === "room" && selected.id === rm.id;
                  const alColor = rm.access_level_id
                    ? accessLevels.find((a) => a.id === rm.access_level_id)
                        ?.color
                    : null;
                  return h(
                    "g",
                    { key: rm.id },
                    h("polygon", {
                      points: pts,
                      fill: alColor
                        ? alColor + "30"
                        : ROOM_FILLS[ri % ROOM_FILLS.length],
                      stroke: isSel
                        ? "#ae5630"
                        : alColor || ROOM_STROKES[ri % ROOM_STROKES.length],
                      strokeWidth: isSel ? 2.5 : 1.5,
                    }),
                    h(
                      "text",
                      {
                        x: tx(cx),
                        y: ty(cy),
                        textAnchor: "middle",
                        dominantBaseline: "central",
                        className: "text-[11px] font-medium",
                        fill: alColor || ROOM_STROKES[ri % ROOM_STROKES.length],
                      },
                      rm.name,
                    ),
                  );
                }),
                // Fingerprint grid overlay
                showGrid &&
                  editorRooms.map((rm, ri) => {
                    const poly = rm.pointIds
                      .map((pid) => points.find((p) => p.id === pid))
                      .filter(Boolean);
                    if (poly.length < 3) return null;
                    const gs = rm.grid_size_override || gridSize;
                    const xs = poly.map((p) => p.x),
                      ys = poly.map((p) => p.y);
                    const minX = Math.floor(Math.min(...xs) / gs) * gs;
                    const maxX = Math.ceil(Math.max(...xs) / gs) * gs;
                    const minY = Math.floor(Math.min(...ys) / gs) * gs;
                    const maxY = Math.ceil(Math.max(...ys) / gs) * gs;
                    const cells = [];
                    for (let gx = minX; gx < maxX; gx += gs) {
                      for (let gy = minY; gy < maxY; gy += gs) {
                        const cx = gx + gs / 2,
                          cy = gy + gs / 2;
                        if (pointInPoly(cx, cy, poly)) {
                          cells.push(
                            h("rect", {
                              key: `gc-${rm.id}-${gx}-${gy}`,
                              x: tx(gx),
                              y: ty(gy),
                              width: gs * sc,
                              height: gs * sc,
                              fill: "none",
                              stroke: "#8b5cf680",
                              strokeWidth: 0.7,
                              strokeDasharray: "2,2",
                            }),
                          );
                          cells.push(
                            h("circle", {
                              key: `gd-${rm.id}-${gx}-${gy}`,
                              cx: tx(cx),
                              cy: ty(cy),
                              r: 2,
                              fill: "#8b5cf660",
                            }),
                          );
                        }
                      }
                    }
                    return h("g", { key: `grid-${rm.id}` }, ...cells);
                  }),
                // Room-in-progress outline
                roomPts.length > 1 &&
                  (() => {
                    const poly = roomPts
                      .map((pid) => points.find((p) => p.id === pid))
                      .filter(Boolean);
                    const pts = poly
                      .map((p) => `${tx(p.x)},${ty(p.y)}`)
                      .join(" ");
                    return h("polyline", {
                      points: pts,
                      fill: "none",
                      stroke: "#8b5cf6",
                      strokeWidth: 2,
                      strokeDasharray: "4,3",
                    });
                  })(),
                // Lines
                ...lines.map((ln) => {
                  const pA = points.find((p) => p.id === ln.from);
                  const pB = points.find((p) => p.id === ln.to);
                  if (!pA || !pB) return null;
                  const isSel =
                    selected?.type === "line" && selected.id === ln.id;
                  const mx = (pA.x + pB.x) / 2,
                    my = (pA.y + pB.y) / 2;
                  return h(
                    "g",
                    { key: ln.id },
                    h("line", {
                      x1: tx(pA.x),
                      y1: ty(pA.y),
                      x2: tx(pB.x),
                      y2: ty(pB.y),
                      stroke: isSel ? "#ae5630" : "#6b7280",
                      strokeWidth: isSel ? 2.5 : 1.5,
                    }),
                    ln.length_m > 0 &&
                      h(
                        "text",
                        {
                          x: tx(mx),
                          y: ty(my) - 6,
                          textAnchor: "middle",
                          className: "text-[9px] font-mono",
                          fill: "#374151",
                        },
                        `${ln.length_m}m`,
                      ),
                  );
                }),
                // Line-in-progress
                lineStart &&
                  (() => {
                    const p = points.find((pt) => pt.id === lineStart);
                    return p
                      ? h("circle", {
                          cx: tx(p.x),
                          cy: ty(p.y),
                          r: 8,
                          fill: "none",
                          stroke: "#ae5630",
                          strokeWidth: 2,
                          strokeDasharray: "3,2",
                        })
                      : null;
                  })(),
                // Points
                ...points.map((p) => {
                  const isSel =
                    selected?.type === "point" && selected.id === p.id;
                  const isMultiSel = multiSel.has(p.id);
                  const isRoomPt = roomPts.includes(p.id);
                  return h(
                    "g",
                    { key: p.id },
                    // Multi-select ring (outer)
                    isMultiSel &&
                      h("circle", {
                        cx: tx(p.x),
                        cy: ty(p.y),
                        r: 11,
                        fill: "none",
                        stroke: "#3b82f6",
                        strokeWidth: 2,
                        strokeDasharray: "3,2",
                        opacity: 0.8,
                      }),
                    h("circle", {
                      cx: tx(p.x),
                      cy: ty(p.y),
                      r: isSel ? 7 : 5,
                      fill: isMultiSel
                        ? "#2563eb"
                        : isRoomPt
                          ? "#8b5cf6"
                          : isSel
                            ? "#ae5630"
                            : "#374151",
                      stroke: "#fff",
                      strokeWidth: 2,
                    }),
                    isSel &&
                      h(
                        "text",
                        {
                          x: tx(p.x),
                          y: ty(p.y) - 10,
                          textAnchor: "middle",
                          className: "text-[8px] font-mono",
                          fill: "#6b7280",
                        },
                        `(${p.x}, ${p.y})`,
                      ),
                  );
                }),
              ),
            ),

            // Side panel
            h(
              "div",
              { className: "w-72 flex-shrink-0 space-y-3" },

              // ── Multi-point selection panel ──────────────────────────────
              showMultiPanel &&
                h(
                  Card,
                  { title: `${multiSel.size} Points Selected` },
                  // Summary
                  h(
                    "p",
                    { className: "text-xs text-muted mb-3" },
                    multiAxisX && multiAxisY
                      ? `All share X ≈ ${sharedX} m and Y ≈ ${sharedY} m`
                      : multiAxisX
                        ? `All aligned on X ≈ ${sharedX} m — edit X to move together`
                        : multiAxisY
                          ? `All aligned on Y ≈ ${sharedY} m — edit Y to move together`
                          : "Shift+click to select more points on the same axis",
                  ),
                  // X-axis edit (shown when all share same X, or always for convenience)
                  h(
                    "div",
                    { className: "space-y-2" },
                    (multiAxisX || multiAxisY || true) &&
                      h(
                        "div",
                        { className: "flex items-end gap-2" },
                        h(
                          "div",
                          { className: "flex-1" },
                          h(Input, {
                            label: `Set X (m)${multiAxisX ? " ← aligned" : ""}`,
                            type: "number",
                            value:
                              multiEditX !== ""
                                ? multiEditX
                                : multiAxisX
                                  ? String(sharedX)
                                  : "",
                            placeholder: multiAxisX
                              ? String(sharedX)
                              : "e.g. 5.2",
                            onChange: (v) => setMultiEditX(v),
                          }),
                        ),
                        h(
                          "button",
                          {
                            className:
                              "mb-0 px-3 py-2 rounded-md text-sm font-medium bg-accent text-white hover:bg-accent/90 disabled:opacity-40",
                            disabled: multiEditX === "",
                            onClick: () => {
                              const newX = parseFloat(multiEditX);
                              if (isNaN(newX)) return;
                              setPoints((prev) =>
                                prev.map((p) =>
                                  multiSel.has(p.id)
                                    ? {
                                        ...p,
                                        x: Math.max(0, Math.min(fw, newX)),
                                      }
                                    : p,
                                ),
                              );
                              setMultiEditX("");
                              markDirty();
                            },
                          },
                          "Apply X",
                        ),
                      ),
                    h(
                      "div",
                      { className: "flex items-end gap-2" },
                      h(
                        "div",
                        { className: "flex-1" },
                        h(Input, {
                          label: `Set Y (m)${multiAxisY ? " ← aligned" : ""}`,
                          type: "number",
                          value:
                            multiEditY !== ""
                              ? multiEditY
                              : multiAxisY
                                ? String(sharedY)
                                : "",
                          placeholder: multiAxisY
                            ? String(sharedY)
                            : "e.g. 3.0",
                          onChange: (v) => setMultiEditY(v),
                        }),
                      ),
                      h(
                        "button",
                        {
                          className:
                            "mb-0 px-3 py-2 rounded-md text-sm font-medium bg-accent text-white hover:bg-accent/90 disabled:opacity-40",
                          disabled: multiEditY === "",
                          onClick: () => {
                            const newY = parseFloat(multiEditY);
                            if (isNaN(newY)) return;
                            setPoints((prev) =>
                              prev.map((p) =>
                                multiSel.has(p.id)
                                  ? { ...p, y: Math.max(0, Math.min(fh, newY)) }
                                  : p,
                              ),
                            );
                            setMultiEditY("");
                            markDirty();
                          },
                        },
