                  {
                    className:
                      "flex items-center justify-between px-5 py-4 border-b border-border",
                  },
                  h(
                    "div",
                    null,
                    h(
                      "h2",
                      { className: "font-semibold text-ink text-sm" },
                      `RSSI Vectors — ${viewingRoom}`,
                    ),
                    !vectorsLoading &&
                      roomVectors &&
                      !roomVectors.error &&
                      h(
                        "p",
                        { className: "text-xs text-muted mt-0.5" },
                        `${roomVectors.count} sample${roomVectors.count !== 1 ? "s" : ""}`,
                        roomVectors.averages &&
                          Object.keys(roomVectors.averages).length > 0 &&
                          ` · averages: ${Object.entries(roomVectors.averages)
                            .sort(([a], [b]) => a.localeCompare(b))
                            .map(([ap, v]) => `${ap}: ${v > 0 ? "+" : ""}${v}`)
                            .join(", ")}`,
                      ),
                  ),
                  h(
                    "button",
                    {
                      onClick: () => setViewingRoom(null),
                      className:
                        "text-muted hover:text-ink text-xl leading-none px-2",
                    },
                    "✕",
                  ),
                ),
                // Body
                h(
                  "div",
                  { className: "overflow-y-auto flex-1 p-4" },
                  vectorsLoading &&
                    h(
                      "div",
                      {
                        className:
                          "flex items-center justify-center py-12 text-muted text-sm",
                      },
                      "Loading vectors…",
                    ),
                  roomVectors?.error &&
                    h(
                      "p",
                      { className: "text-red-400 text-sm p-2" },
                      roomVectors.error,
                    ),
                  !vectorsLoading &&
                    roomVectors &&
                    !roomVectors.error &&
                    h(

                      { className: "space-y-1.5" },
                      (roomVectors.vectors || []).map((vec, i) => {

                        return h(

                          },
                          h(
                            "span",
                            { className: "text-muted w-6 shrink-0 text-right" },
                            `#${i + 1}`,
                          ),
                          h(
                            "div",
                            { className: "flex flex-wrap gap-x-4 gap-y-0.5" },
                            apKeys.map((ap) =>
                              h(
                                "span",
                                { key: ap },
                                h("span", { className: "text-sky-400" }, ap),
                                h(
                                  "span",
                                  { className: "text-ink ml-1" },
                                  `${vec[ap] > 0 ? "+" : ""}${vec[ap].toFixed(0)}`,
                                ),
                              ),
                            ),
                          ),
                        );
                      }),
                    ),
                ),
              ),
            ),

          // ── Survey Activity Log ───────────────────────────────────────────
          h(
            "div",
            { className: "bg-panel border border-border rounded-xl p-4" },
            h(
              "div",
              { className: "flex items-center justify-between mb-3" },
              h(
                "h3",
                { className: "font-semibold text-ink text-sm" },
                "Survey Activity",
              ),
              isRunning &&
                h(
                  "span",
                  {
                    className:
                      "inline-flex items-center gap-1.5 text-xs text-sky-400 font-medium",
                  },
                  h("span", {
                    className:
                      "w-1.5 h-1.5 rounded-full bg-sky-500 pulse-dot inline-block",
                  }),
                  "Live",
                ),
            ),
            !surveyLogs || surveyLogs.length === 0
              ? h(
                  "p",
                  { className: "text-xs text-muted italic" },
                  "No survey events recorded yet. Start a survey to see activity here.",
                )
              : h(
                  "div",
                  {
                    className:
                      "max-h-48 overflow-y-auto space-y-0 font-mono text-xs",
                  },
                  surveyLogs.map((entry) => {
                    const levelColor =
                      entry.level === "alert"
                        ? "text-orange-400"
                        : entry.level === "warn"
                          ? "text-amber-400"
                          : "text-emerald-400";
                    const ts = new Date(entry.timestamp);
                    const timeStr = ts.toLocaleTimeString([], {
                      hour: "2-digit",
                      minute: "2-digit",
                      second: "2-digit",
                    });
                    return h(
                      "div",
                      {
                        key: entry.id,
                        className:
                          "flex gap-2 items-start py-1 border-b border-border/50 last:border-0",
                      },
                      h(

                        { className: "text-muted shrink-0 tabular-nums" },

                      h(
                        "span",

                          className: `${levelColor} shrink-0 uppercase font-semibold`,

                      h("span", { className: "text-ink" }, entry.message),

          ),

          // ── How-to guide ──────────────────────────────────────────────────
          h(
            "div",
            {
              className:
                "bg-panel border border-border rounded-xl p-5 text-sm text-ink-secondary",

            h(
              "h3",
              { className: "font-semibold text-ink mb-2 text-sm" },
              "How to Survey a Floor",
            ),
            h(
              "ol",
              { className: "space-y-1.5 list-decimal list-inside text-xs" },
              h(
                "li",
                null,
                "Go to Localization and stop the engine (if running).",
              ),
              h(
                "li",
                null,
                "Stand still at the centre of the room you want to calibrate.",
              ),
              h(
                "li",
                null,
                "Enter the exact room name (must match your floor plan room IDs).",
              ),
              h(
                "li",
                null,
                "Enter the target SSID or leave blank to use the configured default.",
              ),
              h(
                "li",
                null,
                "Click Start Survey — wait for all samples to be collected.",
              ),
              h(
                "li",
                null,
                "Move to the next room and repeat. Aim for ≥10 samples per room.",
              ),
              h(
                "li",
                null,
                "Once all rooms are surveyed, restart localization — fingerprinting will activate automatically.",
              ),
            ),
          ),
        );
      }

      function LocalizationPage() {
        const [pollInterval, setPollInterval] = useState(1.5);
        const [testingMode, setTestingMode] = useState(false);
        const [selectedMethods, setSelectedMethods] = useState([
          "trilateration",
        ]);
        const [starting, setStarting] = useState(false);
        const [stopping, setStopping] = useState(false);
        const [msg, setMsg] = useState(null);
        const [selectedCampusId, setSelectedCampusId] = useState(null);
        const [expandedMethod, setExpandedMethod] = useState(null);
        const [logLevelFilter, setLogLevelFilter] = useState("");

        const { data: campuses } = useApi(() => platform.listCampuses());
        useEffect(() => {
          if (campuses?.length && !selectedCampusId)
            setSelectedCampusId(campuses[0].id);
        }, [campuses]);

        const { data: engStatus } = usePolling(
          () => platform.engineStatus().catch(() => null),
          3000,
        );
        const { data: engHealth } = usePolling(
          () => engine.health().catch(() => null),
          3000,
        );
        const { data: logsData } = usePolling(
          () =>
            platform.listEngineLogs({
              limit: 100,
              level: logLevelFilter || undefined,
            }),
          4000,
          [logLevelFilter],
        );

        // Engine is running only if poll is actually active (direct engine check)
        const isRunning = engHealth?.poll_running === true;
        const engineOnline =
          engHealth?.ok === true || engStatus?.local_engine === "online";
        const logs = logsData || [];

        const LEVEL_STYLE = {
          info: "text-emerald-400",
          warn: "text-amber-400",
          alert: "text-orange-400",
          config: "text-sky-400",
          security: "text-red-400",
        };
        const LEVEL_BG = {
          info: "bg-emerald-500/10",
          warn: "bg-amber-500/10",
          alert: "bg-orange-500/10",
          config: "bg-sky-500/10",
          security: "bg-red-500/15",
        };

        const toggleMethod = (m) =>
          setSelectedMethods((prev) =>
            prev.includes(m) ? prev.filter((x) => x !== m) : [...prev, m],
          );

        const handleStart = async () => {
          if (!selectedCampusId) {
            setMsg({ ok: false, text: "Select a campus first." });
            return;
          }
          setStarting(true);
          setMsg(null);
          try {
            const res = await platform.startEngine({
              campus_id: selectedCampusId,
              poll_interval_s: pollInterval,
              testing_mode: testingMode,
              methods: selectedMethods.join(","),
            });
            if (res?.ok) {
              const localOk =
                res.local_config?.ok !== false && res.local_poll?.ok !== false;
              setMsg({
                ok: true,
                text: localOk
                  ? "Engine started successfully."
                  : `Engine start partial — config: ${res.local_config?.error || "ok"}, poll: ${res.local_poll?.error || "ok"}`,
              });
            } else {
              const details = [];
              if (res?.local_config?.error)
                details.push(`Config: ${res.local_config.error}`);
              if (res?.local_poll?.error)
                details.push(`Poll: ${res.local_poll.error}`);
              if (res?.error) details.push(`Docker: ${res.error}`);
              setMsg({
                ok: false,
                text: details.length
                  ? details.join(" | ")
                  : "Engine start failed — check logs for details.",
              });
            }
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setStarting(false);
          }
        };

        const handleStop = async () => {
          setStopping(true);
          setMsg(null);
          try {
            await platform.stopEngine();
            setMsg({ ok: true, text: "Engine stopped." });
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setStopping(false);
          }
        };

        return h(
          "div",
          { className: "fade-in space-y-6" },
          // Header
          h(
            "div",
            null,
            h(
              "h1",
              { className: "text-2xl font-semibold text-ink" },
              "Localization",
            ),
            h(
              "p",
              { className: "text-muted text-sm mt-1" },
              "Configure and monitor the Hybrid localization engine",
            ),
          ),

          // Status bar
          h(
            Card,
            null,
            h(
              "div",
              {
                className: "flex items-center justify-between flex-wrap gap-4",
              },
              h(
                "div",
                { className: "flex items-center gap-4" },
                h(
                  "div",
                  { className: "flex items-center gap-2" },
                  h(StatusDot, {
                    status: engineOnline ? "online" : "offline",
                  }),
                  h(
                    "span",
                    { className: "text-sm font-medium" },
                    engineOnline ? "Engine online" : "Engine offline",
                  ),
                ),
                isRunning &&
                  h(
                    "div",
                    { className: "flex items-center gap-2" },
                    h(StatusDot, { status: "polling" }),
                    h(
                      "span",
                      { className: "text-sm text-muted" },
                      "Polling active",
                    ),
                  ),
                engineOnline &&
                  !isRunning &&
                  h(
                    "div",
                    {
                      className:
                        "flex items-center gap-2 text-xs text-amber-400",
                    },
                    "Engine ready — poll not started",
                  ),
              ),
              h(
                "div",
                { className: "flex gap-2" },
                h(
                  Button,
                  {
                    variant: isRunning ? "ghost" : "primary",
                    size: "sm",
                    disabled: starting || isRunning,
                    onClick: handleStart,
                  },
                  starting ? "Starting…" : "▶ Start",
                ),
                h(
                  Button,
                  {
                    variant: "danger",
                    size: "sm",
                    disabled: stopping || !isRunning,
                    onClick: handleStop,
                  },
                  stopping ? "Stopping…" : "■ Stop",
                ),
              ),
            ),
            msg &&
              h(
                "div",
                {
                  className: `mt-3 text-sm px-3 py-2 rounded ${msg.ok ? "bg-emerald-500/15 text-emerald-400" : "bg-red-500/15 text-red-400"}`,
                },
                msg.text,
              ),
          ),

          // Settings + method selection
          h(
            "div",
            { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
            // Settings panel
            h(
              Card,
              { title: "Engine Settings" },
              h(
                "div",
                { className: "space-y-4" },
                h(
                  "div",
                  null,
                  h(
                    "label",
                    { className: "block text-xs font-medium text-muted mb-1" },
                    "Campus",
                  ),
                  h(
                    "select",
                    {
                      value: selectedCampusId || "",
                      onChange: (e) => setSelectedCampusId(+e.target.value),
                      className:
                        "w-full border border-border rounded px-2 py-1.5 text-sm bg-surface",
                    },
                    (campuses || []).map((c) =>
                      h("option", { key: c.id, value: c.id }, c.name),
                    ),
                  ),
                ),
                h(
                  "div",
                  null,
                  h(
                    "label",
                    { className: "block text-xs font-medium text-muted mb-1" },
                    `Poll Interval: ${pollInterval}s`,
                  ),
                  h("input", {
                    type: "range",
                    min: 0.5,
                    max: 5,
                    step: 0.5,
                    value: pollInterval,
                    onChange: (e) => setPollInterval(+e.target.value),
                    className: "w-full accent-accent",
                  }),
                  h(
                    "div",
                    {
                      className: "flex justify-between text-xs text-muted mt-1",
                    },
                    h("span", null, "0.5s (fast)"),
                    h("span", null, "5s (slow)"),
                  ),
                ),
                h(
                  "div",
                  { className: "flex items-start gap-3" },
                  h("input", {
                    type: "checkbox",
                    id: "testingMode",
                    checked: testingMode,
                    onChange: (e) => setTestingMode(e.target.checked),
                    className: "mt-0.5",
                  }),
                  h(
                    "label",
                    { htmlFor: "testingMode", className: "cursor-pointer" },
                    h(
                      "div",
                      { className: "text-sm font-medium" },
                      "Testing Mode",
                    ),
                    h(
                      "div",
                      { className: "text-xs text-muted" },
                      "Accept scans with only 1 AP visible (useful when not all APs are deployed)",
                    ),
                  ),
                ),
              ),
            ),

            // Method selection
            h(
              Card,
              { title: "Localization Methods" },
              h(
                "div",
                { className: "space-y-3" },
                Object.entries(METHOD_INFO).map(([key, info]) =>
                  h(
                    "div",
                    {
                      key,
                      className: `flex items-start gap-3 p-3 rounded-lg border transition-colors cursor-pointer ${
                        selectedMethods.includes(key)
                          ? "border-accent bg-accent/5"
                          : "border-border hover:border-border/80"
                      }`,
                      onClick: () => toggleMethod(key),
                    },
                    h("input", {
                      type: "checkbox",
                      checked: selectedMethods.includes(key),
                      onChange: () => toggleMethod(key),
                      className: "mt-0.5",
                    }),
                    h(
                      "div",
                      null,
                      h(
                        "div",
                        { className: "flex items-center gap-2 mb-0.5" },
                        h(
                          "span",
                          { className: "text-sm font-medium" },
                          info.label,
                        ),
                        h(Badge, { color: info.color }, key),
                      ),
                      h("div", { className: "text-xs text-muted" }, info.desc),
                    ),
                  ),
                ),
              ),
            ),
          ),

          // Expanded map overlay
          expandedMethod &&
            h(ExpandedMapOverlay, {
              method: expandedMethod,
              onClose: () => setExpandedMethod(null),
            }),

          // Per-method maps
          h(
            Card,
            { title: "Live Maps" },
            h(
              "div",
              {
                className:
                  "grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4",
              },
              Object.keys(METHOD_INFO).map((m) =>
                h(MethodMapPanel, {
                  key: m,
                  method: m,
                  onExpand: setExpandedMethod,
                }),
              ),
            ),
          ),

          // Live engine log stream
          h(
            Card,
            {
              title: "Engine Log Stream",
              actions: h(
                "div",
                { className: "flex gap-2 items-center" },
                h(
                  "select",
                  {
                    value: logLevelFilter,
                    onChange: (e) => setLogLevelFilter(e.target.value),
                    className:
                      "text-xs border border-border rounded px-2 py-1 bg-surface",
                  },
                  h("option", { value: "" }, "All levels"),
                  ["info", "warn", "alert", "config", "security"].map((l) =>
                    h("option", { key: l, value: l }, l.toUpperCase()),
                  ),
                ),
                h(
                  Button,
                  {
                    variant: "ghost",
                    size: "sm",
                    onClick: () => platform.clearEngineLogs().catch(() => {}),
                  },
                  "Clear All",
                ),
              ),
            },
            logs.length === 0
              ? h(EmptyState, {
                  icon: "📋",
                  title: "No engine log entries",
                  description:
                    "Logs are generated by the connectivity poller and scope checker as the engine runs",
                })
              : h(
                  "div",
                  { className: "max-h-96 overflow-y-auto" },
                  h(
                    "div",
                    { className: "space-y-0.5 font-mono text-xs" },
                    logs.map((l) =>
                      l.source === "system"
                        ? h(
                            "div",
                            {
                              key: l.id,
                              className:
                                "flex items-center gap-2 py-2 px-3 select-none",
                            },
                            h("div", {
                              className:
                                "flex-1 border-t border-dashed border-gray-300",
                            }),
                            h(
                              "span",
                              {
                                className:
                                  "text-[11px] text-muted whitespace-nowrap font-sans px-2",
                              },
                              new Date(l.timestamp).toLocaleTimeString() +
                                " \u00B7 " +
                                l.message,
                            ),
                            h("div", {
                              className:
                                "flex-1 border-t border-dashed border-gray-300",
                            }),
                          )
                        : h(
                            "div",
                            {
                              key: l.id,
                              className: `flex gap-3 px-3 py-1.5 rounded items-start ${LEVEL_BG[l.level] || "hover:bg-surface-dim"}`,
                            },
                            h(
                              "span",
                              {
                                className:
                                  "text-muted whitespace-nowrap shrink-0",
                              },
                              new Date(l.timestamp).toLocaleTimeString(),
                            ),
                            h(
                              "span",
                              {
                                className: `w-14 shrink-0 font-bold ${LEVEL_STYLE[l.level] || "text-muted"}`,
                              },
                              (l.level || "info").toUpperCase(),
                            ),
                            h(
                              "span",
                              {
                                className:
                                  "text-ink-secondary shrink-0 w-20 truncate",
                              },
                              l.source || "",
                            ),
                            l.tag_id &&
                              h(
                                "span",
                                {
                                  className:
                                    "text-indigo-700 shrink-0 font-medium",
                                },
                                l.tag_id,
                              ),
                            h(
                              "span",
                              { className: "text-ink flex-1 break-all" },
                              l.message,
                            ),
                            !l.acknowledged &&
                              h(
                                "button",
                                {
                                  className:
                                    "shrink-0 text-muted hover:text-ink text-xs border border-border rounded px-1.5 py-0.5",
                                  onClick: () =>
                                    platform
                                      .ackEngineLog(l.id, "admin")
                                      .catch(() => {}),
                                },
                                "ack",
                              ),
                          ),
                    ),
                  ),
                ),
          ),
        );
      }

      // ═════════════════════════════════════════════════════════════════════
      // PAGE: LOGS
      // ═════════════════════════════════════════════════════════════════════

      const LOG_LEVEL_TABS = [
        { id: "all", label: "All", color: "bg-muted" },
        { id: "info", label: "Info", color: "bg-emerald-500" },
        { id: "warn", label: "Warn", color: "bg-amber-500" },
        { id: "alert", label: "Alert", color: "bg-orange-500" },
        { id: "config", label: "Config", color: "bg-sky-500" },
        { id: "security", label: "Security", color: "bg-red-500" },
        {
          id: "system",
          label: "System",
          color: "bg-violet-500",
          isSource: true,
        },
      ];

      function LogsPage() {
        const [tab, setTab] = useState("all");
        const activeTab = LOG_LEVEL_TABS.find((t) => t.id === tab) || {};
        const {
          data: logsData,
          loading,
          error,
          reload,
        } = usePolling(
          () =>
            platform.listEngineLogs({
              limit: 200,
              level: activeTab.isSource
                ? undefined
                : tab === "all"
                  ? undefined
                  : tab,
              source: activeTab.isSource ? "system" : undefined,
            }),
          4000,
          [tab],
        );
        const logs = logsData || [];

        const LEVEL_STYLE = {
          info: "text-emerald-400 font-medium",
          warn: "text-amber-400 font-semibold",
          alert: "text-orange-400 font-semibold",
          config: "text-sky-400 font-semibold",
          security: "text-red-400 font-bold",
        };
        const LEVEL_BG = {
          info: "bg-emerald-500/10 hover:bg-emerald-500/20",
          warn: "bg-amber-500/10 hover:bg-amber-500/20",
          alert: "bg-orange-500/10 hover:bg-orange-500/20",
          config: "bg-sky-500/10 hover:bg-sky-500/20",
          security: "bg-red-500/10 hover:bg-red-500/25",
        };

        return h(
          "div",
          { className: "fade-in" },
          h(
            "div",
            { className: "mb-6" },
            h(
              "h1",
              { className: "text-2xl font-semibold text-ink" },
              "Event Logs",
            ),
            h(
              "p",
              { className: "text-muted text-sm mt-1" },
              "Engine logs from connectivity, scope violations, and localization decisions",
            ),
          ),
          // Level tabs
          h(
            "div",
            { className: "flex gap-1.5 mb-6 flex-wrap" },
            LOG_LEVEL_TABS.map((t) =>
              h(
                "button",

      function EspFlashPage() {
        const PLATFORM_API = window.PLATFORM_API || "http://localhost:8000";

        const [ports, setPorts]             = useState([]);
        const [portsError, setPortsError]   = useState(null);
        const [deviceType, setDeviceType]   = useState("anchor");
        const [deviceNum, setDeviceNum]     = useState(0);
        const [serialPort, setSerialPort]   = useState("");
        const [wifiSsid, setWifiSsid]       = useState("EAP1250");
        const [wifiPass, setWifiPass]       = useState("");
        const [brokerUri, setBrokerUri]     = useState("mqtt://192.168.100.10:1883");
        const [locationId, setLocationId]   = useState("lab_1");
        const [floorId, setFloorId]         = useState("floor_1");
        const [anchorX, setAnchorX]         = useState(0);
        const [anchorY, setAnchorY]         = useState(0);
        const [apChannel, setApChannel]     = useState(6);
        const [tagChannel, setTagChannel]   = useState(1);
        const [logLines, setLogLines]       = useState([]);
        const [running, setRunning]         = useState(false);
        const [result, setResult]           = useState(null);   // "ok" | "error"
        const logRef = useRef(null);

        // Scroll log to bottom whenever it grows
        useEffect(() => {
          if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
        }, [logLines]);

        // Load serial ports on mount
        useEffect(() => {
          fetch(`${PLATFORM_API}/api/v1/esp/ports`)
            .then(r => r.json())
            .then(d => {
              setPorts(d.ports || []);
              if (d.ports && d.ports.length > 0) setSerialPort(d.ports[0].port);
            })
            .catch(e => setPortsError(String(e)));
        }, []);

        function startFlash() {
          setLogLines([]);
          setResult(null);
          setRunning(true);

          const body = {
            device_type:     deviceType,
            device_num:      parseInt(deviceNum),
            serial_port:     serialPort,
            wifi_ssid:       wifiSsid,
            wifi_pass:       wifiPass,
            mqtt_broker_uri: brokerUri,
            location_id:     locationId,
            floor_id:        floorId,
            anchor_x_cm:     parseInt(anchorX),
            anchor_y_cm:     parseInt(anchorY),
            ap_channel:      parseInt(apChannel),
            tag_ap_channel:  parseInt(tagChannel),
          };

          fetch(`${PLATFORM_API}/api/v1/esp/flash`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          })
          .then(r => {
            if (!r.ok) return r.json().then(d => { throw new Error(d.detail || "Flash failed"); });
            // Connect to SSE stream
            const es = new EventSource(`${PLATFORM_API}/api/v1/esp/flash/stream`);
            es.onmessage = (e) => {
              setLogLines(prev => [...prev, e.data]);
            };
            es.addEventListener("close", () => {
              es.close();
              setRunning(false);
            });
            es.onerror = () => {
              es.close();
              setRunning(false);
              setResult("error");
            };
          })
          .catch(e => {
            setLogLines(prev => [...prev, `ERROR: ${e.message}`]);
            setRunning(false);
            setResult("error");
          });
        }

        function cancelFlash() {
          fetch(`${PLATFORM_API}/api/v1/esp/flash/cancel`, { method: "POST" });
          setRunning(false);
          setResult("error");
        }

        const inputCls = "w-full border border-border rounded px-2 py-1.5 text-sm bg-surface text-foreground";
        const labelCls = "block text-xs font-medium text-muted mb-1";

        return h("div", { className: "max-w-3xl mx-auto space-y-6 p-4" },

          // Header
          h("div", null,
            h("h1", { className: "text-xl font-bold text-foreground" }, "⚡ ESP32 Flash Tool"),
            h("p", { className: "text-sm text-muted mt-1" },
              "Generate device_config.h, build firmware with idf.py, and flash over USB-serial. ",
              "Ensure the ESP-IDF export script has been sourced (", h("code", { className: "text-xs bg-surface-2 px-1 rounded" }, ". $IDF_PATH/export.sh"), ") before starting."
            )
          ),

          // Network connectivity note
          h("div", { className: "rounded border border-orange-500/30 bg-orange-500/10 p-3 text-sm text-orange-300" },
            h("strong", null, "Server reachability: "),
            "Set MQTT Broker URI to the IP address of this server on the WiFi network the ESP will join. ",
            "The ESP32 STA interface must be able to reach the broker at that address."
          ),

          // Form
          h(Card, { title: "Device Configuration" },
            h("div", { className: "grid grid-cols-2 gap-4" },

              // Device type
              h("div", null,
                h("label", { className: labelCls }, "Device Type"),
                h("select", { value: deviceType, onChange: e => setDeviceType(e.target.value), className: inputCls },
                  h("option", { value: "anchor" }, "Anchor"),
                  h("option", { value: "tag" }, "Tag"),
                )
              ),

              // Device number
              h("div", null,
                h("label", { className: labelCls }, deviceType === "anchor" ? "Anchor ID" : "Tag Number"),
                h("input", { type: "number", min: 0, max: 99, value: deviceNum,
                  onChange: e => setDeviceNum(e.target.value), className: inputCls })
              ),

              // Serial port
              h("div", null,
                h("label", { className: labelCls }, "Serial Port"),
                portsError
                  ? h("input", { type: "text", value: serialPort, onChange: e => setSerialPort(e.target.value),
                      placeholder: "/dev/ttyUSB0 or COM3", className: inputCls })
                  : h("select", { value: serialPort, onChange: e => setSerialPort(e.target.value), className: inputCls },
                      ports.length === 0
                        ? h("option", { value: "" }, "No ports detected")
                        : ports.map(p => h("option", { key: p.port, value: p.port }, `${p.port} — ${p.description}`))
                    )
              ),

              // Refresh ports
              h("div", { className: "flex items-end" },
                h("button", {
                  onClick: () => {
                    fetch(`${PLATFORM_API}/api/v1/esp/ports`)
                      .then(r => r.json())
                      .then(d => { setPorts(d.ports || []); setPortsError(null); })
                      .catch(e => setPortsError(String(e)));
                  },
                  className: "w-full py-1.5 text-sm border border-border rounded hover:bg-surface-2 text-muted"
                }, "↺ Refresh Ports")
              ),

              // WiFi SSID
              h("div", null,
                h("label", { className: labelCls }, "WiFi SSID (STA network)"),
                h("input", { type: "text", value: wifiSsid, onChange: e => setWifiSsid(e.target.value), className: inputCls })
              ),

              // WiFi password
              h("div", null,
                h("label", { className: labelCls }, "WiFi Password (leave blank for open)"),
                h("input", { type: "password", value: wifiPass, onChange: e => setWifiPass(e.target.value),
                  placeholder: "open network", className: inputCls })
              ),

              // MQTT Broker URI — full width
              h("div", { className: "col-span-2" },
                h("label", { className: labelCls }, "MQTT Broker URI (server IP on the WiFi network)"),
                h("input", { type: "text", value: brokerUri, onChange: e => setBrokerUri(e.target.value), className: inputCls })
              ),

              // Location / Floor
              h("div", null,
                h("label", { className: labelCls }, "Location ID"),
                h("input", { type: "text", value: locationId, onChange: e => setLocationId(e.target.value), className: inputCls })
              ),
              h("div", null,
                h("label", { className: labelCls }, "Floor ID"),
                h("input", { type: "text", value: floorId, onChange: e => setFloorId(e.target.value), className: inputCls })
              ),

              // Anchor-specific fields
              deviceType === "anchor" && h(React.Fragment, null,
                h("div", null,
                  h("label", { className: labelCls }, "Anchor X position (cm)"),
                  h("input", { type: "number", value: anchorX, onChange: e => setAnchorX(e.target.value), className: inputCls })
                ),
                h("div", null,
                  h("label", { className: labelCls }, "Anchor Y position (cm)"),
                  h("input", { type: "number", value: anchorY, onChange: e => setAnchorY(e.target.value), className: inputCls })
                ),
                h("div", null,
                  h("label", { className: labelCls }, "AP Channel (all anchors must match)"),
                  h("input", { type: "number", min: 1, max: 13, value: apChannel, onChange: e => setApChannel(e.target.value), className: inputCls })
                ),
              ),

              // Tag-specific fields
              deviceType === "tag" && h("div", null,
                h("label", { className: labelCls }, "Tag AP Channel"),
                h("input", { type: "number", min: 1, max: 13, value: tagChannel, onChange: e => setTagChannel(e.target.value), className: inputCls })
              ),
            ),

            // Actions
            h("div", { className: "flex gap-3 mt-4" },
              h("button", {
                onClick: startFlash,
                disabled: running || !serialPort,
                className: `px-4 py-2 text-sm rounded font-medium ${running || !serialPort
                  ? "bg-surface-2 text-muted cursor-not-allowed"
                  : "bg-accent text-white hover:opacity-90"}`
              }, running ? "⏳ Building & Flashing…" : "⚡ Build + Flash"),

              running && h("button", {
                onClick: cancelFlash,
                className: "px-4 py-2 text-sm rounded border border-red-500/50 text-red-400 hover:bg-red-500/10"
              }, "✕ Cancel"),
            )
          ),

          // Log output
          h(Card, { title: "Build / Flash Log" },
            result === "ok" && h("div", { className: "mb-2 text-sm text-green-400 font-medium" }, "✓ Flash succeeded"),
            result === "error" && h("div", { className: "mb-2 text-sm text-red-400 font-medium" }, "✗ Flash failed — see log above"),
            h("pre", {
              ref: logRef,
              className: "h-80 overflow-y-auto text-xs text-muted font-mono bg-surface-2 rounded p-3 whitespace-pre-wrap"
            },
              logLines.length === 0
                ? "(output will appear here once flashing starts)"
                : logLines.join("\n")
            )
          )
        );
      }

      // ═════════════════════════════════════════════════════════════════════
      // APP ROOT
      // ═════════════════════════════════════════════════════════════════════

      function App() {
        const [page, setPage] = useState("wizard");
        const { data: engineHealth } = usePolling(
          () => engine.health().catch(() => null),
          5000,
        );

        return h(
          Layout,
          { page, setPage, engineHealth },
          page === "wizard"    && h(SetupWizard),
          page === "localize"  && h(LocalizationPage),
          page === "survey"    && h(SurveyPage),
          page === "map"       && h(MapView),
          page === "devices"   && h(DeviceTables),
          page === "logs"      && h(LogsPage),
          page === "espflash"  && h(EspFlashPage),
        );
      }

      // ─── MOUNT ────────────────────────────────────────────────────────────
      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
