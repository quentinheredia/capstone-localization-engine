                      editorRooms.map((rm, i) => {
                        const al = rm.access_level_id
                          ? accessLevels.find(
                              (a) => a.id === rm.access_level_id,
                            )
                          : null;
                        return h(
                          "button",
                          {
                            key: rm.id,
                            onClick: () =>
                              setSelected({ type: "room", id: rm.id }),
                            className: `w-full text-left px-2.5 py-1.5 rounded text-xs transition-colors ${
                              selected?.id === rm.id
                                ? "bg-accent-light border border-accent/30"
                                : "hover:bg-surface-dim border border-transparent"
                            }`,
                          },
                          h(
                            "div",
                            { className: "flex items-center gap-2" },
                            h("span", {
                              className:
                                "w-2.5 h-2.5 rounded-full flex-shrink-0",
                              style: {
                                background:
                                  al?.color ||
                                  ROOM_STROKES[i % ROOM_STROKES.length],
                              },
                            }),
                            h(
                              "span",
                              { className: "font-medium truncate" },
                              rm.name,
                            ),
                            al &&
                              h(
                                "span",
                                {
                                  className: "text-muted ml-auto flex-shrink-0",
                                },
                                al.name,
                              ),
                          ),
                        );
                      }),
                    ),
              ),

              // Access Levels
              h(
                Card,
                { title: "Access Levels" },
                h(
                  "div",
                  { className: "space-y-1.5 mb-3" },
                  accessLevels.map((al) =>
                    h(
                      "div",
                      {
                        key: al.id,
                        className: "flex items-center gap-2 text-xs",
                      },
                      h("span", {
                        className: "w-3 h-3 rounded-full flex-shrink-0",
                        style: { background: al.color },
                      }),
                      h("span", { className: "flex-1 truncate" }, al.name),
                      h(
                        "button",
                        {
                          onClick: () => handleDeleteAL(al.id),
                          className: "text-muted hover:text-danger",
                        },
                        "\u2715",
                      ),
                    ),
                  ),
                ),
                h(
                  "div",
                  { className: "flex gap-1.5" },
                  h("input", {
                    type: "color",
                    value: alForm.color,
                    onChange: (e) =>
                      setAlForm((f) => ({ ...f, color: e.target.value })),
                    className:
                      "w-8 h-8 rounded border border-border cursor-pointer",
                  }),
                  h("input", {
                    type: "text",
                    value: alForm.name,
                    onChange: (e) =>
                      setAlForm((f) => ({ ...f, name: e.target.value })),
                    placeholder: "Level name",
                    className:
                      "flex-1 px-2 py-1 border border-border rounded text-xs bg-panel",
                  }),
                  h(
                    Button,
                    {
                      size: "sm",
                      onClick: handleCreateAL,
                      disabled: !alForm.name.trim(),
                    },
                    "+",
                  ),
                ),
              ),

              // ── DXF / Room Import ─────────────────────────────────────
              h(
                Card,
                { title: "Import Floor Plan" },
                // DXF Walls
                h(
                  "div",
                  { className: "mb-3" },
                  h(
                    "div",
                    {
                      className:
                        "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                    },
                    "DXF Walls",
                  ),
                  h(
                    "div",
                    { className: "flex items-center gap-2" },
                    h("input", {
                      type: "file",
                      accept: ".dxf",
                      id: "dxf-file-input",
                      className: "text-xs flex-1",
                    }),
                    h(
                      Button,
                      {
                        size: "sm",
                        variant: "secondary",
                        disabled: dxfImporting,
                        onClick: async () => {
                          const inp = document.getElementById("dxf-file-input");
                          const f = inp?.files?.[0];
                          if (!f) {
                            setDxfMsg({
                              ok: false,
                              text: "Select a .dxf file first",
                            });
                            return;
                          }
                          setDxfImporting(true);
                          setDxfMsg(null);
                          try {
                            const res = await platform.importDxf(floor.id, f);
                            setDxfWalls([]);
                            // Reload editor data to get updated walls + dimensions
                            const ed = await platform.getEditorData(floor.id);
                            setDxfWalls(ed.data?.dxf_walls || []);
                            setDxfRooms(ed.data?.dxf_rooms || []);
                            setDxfMsg({
                              ok: true,
                              text: `Imported ${res.walls} walls · ${res.width_m}×${res.height_m} m`,
                            });
                          } catch (e) {
                            setDxfMsg({ ok: false, text: e.message });
                          } finally {
                            setDxfImporting(false);
                          }
                        },
                      },
                      dxfImporting ? "…" : "Import",
                    ),
                  ),
                  dxfMsg &&
                    h(
                      "div",
                      {
                        className: `text-xs mt-1 ${dxfMsg.ok ? "text-success" : "text-danger"}`,
                      },
                      dxfMsg.text,
                    ),
                  dxfWalls.length > 0 &&
                    h(
                      "div",
                      { className: "text-xs text-muted mt-0.5" },
                      `${dxfWalls.length} wall segments loaded`,
                    ),
                ),
                // Room JSON
                h(
                  "div",
                  null,
                  h(
                    "div",
                    {
                      className:
                        "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                    },
                    "Rooms (JSON)",
                  ),
                  h(
                    "div",
                    { className: "text-xs text-muted mb-1" },
                    'Paste FLOOR_PLAN_V2 dict: {"RoomName":{"bounds":[x0,y0,x1,y1],...}}',
                  ),
                  h("textarea", {
                    value: roomJsonText,
                    onChange: (e) => setRoomJsonText(e.target.value),
                    rows: 5,
                    placeholder: '{"Lobby":{"bounds":[-9,19,14,40]},...}',
                    className:
                      "w-full px-2 py-1.5 border border-border rounded text-xs bg-panel font-mono resize-y",
                    style: { minHeight: 80 },
                  }),
                  h(
                    "div",
                    { className: "flex gap-1.5 mt-1.5" },
                    h(
                      Button,
                      {
                        size: "sm",
                        variant: "secondary",
                        disabled: roomImporting || !roomJsonText.trim(),
                        onClick: async () => {
                          let rooms;
                          try {
                            rooms = JSON.parse(roomJsonText);
                          } catch (e) {
                            setRoomImportMsg({
                              ok: false,
                              text: "Invalid JSON: " + e.message,
                            });
                            return;
                          }
                          setRoomImporting(true);
                          setRoomImportMsg(null);
                          try {
                            const res = await platform.importRoomsJson(
                              floor.id,
                              { rooms },
                            );
                            // Reload dxf_rooms for editor display
                            const ed = await platform.getEditorData(floor.id);
                            setDxfRooms(ed.data?.dxf_rooms || []);
                            setRoomImportMsg({
                              ok: true,
                              text: `Created ${res.rooms_created} rooms: ${res.rooms.join(", ")}`,
                            });
                          } catch (e) {
                            setRoomImportMsg({ ok: false, text: e.message });
                          } finally {
                            setRoomImporting(false);
                          }
                        },
                      },
                      roomImporting ? "…" : "Import Rooms",
                    ),
                  ),
                  roomImportMsg &&
                    h(
                      "div",
                      {
                        className: `text-xs mt-1 ${roomImportMsg.ok ? "text-success" : "text-danger"}`,
                      },
                      roomImportMsg.text,
                    ),
                ),
              ),

              // Settings
              h(
                Card,
                { title: "Settings" },
                h(Input, {
                  label: "Default Grid Size (m)",
                  type: "number",
                  value: gridSize,
                  onChange: (v) => {
                    const n = parseFloat(v);
                    if (n > 0) setGridSize(n);
                  },
                }),
                h(
                  "div",
                  { className: "mt-3" },
                  h(
                    "div",
                    {
                      className:
                        "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                    },
                    "PDF Background",
                  ),
                  h(
                    "div",
                    { className: "flex items-center gap-2" },
                    h("input", {
                      type: "file",
                      accept: ".pdf",
                      onChange: handlePdfUpload,
                      className: "text-xs w-full",
                    }),
                  ),
                  hasPdf &&
                    h(
                      "div",
                      { className: "mt-2 space-y-2" },
                      // Opacity
                      h(
                        "div",
                        null,
                        h(
                          "label",
                          { className: "text-xs text-muted" },
                          `Opacity: ${Math.round(pdfOpacity * 100)}%`,
                        ),
                        h("input", {
                          type: "range",
                          min: 0,
                          max: 1,
                          step: 0.05,
                          value: pdfOpacity,
                          onChange: (e) =>
                            setPdfOpacity(parseFloat(e.target.value)),
                          className: "w-full",
                        }),
                      ),
                      // Scale
                      h(
                        "div",
                        null,
                        h(
                          "label",
                          { className: "text-xs text-muted" },
                          `Scale: ${pdfScale.toFixed(2)}\u00D7`,
                        ),
                        h("input", {
                          type: "range",
                          min: 0.1,
                          max: 3.0,
                          step: 0.05,
                          value: pdfScale,
                          onChange: (e) =>
                            setPdfScale(parseFloat(e.target.value)),
                          className: "w-full",
                        }),
                      ),
                      // X / Y offset
                      h(
                        "div",
                        { className: "grid grid-cols-2 gap-1" },
                        h(
                          "div",
                          null,
                          h(
                            "div",
                            { className: "text-xs text-muted mb-0.5" },
                            "X Offset (m)",
                          ),
                          h("input", {
                            type: "number",
                            step: 0.5,
                            value: pdfOffsetX,
                            onChange: (e) =>
                              setPdfOffsetX(parseFloat(e.target.value) || 0),
                            className:
                              "w-full px-1.5 py-1 border border-border rounded text-xs bg-panel",
                          }),
                        ),
                        h(
                          "div",
                          null,
                          h(
                            "div",
                            { className: "text-xs text-muted mb-0.5" },
                            "Y Offset (m)",
                          ),
                          h("input", {
                            type: "number",
                            step: 0.5,
                            value: pdfOffsetY,
                            onChange: (e) =>
                              setPdfOffsetY(parseFloat(e.target.value) || 0),
                            className:
                              "w-full px-1.5 py-1 border border-border rounded text-xs bg-panel",
                          }),
                        ),
                      ),
                      // Reset
                      h(
                        "button",
                        {
                          onClick: () => {
                            setPdfScale(1.0);
                            setPdfOffsetX(0);
                            setPdfOffsetY(0);
                          },
                          className:
                            "text-xs text-muted hover:text-accent transition-colors",
                        },
                        "Reset position",
                      ),
                    ),
                ),
                h(
                  "div",
                  { className: "mt-3" },
                  h(
                    "div",
                    {
                      className:
                        "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                    },
                    "Copy from Floor",
                  ),
                  h(
                    "div",
                    { className: "flex gap-1.5" },
                    h(
                      "select",
                      {
                        value: copyFloorId,
                        onChange: (e) => setCopyFloorId(e.target.value),
                        className:
                          "flex-1 px-2 py-1 border border-border rounded text-xs bg-panel",
                      },
                      h("option", { value: "" }, "Select floor..."),
                      allFloors.map((f) =>
                        h("option", { key: f.id, value: f.id }, f.name),
                      ),
                    ),
                    h(
                      Button,
                      {
                        size: "sm",
                        onClick: handleCopy,
                        disabled: !copyFloorId,
                        variant: "secondary",
                      },
                      "Copy",
                    ),
                  ),
                ),
              ),
            ),
          ),
        );
      }

      function WizardAnchors({ floor, onBack }) {
        // Anchors already placed on this floor
        const { data, loading, error, reload } = useApi(
          () => platform.listAnchors(floor.id),
          [floor.id],
        );
        // Full inventory (for "From Inventory" tab)
        const { data: allAnchors, reload: reloadInventory } = useApi(() =>
          platform.listAllAnchors(),
        );

        const [mode, setMode] = useState("create"); // "create" | "assign"

        // ── Create-new form ──────────────────────────────────────────────────
        const [form, setForm] = useState({
          anchor_id: "",
          anchor_type: "engenius_ap",
          ip_address: "",
          mac_address: "",
          x_m: 0,
          y_m: 0,
          username: "admin",
          password: "admin",
        });
        const [creating, setCreating] = useState(false);

        // ── Assign-from-inventory form ───────────────────────────────────────
        const [selectedId, setSelectedId] = useState("");
        const [assignPos, setAssignPos] = useState({ x_m: 0, y_m: 0 });
        const [assigning, setAssigning] = useState(false);

        // Unassigned devices available to pick from
        const inventory = (allAnchors || []).filter((a) => a.floor_id == null);
        const selectedAnchor =
          inventory.find((a) => String(a.id) === selectedId) || null;

        // Reload both lists
        const reloadAll = () => {
          reload();
          reloadInventory();
        };

        const handleDeleteAnchor = async (a) => {
          if (
            !window.confirm(
              `Delete anchor "${a.anchor_id}"? This cannot be undone.`,
            )
          )
            return;
          try {
            await platform.deleteAnchor(a.id);
            reloadAll();
          } catch (e) {
            alert(e.message);
          }
        };

        const handleUnassign = async (a) => {
          if (
            !window.confirm(
              `Remove "${a.anchor_id}" from this floor and return it to inventory?`,
            )
          )
            return;
          try {
            await platform.updateAnchor(a.id, { floor_id: null });
            reloadAll();
          } catch (e) {
            alert(e.message);
          }
        };

        const handleCreate = async () => {
          if (!form.anchor_id.trim()) return;
          setCreating(true);
          try {
            await platform.createAnchor(floor.id, {
              ...form,
              anchor_id: form.anchor_id.trim(),
              x_m: +form.x_m,
              y_m: +form.y_m,
            });
            setForm((f) => ({
              ...f,
              anchor_id: "",
              ip_address: "",
              mac_address: "",
              x_m: 0,
              y_m: 0,
            }));
            reloadAll();
          } catch (e) {
            alert(e.message);
          } finally {
            setCreating(false);
          }
        };

        const handleAssign = async () => {
          if (!selectedId) return;
          setAssigning(true);
          try {
            await platform.updateAnchor(+selectedId, {
              floor_id: floor.id,
              x_m: +assignPos.x_m,
              y_m: +assignPos.y_m,
              device_status: "in_use",
            });
            setSelectedId("");
            setAssignPos({ x_m: 0, y_m: 0 });
            reloadAll();
          } catch (e) {
            alert(e.message);
          } finally {
            setAssigning(false);
          }
        };

        if (loading) return h(LoadingSpinner);
        if (error) return h(ErrorBanner, { message: error, onRetry: reload });

        return h(
          "div",
          { className: "fade-in" },
          h(
            "button",
            {
              onClick: onBack,
              className:
                "flex items-center gap-1 text-sm text-muted hover:text-accent mb-4",
            },
            "\u2190 Back to Floor Plan",
          ),
          h(
            "div",
            { className: "flex items-center justify-between mb-4" },
            h(
              "div",
              { className: "text-sm text-muted" },
              `Floor: ${floor.name}`,
            ),
            h(Badge, { color: "green" }, `${data?.length || 0} anchors placed`),
          ),
          h(
            "div",
            { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },

            // ── Left: Add Anchor panel ─────────────────────────────────────
            h(
              Card,
              { title: "Add Anchor" },
              // Tab toggle
              h(
                "div",
                {
                  className:
                    "flex mb-4 rounded-lg overflow-hidden border border-border text-sm font-medium",
                },
                h(
                  "button",
                  {
                    onClick: () => setMode("create"),
                    className: `flex-1 py-1.5 transition-colors ${mode === "create" ? "bg-accent text-white" : "bg-panel text-muted hover:bg-surface"}`,
                  },
                  "Create New",
                ),
                h(
                  "button",
                  {
                    onClick: () => {
                      setMode("assign");
                      setSelectedId("");
                    },
                    className: `flex-1 py-1.5 transition-colors ${mode === "assign" ? "bg-accent text-white" : "bg-panel text-muted hover:bg-surface"}`,
                  },
                  `From Inventory${inventory.length > 0 ? ` (${inventory.length})` : ""}`,
                ),
              ),

              // ── Create-new form ──────────────────────────────────────────
              mode === "create" &&
                h(
                  "div",
                  { className: "space-y-3" },
                  h(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    h(Input, {
                      label: "Anchor ID",
                      value: form.anchor_id,
                      onChange: (v) => setForm((f) => ({ ...f, anchor_id: v })),
                      placeholder: "e.g. AP1",
                    }),
                    h(Select, {
                      label: "Type",
                      value: form.anchor_type,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, anchor_type: v })),
                      options: [
                        { value: "engenius_ap", label: "EnGenius AP" },
                        { value: "esp32", label: "ESP32" },
                      ],
                    }),
                  ),
                  form.anchor_type === "engenius_ap" &&
                    h(
                      "div",
                      { className: "grid grid-cols-2 gap-3" },
                      h(Input, {
                        label: "IP Address",
                        value: form.ip_address,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, ip_address: v })),
                        placeholder: "192.168.1.xxx",
                      }),
                      h(Input, {
                        label: "MAC Address",
                        value: form.mac_address,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, mac_address: v })),
                        placeholder: "AA:BB:CC:DD:EE:FF",
                      }),
                    ),
                  form.anchor_type === "esp32" &&
                    h(Input, {
                      label: "MAC Address",
                      value: form.mac_address,
                      onChange: (v) =>
                        setForm((f) => ({ ...f, mac_address: v })),
                      placeholder: "AA:BB:CC:DD:EE:FF",
                    }),
                  h(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    h(Input, {
                      label: "X Position (m)",
                      type: "number",
                      value: form.x_m,
                      onChange: (v) => setForm((f) => ({ ...f, x_m: v })),
                    }),
                    h(Input, {
                      label: "Y Position (m)",
                      type: "number",
                      value: form.y_m,
                      onChange: (v) => setForm((f) => ({ ...f, y_m: v })),
                    }),
                  ),
                  form.anchor_type === "engenius_ap" &&
                    h(
                      "div",
                      { className: "grid grid-cols-2 gap-3" },
                      h(Input, {
                        label: "Username",
                        value: form.username,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, username: v })),
                      }),
                      h(Input, {
                        label: "Password",
                        type: "password",
                        value: form.password,
                        onChange: (v) =>
                          setForm((f) => ({ ...f, password: v })),
                      }),
                    ),
                  h(
                    Button,
                    {
                      onClick: handleCreate,
                      disabled: creating || !form.anchor_id.trim(),
                    },
                    "Place Anchor",
                  ),
                ),

              // ── From-inventory form ──────────────────────────────────────
              mode === "assign" &&
                h(
                  "div",
                  { className: "space-y-3" },
                  inventory.length === 0
                    ? h(
                        "div",
                        { className: "text-sm text-muted py-4 text-center" },
                        "No unassigned devices in inventory.",
                        h("br", null),
                        h(
                          "span",
                          { className: "text-xs" },
                          "Register devices in the Devices tab first.",
                        ),
                      )
                    : h(
                        "div",
                        { className: "space-y-3" },
                        h(
                          "div",
                          null,
                          h(
                            "div",
                            {
                              className:
                                "text-xs font-medium text-ink-secondary mb-1.5 uppercase tracking-wide",
                            },
                            "Select Device",
                          ),
                          h(
                            "select",
                            {
                              value: selectedId,
                              onChange: (e) => setSelectedId(e.target.value),
                              className:
                                "w-full px-2 py-1.5 border border-border rounded text-sm bg-panel text-ink",
                            },

      // ═════════════════════════════════════════════════════════════════════
      // PAGE: MAP VIEW
      // ═════════════════════════════════════════════════════════════════════

      function FloorCanvas({
        width,
        height,
        rooms = [],
        anchors = [],
        devices = [],
        showFpGrid = false,
        gridSize = 1.0,
        className = "",
        dxfWalls = [],
        dxfRooms = [],
      }) {
        const PADDING = 40;
        const svgRef = useRef(null);
        const [dims, setDims] = useState({ w: 800, h: 600 });

        useEffect(() => {
          const ro = new ResizeObserver((entries) => {
            for (const e of entries) {
              const w = e.contentRect.width;
              if (w > 0) {
                const aspect = (height || 10) / (width || 10);
                setDims({ w, h: Math.max(300, w * aspect) });
              }
            }
          });
          if (svgRef.current?.parentElement)
            ro.observe(svgRef.current.parentElement);
          return () => ro.disconnect();
        }, [width, height]);

        const fw = width || 10;
        const fh = height || 10;
        const scaleX = (dims.w - PADDING * 2) / fw;
        const scaleY = (dims.h - PADDING * 2) / fh;
        const scale = Math.min(scaleX, scaleY);
        const tx = (v) => PADDING + v * scale;
        const ty = (v) => PADDING + v * scale;

        const ROOM_COLORS = [
          "#3b82f620",
          "#10b98120",
          "#f59e0b20",
          "#ef444420",
          "#8b5cf620",
          "#06b6d420",
        ];
        const ROOM_BORDERS = [
          "#3b82f6",
          "#10b981",
          "#f59e0b",
          "#ef4444",
          "#8b5cf6",
          "#06b6d4",
        ];

        return h(
          "svg",
          {
            ref: svgRef,
            viewBox: `0 0 ${dims.w} ${dims.h}`,
            className: `${className} bg-panel rounded-lg border border-border`,
            style: { maxHeight: 500 },
          },
          // Grid
          ...Array.from({ length: Math.ceil(fw) + 1 }, (_, i) =>
            h("line", {
              key: `gx${i}`,
              x1: tx(i),
              y1: ty(0),
              x2: tx(i),
              y2: ty(fh),
              stroke: "#e5e7eb",
              strokeWidth: 0.5,
            }),
          ),
          ...Array.from({ length: Math.ceil(fh) + 1 }, (_, i) =>
            h("line", {
              key: `gy${i}`,
              x1: tx(0),
              y1: ty(i),
              x2: tx(fw),
              y2: ty(i),
              stroke: "#e5e7eb",
              strokeWidth: 0.5,
            }),
          ),
          // DXF imported room outlines (before walls so walls draw on top)
          ...dxfRooms.map((rm, ri) => {
            if (!rm.polygon || rm.polygon.length < 3) return null;
            const pts = rm.polygon
              .map((p) => `${tx(p[0])},${ty(p[1])}`)
              .join(" ");
            const cx =
              rm.polygon.reduce((s, p) => s + p[0], 0) / rm.polygon.length;
            const cy =
              rm.polygon.reduce((s, p) => s + p[1], 0) / rm.polygon.length;
            return h(
              "g",
              { key: `dr${ri}` },
              h("polygon", {
                points: pts,
                fill: "#3b82f610",
                stroke: "#3b82f650",
                strokeWidth: 1,
                strokeDasharray: "4,3",
              }),
              h(
                "text",
                {
                  x: tx(cx),
                  y: ty(cy),
                  textAnchor: "middle",
                  dominantBaseline: "central",
                  className: "text-[10px]",
                  fill: "#3b82f6",
                  opacity: 0.7,
                },
                rm.name,
              ),
            );
          }),
          // DXF wall segments
          ...dxfWalls.map((w, wi) =>
            h("line", {
              key: `dw${wi}`,
              x1: tx(w.x1),
              y1: ty(w.y1),
              x2: tx(w.x2),
              y2: ty(w.y2),
              stroke: "#6b7280",
              strokeWidth: 1.5,
              strokeLinecap: "round",
            }),
          ),
          // Floor boundary
          h("rect", {
            x: tx(0),
            y: ty(0),
            width: fw * scale,
            height: fh * scale,
            fill: "none",
            stroke: "#374151",
            strokeWidth: 2,
            strokeDasharray: "6,3",
          }),
          // Axis labels
          h(
            "text",
            {
              x: tx(fw / 2),
              y: dims.h - 8,
              textAnchor: "middle",
              className: "text-[10px] fill-gray-400",
            },
            `${fw}m`,
          ),
          h(
            "text",
            {
              x: 10,
              y: ty(fh / 2),
              textAnchor: "middle",
              className: "text-[10px] fill-gray-400",
              transform: `rotate(-90, 10, ${ty(fh / 2)})`,
            },
            `${fh}m`,
          ),
          // Rooms
          ...rooms.map((r, i) => {
            const poly = r.polygon;
            if (!poly || poly.length < 3) return null;
            const points = poly.map((p) => `${tx(p[0])},${ty(p[1])}`).join(" ");
            const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length;
            const cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
            return h(
              "g",
              { key: `room-${i}` },
              h("polygon", {
                points,
                fill: ROOM_COLORS[i % ROOM_COLORS.length],
                stroke: ROOM_BORDERS[i % ROOM_BORDERS.length],
                strokeWidth: 1.5,
              }),
              h(
                "text",
                {
                  x: tx(cx),
                  y: ty(cy),
                  textAnchor: "middle",
                  dominantBaseline: "central",
                  className: "text-[11px] font-medium",
                  fill: ROOM_BORDERS[i % ROOM_BORDERS.length],
                },
                r.name,
              ),
            );
          }),
          // Fingerprint grid overlay (Map View toggle)
          ...(showFpGrid
            ? rooms.map((r, ri) => {
                const poly = r.polygon;
                if (!poly || poly.length < 3) return null;
                const gs = r.grid_size_override || gridSize;
                const xs = poly.map((p) => p[0]),
                  ys = poly.map((p) => p[1]);
                const minX = Math.floor(Math.min(...xs) / gs) * gs;
                const maxX = Math.ceil(Math.max(...xs) / gs) * gs;
                const minY = Math.floor(Math.min(...ys) / gs) * gs;
                const maxY = Math.ceil(Math.max(...ys) / gs) * gs;
                function pipArr(px, py, verts) {
                  let inside = false;
                  for (
                    let i = 0, j = verts.length - 1;
                    i < verts.length;
                    j = i++
                  ) {
                    const xi = verts[i][0],
                      yi = verts[i][1],
                      xj = verts[j][0],
                      yj = verts[j][1];
                    if (
                      yi > py !== yj > py &&
                      px < ((xj - xi) * (py - yi)) / (yj - yi) + xi
                    )
                      inside = !inside;
                  }
                  return inside;
                }
                const cells = [];
                for (let gx = minX; gx < maxX; gx += gs) {
                  for (let gy = minY; gy < maxY; gy += gs) {
                    const cx = gx + gs / 2,
                      cy = gy + gs / 2;
                    if (pipArr(cx, cy, poly)) {
                      cells.push(
                        h("rect", {
                          key: `gc${ri}-${gx}-${gy}`,
                          x: tx(gx),
                          y: ty(gy),
                          width: gs * scale,
                          height: gs * scale,
                          fill: "none",
                          stroke: "#8b5cf680",
                          strokeWidth: 0.7,
                          strokeDasharray: "2,2",
                        }),
                      );
                      cells.push(
                        h("circle", {
                          key: `gd${ri}-${gx}-${gy}`,
                          cx: tx(cx),
                          cy: ty(cy),
                          r: 2,
                          fill: "#8b5cf660",
                        }),
                      );
                    }
                  }
                }
                return h("g", { key: `fpg-${ri}` }, ...cells);
              })
            : []),
          // Anchors
          ...anchors.map((a, i) =>
            h(
              "g",
              { key: `anchor-${i}` },
              h("rect", {
                x: tx(a.x_m) - 8,
                y: ty(a.y_m) - 8,
                width: 16,
                height: 16,
                rx: 3,
                fill: "#1e40af",
                stroke: "#fff",
                strokeWidth: 2,
              }),
              h(
                "text",
                {
                  x: tx(a.x_m),
                  y: ty(a.y_m),
                  textAnchor: "middle",
                  dominantBaseline: "central",
                  className: "text-[8px] font-bold",
                  fill: "#fff",
                },
                (a.anchor_id || "")
                  .replace("AP", "")
                  .replace("ESP_", "E")
                  .slice(0, 2),
              ),
              h(
                "text",
                {
                  x: tx(a.x_m),
                  y: ty(a.y_m) + 18,
                  textAnchor: "middle",
                  className: "text-[9px]",
                  fill: "#6b7280",
                },
                a.anchor_id,
              ),
            ),
          ),
          // Devices
          ...devices.map((d, i) =>
            h(
              "g",
              { key: `dev-${i}` },
              h("circle", {
                cx: tx(d.x || 0),
                cy: ty(d.y || 0),
                r: 10,
                fill: d.reachable ? "#10b981" : "#9ca3af",
                stroke: "#fff",
                strokeWidth: 2.5,
              }),
              h("circle", {
                cx: tx(d.x || 0),
                cy: ty(d.y || 0),
                r: 16,
                fill: "none",
                stroke: d.reachable ? "#10b98140" : "none",
                strokeWidth: 2,
                className: d.reachable ? "pulse-dot" : "",
              }),
              h(
                "text",
                {
                  x: tx(d.x || 0),
                  y: ty(d.y || 0) + 22,
                  textAnchor: "middle",
                  className: "text-[9px] font-medium",
                  fill: "#374151",
                },
                d.device_id,
              ),
            ),
          ),
        );
      }

      function MapView() {
        const { data: mapData, error: mapError } = usePolling(
          () => engine.map(),
          3000,
        );
        const [selectedCampus, setSelectedCampus] = useState(null);
        const [selectedBuilding, setSelectedBuilding] = useState(null);
        const [selectedFloor, setSelectedFloor] = useState(null);
        const [platformRooms, setPlatformRooms] = useState([]);
        const [platformAnchors, setPlatformAnchors] = useState([]);
        const [showFpGrid, setShowFpGrid] = useState(false);
        const [floorGridSize, setFloorGridSize] = useState(1.0);
        const [mapDxfWalls, setMapDxfWalls] = useState([]);
        const [mapDxfRooms, setMapDxfRooms] = useState([]);

        // Load hierarchy from platform
        const { data: campuses } = useApi(() => platform.listCampuses());

        useEffect(() => {
          if (campuses?.length && !selectedCampus)
            setSelectedCampus(campuses[0]);
        }, [campuses]);

        const { data: buildings } = useApi(
          () =>
            selectedCampus
              ? platform.listBuildings(selectedCampus.id)
              : Promise.resolve([]),
          [selectedCampus?.id],
        );
        useEffect(() => {
          if (buildings?.length && !selectedBuilding)
            setSelectedBuilding(buildings[0]);
        }, [buildings]);

        const { data: floors } = useApi(
          () =>
            selectedBuilding
              ? platform.listFloors(selectedBuilding.id)
              : Promise.resolve([]),
          [selectedBuilding?.id],
        );
        useEffect(() => {
          if (floors?.length && !selectedFloor) setSelectedFloor(floors[0]);
        }, [floors]);

        // Load rooms, anchors, and DXF data for selected floor
        useEffect(() => {
          if (!selectedFloor) return;
          platform
            .listRooms(selectedFloor.id)
            .then((r) => setPlatformRooms(r || []))
            .catch(() => {});
          platform
            .listAnchors(selectedFloor.id)
            .then((a) => setPlatformAnchors(a || []))
            .catch(() => {});
          platform
            .getEditorData(selectedFloor.id)
            .then((ed) => {
              setMapDxfWalls(ed.data?.dxf_walls || []);
              setMapDxfRooms(ed.data?.dxf_rooms || []);
            })
            .catch(() => {});
          setFloorGridSize(selectedFloor.default_grid_size_m || 1.0);
        }, [selectedFloor?.id]);

        // Merge: prefer platform data, fallback to engine
        const rooms =
          platformRooms.length > 0 ? platformRooms : mapData?.rooms || [];
        const anchors = platformAnchors;
        const devices = mapData?.devices || [];
        const floorW = selectedFloor?.width_m || mapData?.floor?.width_m || 20;
        const floorH =
          selectedFloor?.height_m || mapData?.floor?.height_m || 15;

        return h(
          "div",
          { className: "fade-in" },
          h(
            "div",
            { className: "flex items-center justify-between mb-6" },
            h(
              "div",
              null,
              h(
                "h1",
                { className: "text-2xl font-semibold text-ink" },
                "Map View",
              ),
              h(
                "p",
                { className: "text-muted text-sm mt-1" },
                "Real-time floor plan with device tracking",
              ),
            ),
            mapError && h(Badge, { color: "red" }, "Engine offline"),
          ),
          // Floor selector
          h(
            "div",
            { className: "flex items-center gap-3 mb-4 flex-wrap" },
            campuses?.length > 1 &&
              h(Select, {
                value: selectedCampus?.id || "",
                onChange: (v) =>
                  setSelectedCampus(campuses.find((c) => c.id == v)),
                options: (campuses || []).map((c) => ({
                  value: c.id,
                  label: c.name,
                })),
                className: "w-48",
              }),
            buildings?.length > 1 &&
              h(Select, {
                value: selectedBuilding?.id || "",
                onChange: (v) =>
                  setSelectedBuilding(buildings.find((b) => b.id == v)),
                options: (buildings || []).map((b) => ({
                  value: b.id,
                  label: b.name,
                })),
                className: "w-48",
              }),
            floors?.length > 0 &&
              h(
                "div",
                { className: "flex gap-1" },
                floors.map((f) =>
                  h(
                    "button",
                    {
                      key: f.id,
                      onClick: () => setSelectedFloor(f),
                      className: `px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                        selectedFloor?.id === f.id
                          ? "bg-accent text-white"
                          : "bg-surface-dim text-ink-secondary hover:text-ink hover:bg-panel border border-transparent hover:border-border"
                      }`,
                    },
                    f.name,
                  ),
                ),
              ),
            // Fingerprint Grid toggle
            h(
              "label",
              {
                className:
                  "flex items-center gap-2 text-sm text-ink-secondary cursor-pointer ml-auto",
              },
              h("input", {
                type: "checkbox",
                checked: showFpGrid,
                onChange: (e) => setShowFpGrid(e.target.checked),
                className: "rounded",
              }),
              "Fingerprint Grid",
            ),
          ),
          // Map canvas
          h(
            Card,
            { className: "mb-6" },
            !rooms.length && !devices.length && !anchors.length
              ? h(EmptyState, {
                  icon: "\uD83D\uDDFA\uFE0F",
                  title: "No floor data yet",
                  description:
                    "Use the Setup Wizard to create rooms and place anchors, or start the engine to see live data",
                })
              : h(FloorCanvas, {
                  width: floorW,
                  height: floorH,
                  rooms,
                  anchors,
                  devices,
                  showFpGrid,
                  gridSize: floorGridSize,
                  dxfWalls: mapDxfWalls,
                  dxfRooms: mapDxfRooms,
                }),
          ),
          // Device summary cards
          devices.length > 0 &&
            h(
              "div",
              {
                className:
                  "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4",
              },
              devices.map((d, i) =>
                h(
                  "div",
                  {
                    key: i,
                    className: "bg-panel rounded-lg border border-border p-4",
                  },
                  h(
                    "div",
                    { className: "flex items-center justify-between mb-2" },
                    h(
                      "span",
                      { className: "font-medium text-sm" },
                      d.device_id,
                    ),
                    h(StatusDot, {
                      status: d.reachable ? "online" : "offline",
                    }),
                  ),
                  h(
                    "div",
                    { className: "text-xs text-muted space-y-1" },
                    d.room_id && h("div", null, `Room: ${d.room_id}`),
                    d.x != null &&
                      d.y != null &&
                      h(
                        "div",
                        { className: "font-mono" },
                        `(${Number(d.x).toFixed(1)}, ${Number(d.y).toFixed(1)})m`,
                      ),
                    d.timestamp &&
                      h(
                        "div",
                        null,
                        new Date(d.timestamp).toLocaleTimeString(),
                      ),
                  ),
                ),
              ),
            ),
        );
      }
