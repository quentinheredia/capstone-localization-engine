      // ═════════════════════════════════════════════════════════════════════
      // PAGE: MAP VIEW
      // ═════════════════════════════════════════════════════════════════════

      function FloorCanvas({
        width,
        height,
        rooms = [],
        anchors = [],
        devices = [],
        showFpGrid = false,
        gridSize = 1.0,
        className = "",
      }) {
        const PADDING = 40;
        const svgRef = useRef(null);
        const [dims, setDims] = useState({ w: 800, h: 600 });

        useEffect(() => {
          const ro = new ResizeObserver((entries) => {
            for (const e of entries) {
              const w = e.contentRect.width;
              if (w > 0) {
                const aspect = (height || 10) / (width || 10);
                setDims({ w, h: Math.max(300, w * aspect) });
              }
            }
          });
          if (svgRef.current?.parentElement)
            ro.observe(svgRef.current.parentElement);
          return () => ro.disconnect();
        }, [width, height]);

        const fw = width || 10;
        const fh = height || 10;
        const scaleX = (dims.w - PADDING * 2) / fw;
        const scaleY = (dims.h - PADDING * 2) / fh;
        const scale = Math.min(scaleX, scaleY);
        const tx = (v) => PADDING + v * scale;
        const ty = (v) => PADDING + v * scale;

        const ROOM_COLORS = [
          "#3b82f620",
          "#10b98120",
          "#f59e0b20",
          "#ef444420",
          "#8b5cf620",
          "#06b6d420",
        ];
        const ROOM_BORDERS = [
          "#3b82f6",
          "#10b981",
          "#f59e0b",
          "#ef4444",
          "#8b5cf6",
          "#06b6d4",
        ];

        return h(
          "svg",
          {
            ref: svgRef,
            viewBox: `0 0 ${dims.w} ${dims.h}`,
            className: `${className} bg-panel rounded-lg border border-border`,
            style: { maxHeight: 500 },
          },
          // Grid
          ...Array.from({ length: Math.ceil(fw) + 1 }, (_, i) =>
            h("line", {
              key: `gx${i}`,
              x1: tx(i),
              y1: ty(0),
              x2: tx(i),
              y2: ty(fh),
              stroke: "#e5e7eb",
              strokeWidth: 0.5,
            }),
          ),
          ...Array.from({ length: Math.ceil(fh) + 1 }, (_, i) =>
            h("line", {
              key: `gy${i}`,
              x1: tx(0),
              y1: ty(i),
              x2: tx(fw),
              y2: ty(i),
              stroke: "#e5e7eb",
              strokeWidth: 0.5,
            }),
          ),
          // Floor boundary
          h("rect", {
            x: tx(0),
            y: ty(0),
            width: fw * scale,
            height: fh * scale,
            fill: "none",
            stroke: "#374151",
            strokeWidth: 2,
            strokeDasharray: "6,3",
          }),
          // Axis labels
          h(
            "text",
            {
              x: tx(fw / 2),
              y: dims.h - 8,
              textAnchor: "middle",
              className: "text-[10px] fill-gray-400",
            },
            `${fw}m`,
          ),
          h(
            "text",
            {
              x: 10,
              y: ty(fh / 2),
              textAnchor: "middle",
              className: "text-[10px] fill-gray-400",
              transform: `rotate(-90, 10, ${ty(fh / 2)})`,
            },
            `${fh}m`,
          ),
          // Rooms
          ...rooms.map((r, i) => {
            const poly = r.polygon;
            if (!poly || poly.length < 3) return null;
            const points = poly.map((p) => `${tx(p[0])},${ty(p[1])}`).join(" ");
            const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length;
            const cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
            return h(
              "g",
              { key: `room-${i}` },
              h("polygon", {
                points,
                fill: ROOM_COLORS[i % ROOM_COLORS.length],
                stroke: ROOM_BORDERS[i % ROOM_BORDERS.length],
                strokeWidth: 1.5,
              }),
              h(
                "text",
                {
                  x: tx(cx),
                  y: ty(cy),
                  textAnchor: "middle",
                  dominantBaseline: "central",
                  className: "text-[11px] font-medium",
                  fill: ROOM_BORDERS[i % ROOM_BORDERS.length],
                },
                r.name,
              ),
            );
          }),
          // Fingerprint grid overlay (Map View toggle)
          ...(showFpGrid
            ? rooms.map((r, ri) => {
                const poly = r.polygon;
                if (!poly || poly.length < 3) return null;
                const gs = r.grid_size_override || gridSize;
                const xs = poly.map((p) => p[0]),
                  ys = poly.map((p) => p[1]);
                const minX = Math.floor(Math.min(...xs) / gs) * gs;
                const maxX = Math.ceil(Math.max(...xs) / gs) * gs;
                const minY = Math.floor(Math.min(...ys) / gs) * gs;
                const maxY = Math.ceil(Math.max(...ys) / gs) * gs;
                function pipArr(px, py, verts) {
                  let inside = false;
                  for (
                    let i = 0, j = verts.length - 1;
                    i < verts.length;
                    j = i++
                  ) {
                    const xi = verts[i][0],
                      yi = verts[i][1],
                      xj = verts[j][0],
                      yj = verts[j][1];
                    if (
                      yi > py !== yj > py &&
                      px < ((xj - xi) * (py - yi)) / (yj - yi) + xi
                    )
                      inside = !inside;
                  }
                  return inside;
                }
                const cells = [];
                for (let gx = minX; gx < maxX; gx += gs) {
                  for (let gy = minY; gy < maxY; gy += gs) {
                    const cx = gx + gs / 2,
                      cy = gy + gs / 2;
                    if (pipArr(cx, cy, poly)) {
                      cells.push(
                        h("rect", {
                          key: `gc${ri}-${gx}-${gy}`,
                          x: tx(gx),
                          y: ty(gy),
                          width: gs * scale,
                          height: gs * scale,
                          fill: "none",
                          stroke: "#8b5cf680",
                          strokeWidth: 0.7,
                          strokeDasharray: "2,2",
                        }),
                      );
                      cells.push(
                        h("circle", {
                          key: `gd${ri}-${gx}-${gy}`,
                          cx: tx(cx),
                          cy: ty(cy),
                          r: 2,
                          fill: "#8b5cf660",
                        }),
                      );
                    }
                  }
                }
                return h("g", { key: `fpg-${ri}` }, ...cells);
              })
            : []),
          // Anchors
          ...anchors.map((a, i) =>
            h(
              "g",
              { key: `anchor-${i}` },
              h("rect", {
                x: tx(a.x_m) - 8,
                y: ty(a.y_m) - 8,
                width: 16,
                height: 16,
                rx: 3,
                fill: "#1e40af",
                stroke: "#fff",
                strokeWidth: 2,
              }),
              h(
                "text",
                {
                  x: tx(a.x_m),
                  y: ty(a.y_m),
                  textAnchor: "middle",
                  dominantBaseline: "central",
                  className: "text-[8px] font-bold",
                  fill: "#fff",
                },
                (a.anchor_id || "")
                  .replace("AP", "")
                  .replace("ESP_", "E")
                  .slice(0, 2),
              ),
              h(
                "text",
                {
                  x: tx(a.x_m),
                  y: ty(a.y_m) + 18,
                  textAnchor: "middle",
                  className: "text-[9px]",
                  fill: "#6b7280",
                },
                a.anchor_id,
              ),
            ),
          ),
          // Devices
          ...devices.map((d, i) =>
            h(
              "g",
              { key: `dev-${i}` },
              h("circle", {
                cx: tx(d.x || 0),
                cy: ty(d.y || 0),
                r: 10,
                fill: d.reachable ? "#10b981" : "#9ca3af",
                stroke: "#fff",
                strokeWidth: 2.5,
              }),
              h("circle", {
                cx: tx(d.x || 0),
                cy: ty(d.y || 0),
                r: 16,
                fill: "none",
                stroke: d.reachable ? "#10b98140" : "none",
                strokeWidth: 2,
                className: d.reachable ? "pulse-dot" : "",

              h(

                  textAnchor: "middle",
                  className: "text-[9px] font-medium",
                  fill: "#374151",
                },

      function MapView() {
        const { data: mapData, error: mapError } = usePolling(
          () => engine.map(),
          3000,
        );
        const [selectedCampus, setSelectedCampus] = useState(null);
        const [selectedBuilding, setSelectedBuilding] = useState(null);
        const [selectedFloor, setSelectedFloor] = useState(null);
        const [platformRooms, setPlatformRooms] = useState([]);
        const [platformAnchors, setPlatformAnchors] = useState([]);
        const [showFpGrid, setShowFpGrid] = useState(false);
        const [floorGridSize, setFloorGridSize] = useState(1.0);

        // Load hierarchy from platform
        const { data: campuses } = useApi(() => platform.listCampuses());

        useEffect(() => {
          if (campuses?.length && !selectedCampus)
            setSelectedCampus(campuses[0]);
        }, [campuses]);

        const { data: buildings } = useApi(
          () =>
            selectedCampus
              ? platform.listBuildings(selectedCampus.id)
              : Promise.resolve([]),
          [selectedCampus?.id],
        );
        useEffect(() => {
          if (buildings?.length && !selectedBuilding)
            setSelectedBuilding(buildings[0]);
        }, [buildings]);

        const { data: floors } = useApi(
          () =>
            selectedBuilding
              ? platform.listFloors(selectedBuilding.id)
              : Promise.resolve([]),
          [selectedBuilding?.id],
        );
        useEffect(() => {
          if (floors?.length && !selectedFloor) setSelectedFloor(floors[0]);
        }, [floors]);

        // Load rooms + anchors for selected floor
        useEffect(() => {
          if (!selectedFloor) return;
          platform
            .listRooms(selectedFloor.id)
            .then((r) => setPlatformRooms(r || []))
            .catch(() => {});
          platform
            .listAnchors(selectedFloor.id)
            .then((a) => setPlatformAnchors(a || []))
            .catch(() => {});
          setFloorGridSize(selectedFloor.default_grid_size_m || 1.0);
        }, [selectedFloor?.id]);

        // Merge: prefer platform data, fallback to engine
        const rooms =
          platformRooms.length > 0 ? platformRooms : mapData?.rooms || [];
        const anchors = platformAnchors;
        const devices = mapData?.devices || [];
        const floorW = selectedFloor?.width_m || mapData?.floor?.width_m || 20;
        const floorH =
          selectedFloor?.height_m || mapData?.floor?.height_m || 15;

        return h(
          "div",
          { className: "fade-in" },
          h(
            "div",
            { className: "flex items-center justify-between mb-6" },
            h(
              "div",
              null,
              h(
                "h1",
                { className: "text-2xl font-semibold text-ink" },
                "Map View",
              ),
              h(
                "p",
                { className: "text-muted text-sm mt-1" },
                "Real-time floor plan with device tracking",
              ),
            ),
            mapError && h(Badge, { color: "red" }, "Engine offline"),
          ),
          // Floor selector
          h(
            "div",
            { className: "flex items-center gap-3 mb-4 flex-wrap" },
            campuses?.length > 1 &&
              h(Select, {
                value: selectedCampus?.id || "",
                onChange: (v) =>
                  setSelectedCampus(campuses.find((c) => c.id == v)),
                options: (campuses || []).map((c) => ({
                  value: c.id,
                  label: c.name,
                })),
                className: "w-48",
              }),
            buildings?.length > 1 &&
              h(Select, {
                value: selectedBuilding?.id || "",
                onChange: (v) =>
                  setSelectedBuilding(buildings.find((b) => b.id == v)),
                options: (buildings || []).map((b) => ({
                  value: b.id,
                  label: b.name,
                })),
                className: "w-48",
              }),
            floors?.length > 0 &&
              h(
                "div",
                { className: "flex gap-1" },
                floors.map((f) =>
                  h(
                    "button",
                    {
                      key: f.id,
                      onClick: () => setSelectedFloor(f),
                      className: `px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                        selectedFloor?.id === f.id
                          ? "bg-accent text-white"
                          : "bg-surface-dim text-ink-secondary hover:text-ink hover:bg-panel border border-transparent hover:border-border"
                      }`,
                    },
                    f.name,
                  ),
                ),
              ),
            // Fingerprint Grid toggle
            h(
              "label",
              {
                className:
                  "flex items-center gap-2 text-sm text-ink-secondary cursor-pointer ml-auto",
              },
              h("input", {
                type: "checkbox",
                checked: showFpGrid,
                onChange: (e) => setShowFpGrid(e.target.checked),
                className: "rounded",
              }),
              "Fingerprint Grid",
            ),
          ),
          // Map canvas
          h(
            Card,
            { className: "mb-6" },
            !rooms.length && !devices.length && !anchors.length
              ? h(EmptyState, {
                  icon: "\uD83D\uDDFA\uFE0F",
                  title: "No floor data yet",
                  description:
                    "Use the Setup Wizard to create rooms and place anchors, or start the engine to see live data",
                })
              : h(FloorCanvas, {
                  width: floorW,
                  height: floorH,
                  rooms,
                  anchors,
                  devices,
                  showFpGrid,
                  gridSize: floorGridSize,
                }),
          ),
          // Device summary cards
          devices.length > 0 &&
            h(
              "div",
              {
                className:
                  "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4",

                  h(

                    { className: "flex items-center justify-between mb-2" },
                    h(
                      "span",
                      { className: "font-medium text-sm" },
                      d.device_id,
                    ),
                    h(StatusDot, {
                      status: d.reachable ? "online" : "offline",
                    }),
                  ),
                  h(
                    "div",
                    { className: "text-xs text-muted space-y-1" },
                    d.room_id && h("div", null, `Room: ${d.room_id}`),
                    d.x != null &&

                      h(
                        "div",
                        { className: "font-mono" },
                        `(${Number(d.x).toFixed(1)}, ${Number(d.y).toFixed(1)})m`,
                      ),
                    d.timestamp &&
                      h(
                        "div",
                        null,
                        new Date(d.timestamp).toLocaleTimeString(),

            ),
        );
      }

        const { data, loading, error, reload } = useApi(() =>
          platform.listAllAnchors(),
        );
        const [filter, setFilter] = useState("");
        const [statusFilter, setStatusFilter] = useState("");
        const [showRegister, setShowRegister] = useState(false);
        const [editId, setEditId] = useState(null); // anchor.id being edited
        const [editData, setEditData] = useState({});
        const [saving, setSaving] = useState(false);

        // Registration form state
        const [form, setForm] = useState({
          anchor_id: "",
          anchor_type: "engenius_ap",
          ip_address: "",
          mac_address: "",
          brand: "",
          model: "",
          device_status: "in_stock",
          flags: [],
          username: "admin",
          password: "admin",
        });
        const [registering, setRegistering] = useState(false);

        const handleRegister = async () => {
          if (!form.anchor_id.trim()) return;
          setRegistering(true);
          try {
            await platform.registerAnchor({
              ...form,
              anchor_id: form.anchor_id.trim(),
            });
            setForm({
              anchor_id: "",
              anchor_type: "engenius_ap",
              ip_address: "",
              mac_address: "",
              brand: "",
              model: "",
              device_status: "in_stock",
              flags: [],
              username: "admin",
              password: "admin",
            });
            setShowRegister(false);
            reload();
          } catch (e) {
            alert(e.message);
          } finally {
            setRegistering(false);
          }
        };

        const startEdit = (a) => {
          setEditId(a.id);
          setEditData({
            device_status: a.device_status || "in_stock",
            flags: a.flags || [],
          });
        };
        const cancelEdit = () => {
          setEditId(null);
          setEditData({});
        };
        const saveEdit = async (a) => {
          setSaving(true);
          try {
            await platform.updateAnchor(a.id, editData);
            setEditId(null);
            reload();
          } catch (e) {
            alert(e.message);
          } finally {
            setSaving(false);

            await platform.deleteAnchor(a.id);

            alert(e.message);

          desc: "Distance-based positioning using RSSI path-loss model. Runs every scan cycle as a preview.",
        },
        fingerprinting: {
          label: "Fingerprinting",

        ble: {
          label: "BLE",
          color: "green",
          desc: "Bluetooth Low Energy proximity. Requires BLE-capable anchors (stub — not yet active).",

        },

      // Renders an SVG map of rooms + device dots — used at both small and expanded sizes
      function MethodMapSvg({ rooms, devices, fw, fh, width, height }) {
        const sx = width / (fw || 20),
          sy = height / (fh || 20);
        return h(
          "svg",
          {
            width,
            height,
            viewBox: `0 0 ${width} ${height}`,
            style: {
              background: "#18181b",
              display: "block",
              width: "100%",
              height: "100%",
            },
            preserveAspectRatio: "xMidYMid meet",
          },
          rooms.map((r, ri) =>
            r.polygon?.length
              ? h("polygon", {
                  key: ri,
                  points: r.polygon
                    .map(([px, py]) => `${px * sx},${py * sy}`)
                    .join(" "),
                  fill: "rgba(99,102,241,0.15)",
                  stroke: "#6366f1",
                  strokeWidth: 1,
                })
              : null,
          ),
          rooms.map((r, ri) => {
            if (!r.polygon?.length) return null;
            const cx =
              r.polygon.reduce((s, [px]) => s + px, 0) / r.polygon.length;
            const cy =
              r.polygon.reduce((s, [, py]) => s + py, 0) / r.polygon.length;
            const fontSize = width > 400 ? 13 : 9;
            return h(
              "text",
              {
                key: `lbl-${ri}`,
                x: cx * sx,
                y: cy * sy,
                textAnchor: "middle",
                dominantBaseline: "middle",
                fill: "#a5b4fc",
                fontSize,
              },
              r.name,
            );
          }),
          devices.map((d, di) => {
            const r = width > 400 ? 10 : 6;
            const fs = width > 400 ? 11 : 8;
            return h(
              "g",
              { key: di },
              h("circle", {
                cx: (d.x || 0) * sx,
                cy: (d.y || 0) * sy,
                r,
                fill: d.reachable ? "#22c55e" : "#f87171",
                stroke: "#fff",
                strokeWidth: 1,

              h(

        const devices = data?.devices || [];
        const floor = data?.floor || {};
        const mi = METHOD_INFO[method] || {};

        return h(
          "div",

            style: {
              background: "rgba(0,0,0,0.6)",

            },
            onClick: (e) => {
              if (e.target === e.currentTarget) onClose();
            },
          },
          h(
            "div",
            {
              className:
                "bg-panel border border-border rounded-xl shadow-2xl overflow-hidden",
              style: {
                width: "80vw",
                maxWidth: 900,
                height: "70vh",
                maxHeight: 650,
              },
            },
            // Header
            h(
              "div",
              {
                className:
                  "flex items-center justify-between px-5 py-3 border-b border-border bg-surface-dim",
              },
              h(
                "div",
                { className: "flex items-center gap-3" },
                h(Badge, { color: mi.color || "gray" }, mi.label || method),

                  "span",
                  { className: "text-sm text-muted" },

              h(

            // Map

                height: 500,

            // Device list footer

      // Try pywebview native window first, fall back to in-app overlay
      function _popOutMap(method) {

        // Browser dev mode fallback — use in-app overlay
        //fallbackExpand && fallbackExpand(method);
        //}

        const { data } = usePolling(
          () => engine.map(method).catch(() => null),
          2000,
        );
        const rooms = data?.rooms || [];
        const devices = data?.devices || [];
        const floor = data?.floor || {};
        const mi = METHOD_INFO[method] || {};

        return h(
          "div",
          {
            className:
              "border border-border rounded-lg overflow-hidden bg-panel",
          },
          h(
            "div",
            {
              className:
                "flex items-center justify-between px-3 py-2 border-b border-border bg-surface-dim",
            },
            h(
              "div",
              { className: "flex items-center gap-2" },
              h(Badge, { color: mi.color || "gray" }, mi.label || method),
              h(
                "span",
                { className: "text-xs text-muted" },
                `${devices.length} device(s)`,

            h(

              {

          h(MethodMapSvg, {
            rooms,
            devices,
            fw: floor.width_m || 20,
            fh: floor.height_m || 20,
            width: 260,
            height: 180,
          }),
        );
      }

      function LocalizationPage() {
        const [pollInterval, setPollInterval] = useState(1.5);
        const [testingMode, setTestingMode] = useState(false);
        const [selectedMethods, setSelectedMethods] = useState([
          "trilateration",
        ]);
        const [starting, setStarting] = useState(false);
        const [stopping, setStopping] = useState(false);
        const [msg, setMsg] = useState(null);
        const [selectedCampusId, setSelectedCampusId] = useState(null);
        const [expandedMethod, setExpandedMethod] = useState(null);
        const [logLevelFilter, setLogLevelFilter] = useState("");

        const { data: campuses } = useApi(() => platform.listCampuses());
        useEffect(() => {
          if (campuses?.length && !selectedCampusId)
            setSelectedCampusId(campuses[0].id);
        }, [campuses]);

        const { data: engStatus } = usePolling(
          () => engine.status().catch(() => null),
          3000,
        );
        const { data: engHealth } = usePolling(
          () => engine.health().catch(() => null),
          3000,
        );
        const { data: logsData } = usePolling(
          () =>
            platform.listEngineLogs({
              limit: 100,
              level: logLevelFilter || undefined,
            }),
          4000,
          [logLevelFilter],
        );

        const isRunning = engHealth?.poll_running === true;
        const logs = logsData || [];

        const LEVEL_STYLE = {
          info: "text-emerald-600",
          warn: "text-amber-600",
          alert: "text-orange-600",
          config: "text-sky-600",
          security: "text-red-600",
        };
        const LEVEL_BG = {
          info: "bg-emerald-50/60",
          warn: "bg-amber-50",
          alert: "bg-orange-50",
          config: "bg-sky-50",
          security: "bg-red-50",
        };

        const toggleMethod = (m) =>
          setSelectedMethods((prev) =>
            prev.includes(m) ? prev.filter((x) => x !== m) : [...prev, m],
          );

        const handleStart = async () => {
          if (!selectedCampusId) {
            setMsg({ ok: false, text: "Select a campus first." });
            return;
          }
          setStarting(true);
          setMsg(null);
          try {
            await platform.startEngine({
              campus_id: selectedCampusId,
              poll_interval_s: pollInterval,
              testing_mode: testingMode,
              methods: selectedMethods.join(","),
            });
            setMsg({ ok: true, text: "Engine start requested." });
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setStarting(false);
          }
        };

        const handleStop = async () => {
          setStopping(true);
          setMsg(null);
          try {
            await platform.stopEngine();
            setMsg({ ok: true, text: "Engine stopped." });
          } catch (e) {
            setMsg({ ok: false, text: e.message });
          } finally {
            setStopping(false);
          }
        };

        return h(
          "div",
          { className: "fade-in space-y-6" },
          // Header
          h(
            "div",
            null,
            h(
              "h1",
              { className: "text-2xl font-semibold text-ink" },
              "Localization",
            ),
            h(
              "p",
              { className: "text-muted text-sm mt-1" },
              "Configure and monitor the Hybrid localization engine",
            ),
          ),

          // Status bar
          h(
            Card,
            null,
            h(
              "div",
              {
                className: "flex items-center justify-between flex-wrap gap-4",
              },
              h(
                "div",
                { className: "flex items-center gap-4" },
                h(
                  "div",
                  { className: "flex items-center gap-2" },
                  h(StatusDot, {
                    status: engHealth?.ok ? "online" : "offline",
                  }),
                  h(
                    "span",
                    { className: "text-sm font-medium" },
                    engHealth?.ok ? "Engine online" : "Engine offline",
                  ),
                ),
                isRunning &&
                  h(
                    "div",
                    { className: "flex items-center gap-2" },
                    h(StatusDot, { status: "polling" }),
                    h(
                      "span",
                      { className: "text-sm text-muted" },
                      "Polling active",
                    ),
                  ),
                engStatus &&
                  h(
                    "div",
                    { className: "text-xs text-muted" },
                    `${engStatus.total_decisions || 0} verdicts  ·  last: ${engStatus.last_device_id || "—"}`,
                  ),
              ),
              h(
                "div",
                { className: "flex gap-2" },
                h(
                  Button,
                  {
                    variant: isRunning ? "ghost" : "primary",
                    size: "sm",
                    disabled: starting || isRunning,
                    onClick: handleStart,
                  },
                  starting ? "Starting…" : "▶ Start",
                ),
                h(
                  Button,
                  {
                    variant: "danger",
                    size: "sm",
                    disabled: stopping || !isRunning,
                    onClick: handleStop,
                  },
                  stopping ? "Stopping…" : "■ Stop",
                ),
              ),
            ),
            msg &&
              h(
                "div",
                {
                  className: `mt-3 text-sm px-3 py-2 rounded ${msg.ok ? "bg-emerald-50 text-emerald-800" : "bg-red-50 text-red-800"}`,
                },
                msg.text,
              ),
          ),

          // Settings + method selection
          h(
            "div",
            { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
            // Settings panel
            h(
              Card,
              { title: "Engine Settings" },
              h(
                "div",
                { className: "space-y-4" },
                h(
                  "div",
                  null,
                  h(
                    "label",
                    { className: "block text-xs font-medium text-muted mb-1" },
                    "Campus",
                  ),
                  h(
                    "select",
                    {
                      value: selectedCampusId || "",
                      onChange: (e) => setSelectedCampusId(+e.target.value),
                      className:
                        "w-full border border-border rounded px-2 py-1.5 text-sm bg-surface",
                    },
                    (campuses || []).map((c) =>
                      h("option", { key: c.id, value: c.id }, c.name),
                    ),
                  ),
                ),
                h(
                  "div",
                  null,
                  h(
                    "label",
                    { className: "block text-xs font-medium text-muted mb-1" },
                    `Poll Interval: ${pollInterval}s`,
                  ),
                  h("input", {
                    type: "range",
                    min: 0.5,
                    max: 5,
                    step: 0.5,
                    value: pollInterval,
                    onChange: (e) => setPollInterval(+e.target.value),
                    className: "w-full accent-accent",
                  }),
                  h(
                    "div",
                    {
                      className: "flex justify-between text-xs text-muted mt-1",
                    },
                    h("span", null, "0.5s (fast)"),
                    h("span", null, "5s (slow)"),
                  ),
                ),
                h(
                  "div",
                  { className: "flex items-start gap-3" },
                  h("input", {
                    type: "checkbox",
                    id: "testingMode",
                    checked: testingMode,
                    onChange: (e) => setTestingMode(e.target.checked),
                    className: "mt-0.5",
                  }),
                  h(
                    "label",
                    { htmlFor: "testingMode", className: "cursor-pointer" },
                    h(
                      "div",
                      { className: "text-sm font-medium" },
                      "Testing Mode",
                    ),
                    h(
                      "div",
                      { className: "text-xs text-muted" },
                      "Accept scans with only 1 AP visible (useful when not all APs are deployed)",
                    ),
                  ),
                ),
              ),
            ),

            // Method selection
            h(
              Card,
              { title: "Localization Methods" },
              h(
                "div",
                { className: "space-y-3" },
                Object.entries(METHOD_INFO).map(([key, info]) =>
                  h(
                    "div",
                    {
                      key,
                      className: `flex items-start gap-3 p-3 rounded-lg border transition-colors cursor-pointer ${
                        selectedMethods.includes(key)
                          ? "border-accent bg-accent/5"
                          : "border-border hover:border-border/80"
                      }`,
                      onClick: () => toggleMethod(key),
                    },
                    h("input", {
                      type: "checkbox",
                      checked: selectedMethods.includes(key),
                      onChange: () => toggleMethod(key),
                      className: "mt-0.5",
                    }),
                    h(
                      "div",
                      null,
                      h(
                        "div",
                        { className: "flex items-center gap-2 mb-0.5" },
                        h(
                          "span",
                          { className: "text-sm font-medium" },
                          info.label,
                        ),
                        h(Badge, { color: info.color }, key),
                      ),
                      h("div", { className: "text-xs text-muted" }, info.desc),
                    ),
                  ),
                ),
              ),
            ),
          ),

          // Expanded map overlay
          expandedMethod &&
            h(ExpandedMapOverlay, {
              method: expandedMethod,
              onClose: () => setExpandedMethod(null),
            }),

          // Per-method maps
          h(
            Card,
            { title: "Live Maps" },
            h(
              "div",
              {
                className:
                  "grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4",
              },
              Object.keys(METHOD_INFO).map((m) =>
                h(MethodMapPanel, {
                  key: m,
                  method: m,
                  onExpand: setExpandedMethod,
                }),
              ),
            ),
          ),

          // Live engine log stream
          h(
            Card,
            {
              title: "Engine Log Stream",
              actions: h(
                "div",
                { className: "flex gap-2 items-center" },
                h(
                  "select",
                  {
                    value: logLevelFilter,
                    onChange: (e) => setLogLevelFilter(e.target.value),
                    className:
                      "text-xs border border-border rounded px-2 py-1 bg-surface",
                  },
                  h("option", { value: "" }, "All levels"),
                  ["info", "warn", "alert", "config", "security"].map((l) =>
                    h("option", { key: l, value: l }, l.toUpperCase()),
                  ),
                ),
                h(
                  Button,
                  {
                    variant: "ghost",
                    size: "sm",
                    onClick: () => platform.clearEngineLogs().catch(() => {}),
                  },
                  "Clear All",
                ),
              ),
            },
            logs.length === 0
              ? h(EmptyState, {
                  icon: "📋",
                  title: "No engine log entries",
                  description:
                    "Logs are generated by the connectivity poller and scope checker as the engine runs",
                })
              : h(
                  "div",
                  { className: "max-h-96 overflow-y-auto" },
                  h(
                    "div",
                    { className: "space-y-0.5 font-mono text-xs" },
                    logs.map((l) =>
                      h(
                        "div",
                        {
                          key: l.id,
                          className: `flex gap-3 px-3 py-1.5 rounded items-start ${LEVEL_BG[l.level] || "hover:bg-surface-dim"}`,
                        },
                        h(
                          "span",
                          {
                            className: "text-muted whitespace-nowrap shrink-0",
                          },
                          new Date(l.timestamp).toLocaleTimeString(),
                        ),
                        h(
                          "span",
                          {
                            className: `w-14 shrink-0 font-bold ${LEVEL_STYLE[l.level] || "text-gray-400"}`,
                          },
                          (l.level || "info").toUpperCase(),
                        ),
                        h(
                          "span",
                          { className: "text-gray-600 shrink-0 w-20 truncate" },
                          l.source || "",
                        ),
                        l.tag_id &&
                          h(
                            "span",
                            {
                              className: "text-indigo-700 shrink-0 font-medium",
                            },
                            l.tag_id,
                          ),
                        h(
                          "span",
                          { className: "text-gray-800 flex-1 break-all" },
                          l.message,
                        ),
                        !l.acknowledged &&
                          h(
                            "button",
                            {
                              className:
                                "shrink-0 text-muted hover:text-ink text-xs border border-border rounded px-1.5 py-0.5",
                              onClick: () =>
                                platform
                                  .ackEngineLog(l.id, "admin")
                                  .catch(() => {}),
                            },
                            "ack",
                          ),
                      ),
                    ),
                  ),
                ),
          ),
        );
      }

      // ═════════════════════════════════════════════════════════════════════
      // PAGE: LOGS
      // ═════════════════════════════════════════════════════════════════════

      const LOG_LEVEL_TABS = [
        { id: "all", label: "All", color: "bg-gray-500" },
        { id: "info", label: "Info", color: "bg-emerald-500" },
        { id: "warn", label: "Warn", color: "bg-amber-500" },
        { id: "alert", label: "Alert", color: "bg-orange-500" },
        { id: "config", label: "Config", color: "bg-sky-500" },
        { id: "security", label: "Security", color: "bg-red-500" },
        {
          id: "system",
          label: "System",
          color: "bg-violet-500",
          isSource: true,
        },
      ];

      function LogsPage() {
        const [tab, setTab] = useState("all");
        const activeTab = LOG_LEVEL_TABS.find((t) => t.id === tab) || {};
        const {
          data: logsData,
          loading,
          error,
          reload,
        } = usePolling(
          () =>
            platform.listEngineLogs({
              limit: 200,
              level: activeTab.isSource
                ? undefined
                : tab === "all"
                  ? undefined
                  : tab,
              source: activeTab.isSource ? "system" : undefined,
            }),
          4000,
          [tab],
        );
        const logs = logsData || [];

        const LEVEL_STYLE = {
          info: "text-emerald-700 font-medium",
          warn: "text-amber-700 font-semibold",
          alert: "text-orange-700 font-semibold",
          config: "text-sky-700 font-semibold",
          security: "text-red-700 font-bold",
        };
        const LEVEL_BG = {
          info: "bg-emerald-50/60 hover:bg-emerald-50",
          warn: "bg-amber-50 hover:bg-amber-100",
          alert: "bg-orange-50 hover:bg-orange-100",
          config: "bg-sky-50 hover:bg-sky-100",
          security: "bg-red-50 hover:bg-red-100",
        };

        return h(
          "div",
          { className: "fade-in" },
          h(
            "div",
            { className: "mb-6" },
            h(
              "h1",
              { className: "text-2xl font-semibold text-ink" },
              "Event Logs",
            ),
            h(
              "p",
              { className: "text-muted text-sm mt-1" },
              "Engine logs from connectivity, scope violations, and localization decisions",
            ),
          ),
          // Level tabs
          h(
            "div",
            { className: "flex gap-1.5 mb-6 flex-wrap" },
            LOG_LEVEL_TABS.map((t) =>
              h(
                "button",
                {
                  key: t.id,
                  onClick: () => setTab(t.id),
                  className: `flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                    tab === t.id
                      ? "bg-accent text-white"
                      : "bg-surface-dim text-ink-secondary hover:text-ink hover:bg-panel border border-transparent hover:border-border"
                  }`,
                },
                h("span", { className: `w-2 h-2 rounded-full ${t.color}` }),
                t.label,
              ),
            ),
          ),
          // Actions bar
          h(
            "div",
            { className: "flex items-center justify-between mb-4" },
            h(
              "span",
              { className: "text-sm text-muted" },
              `${logs.length} entries${tab !== "all" ? ` (${tab})` : ""}`,
            ),
            h(
              "div",
              { className: "flex gap-2" },
              h(
                Button,
                {
                  variant: "ghost",
                  size: "sm",
                  onClick: () => platform.clearEngineLogs().catch(() => {}),
                },
                "Clear All",
              ),
              h(
                Button,
                {
                  variant: "ghost",
                  size: "sm",
                  onClick: () => platform.clearEngineLogs(24).catch(() => {}),
                },
                "Clear >24h",
              ),
            ),
          ),
          // Log entries
          error
            ? h(ErrorBanner, {
                message: `Could not load logs: ${error}`,
                onRetry: reload,
              })
            : logs.length === 0
              ? h(EmptyState, {
                  icon: "📋",
                  title:
                    tab === "all" ? "No log entries yet" : `No ${tab} entries`,
                  description:
                    "Logs appear when the engine runs, connectivity is polled, or scope violations occur",
                })
              : h(
                  Card,
                  null,
                  h(
                    "div",
                    { className: "max-h-[600px] overflow-y-auto" },
                    h(
                      "div",
                      { className: "space-y-0.5 font-mono text-xs" },
                      logs.map((l) =>
                        h(
                          "div",
                          {
                            key: l.id,
                            className: `flex gap-3 px-3 py-1.5 rounded items-start ${LEVEL_BG[l.level] || "hover:bg-surface-dim"}`,
                          },
                          h(
                            "span",
                            {
                              className:
                                "text-muted whitespace-nowrap shrink-0",
                            },
                            new Date(l.timestamp).toLocaleTimeString(),
                          ),
                          h(
                            "span",
                            {
                              className: `w-16 shrink-0 ${LEVEL_STYLE[l.level] || "text-gray-400"}`,
                            },
                            (l.level || "").toUpperCase(),
                          ),
                          h(
                            "span",
                            {
                              className: "text-gray-600 shrink-0 w-24 truncate",
                            },
                            l.source || "",
                          ),
                          l.tag_id &&
                            h(
                              "span",
                              {
                                className:
                                  "text-indigo-700 shrink-0 font-medium mr-1",
                              },
                              l.tag_id,
                            ),
                          h(
                            "span",
                            { className: "text-gray-800 flex-1 break-all" },
                            l.message,
                          ),
                          !l.acknowledged &&
                            h(
                              "button",
                              {
                                className:
                                  "shrink-0 ml-2 text-xs text-muted border border-border rounded px-1.5 py-0.5 hover:text-ink",
                                onClick: () =>
                                  platform
                                    .ackEngineLog(l.id, "admin")
                                    .catch(() => {}),
                              },
                              "ack",
                            ),
                        ),
                      ),
                    ),
                  ),

          platform.listCrossings({ limit: 100 }),

        if (error) return h(ErrorBanner, { message: error, onRetry: reload });
        const items = data || [];
        return h(
          Card,
          {
            title: "Boundary Crossings",
            actions: h(
              Button,
              { variant: "ghost", size: "sm", onClick: reload },
              "Refresh",
            ),
          },
          items.length === 0
            ? h(EmptyState, {
                icon: "\uD83D\uDEB6",
                title: "No boundary crossings yet",
                description:
                  "Crossings appear when tracked devices move between rooms",
              })
            : h(
                "div",
                { className: "overflow-x-auto" },
                h(
                  "table",
                  { className: "w-full text-sm" },
                  h(
                    "thead",
                    null,
                    h(
                      "tr",
                      { className: "border-b border-border" },
                      ["Time", "Tag", "From", "To", "Method", "Confidence"].map(
                        (c) =>
                          h(
                            "th",
                            {
                              key: c,
                              className:
                                "text-left py-3 px-3 text-xs font-medium text-muted uppercase tracking-wider",
                            },
                            c,
                          ),
                      ),
                    ),
                  ),
                  h(
                    "tbody",
                    null,
                    items.map((c) =>
                      h(
                        "tr",
                        { key: c.id, className: "border-b border-surface-dim" },
                        h(
                          "td",
                          { className: "py-3 px-3 text-xs font-mono" },
                          new Date(c.timestamp).toLocaleString(),
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3 font-medium" },
                          c.tag_id,
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          c.previous_location || "\u2014",
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          c.new_location || "\u2014",
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          h(
                            Badge,
                            { color: "blue" },
                            c.localization_method || "rssi",
                          ),
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          h(
                            Badge,
                            {
                              color:
                                (c.confidence || 0) >= 0.7
                                  ? "green"
                                  : (c.confidence || 0) >= 0.4
                                    ? "yellow"
                                    : "red",
                            },
                            `${((c.confidence || 0) * 100).toFixed(0)}%`,
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              ),
        );
      }

      function AlertsTable() {
        const { data, loading, error, reload } = useApi(() =>
          platform.listAlerts({ limit: 100 }),
        );
        if (loading) return h(LoadingSpinner);
        if (error) return h(ErrorBanner, { message: error, onRetry: reload });
        const items = data || [];

        const handleAck = async (id) => {
          try {
            await platform.ackAlert(id, "admin");
            reload();
          } catch (e) {
            alert(e.message);
          }
        };

        return h(
          Card,
          {
            title: "Alerts",
            actions: h(
              Button,
              { variant: "ghost", size: "sm", onClick: reload },
              "Refresh",
            ),
          },
          items.length === 0
            ? h(EmptyState, {
                icon: "\uD83D\uDD14",
                title: "No alerts",
                description:
                  "Alerts fire when high-priority tags exit assigned rooms",
              })
            : h(
                "div",
                { className: "overflow-x-auto" },
                h(
                  "table",
                  { className: "w-full text-sm" },
                  h(
                    "thead",
                    null,
                    h(
                      "tr",
                      { className: "border-b border-border" },
                      [
                        "Time",
                        "Tag",
                        "Severity",
                        "Room",
                        "Exited To",
                        "Acknowledged",
                        "",
                      ].map((c) =>
                        h(
                          "th",
                          {
                            key: c,
                            className:
                              "text-left py-3 px-3 text-xs font-medium text-muted uppercase tracking-wider",
                          },
                          c,
                        ),
                      ),
                    ),
                  ),
                  h(
                    "tbody",
                    null,
                    items.map((a) =>
                      h(
                        "tr",
                        {
                          key: a.id,
                          className: `border-b border-surface-dim ${!a.acknowledged ? "bg-red-50/50" : ""}`,
                        },
                        h(
                          "td",
                          { className: "py-3 px-3 text-xs font-mono" },
                          new Date(a.timestamp).toLocaleString(),
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3 font-medium" },
                          a.tag_id,
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          h(
                            Badge,
                            { color: a.severity === "high" ? "red" : "yellow" },
                            a.severity,
                          ),
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          a.assigned_room || "\u2014",
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          a.exited_to || "\u2014",
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          a.acknowledged
                            ? h(
                                Badge,
                                { color: "green" },
                                `By ${a.acknowledged_by}`,
                              )
                            : h(Badge, { color: "red" }, "Unacknowledged"),
                        ),
                        h(
                          "td",
                          { className: "py-3 px-3" },
                          !a.acknowledged &&
                            h(
                              Button,
                              {
                                variant: "ghost",
                                size: "sm",
                                onClick: () => handleAck(a.id),
                              },
                              "Ack",
                            ),
                        ),
                      ),
                    ),
                  ),
                ),
              ),
        );
      }

      function EngineLogsTable() {
        const [levelFilter, setLevelFilter] = useState("");
        const { data, error, reload } = usePolling(
          () =>
            platform.listEngineLogs({
              limit: 200,
              level: levelFilter || undefined,
            }),
          5000,
        );
        if (error)
          return h(ErrorBanner, {
            message: `Could not load engine logs: ${error}`,
            onRetry: reload,
          });
        const items = data || [];

        const LEVEL_STYLE = {
          info: "text-emerald-700 font-medium",
          warn: "text-amber-700 font-semibold",
          alert: "text-orange-700 font-semibold",
          config: "text-sky-700 font-semibold",
          security: "text-red-700 font-bold",
        };
        const LEVEL_BG = {
          info: "bg-emerald-50/60 hover:bg-emerald-50",
          warn: "bg-amber-50 hover:bg-amber-100",
          alert: "bg-orange-50 hover:bg-orange-100",
          config: "bg-sky-50 hover:bg-sky-100",
          security: "bg-red-50 hover:bg-red-100",
        };

        return h(
          Card,
          {
            title: "Engine Logs",
            actions: h(
              "div",
              { className: "flex gap-2 items-center" },
              h(
                "select",
                {
                  value: levelFilter,
                  onChange: (e) => setLevelFilter(e.target.value),
                  className:
                    "text-xs border border-border rounded px-2 py-1 bg-surface",
                },
                h("option", { value: "" }, "All levels"),
                ["info", "warn", "alert", "config", "security"].map((l) =>
                  h("option", { key: l, value: l }, l.toUpperCase()),
                ),
              ),
              h(
                Button,
                {
                  variant: "ghost",
                  size: "sm",
                  onClick: () =>
                    platform
                      .clearEngineLogs(24)
                      .then(reload)
                      .catch(() => reload()),
                },
                "Clear >24h",
              ),
            ),
          },
          items.length === 0
            ? h(EmptyState, {
                icon: "\uD83D\uDCCB",
                title: "No engine log entries",
                description:
                  "Logs are generated by the connectivity poller and scope checker",
              })
            : h(
                "div",
                { className: "max-h-[500px] overflow-y-auto" },
                h(
                  "div",
                  { className: "space-y-0.5 font-mono text-xs" },
                  items.map((l) =>
                    h(
                      "div",
                      {
                        key: l.id,
                        className: `flex gap-3 px-3 py-1.5 rounded items-start ${LEVEL_BG[l.level] || "hover:bg-surface-dim"}`,
                      },
                      h(
                        "span",
                        { className: "text-muted whitespace-nowrap shrink-0" },
                        new Date(l.timestamp).toLocaleTimeString(),
                      ),
                      h(
                        "span",
                        {
                          className: `w-16 shrink-0 ${LEVEL_STYLE[l.level] || "text-gray-400"}`,
                        },
                        (l.level || "").toUpperCase(),
                      ),
                      h(
                        "span",
                        { className: "text-gray-500 w-20 shrink-0 truncate" },
                        l.source || "",
                      ),
                      l.tag_id &&
                        h(
                          "span",
                          { className: "text-indigo-600 shrink-0 mr-1" },
                          l.tag_id,
                        ),
                      h(
                        "span",
                        { className: "text-gray-800 flex-1 break-all" },
                        l.message,
                      ),
                      !l.acknowledged &&
                        h(
                          "button",
                          {
                            className:
                              "shrink-0 ml-2 text-xs text-muted border border-border rounded px-1.5 py-0.5 hover:text-ink",
                            onClick: () =>
                              platform
                                .ackEngineLog(l.id, "admin")
                                .then(reload)
                                .catch(() => {}),
                          },
                          "ack",
                        ),
                    ),
                  ),
                ),
              ),
        );
      }

      // ═════════════════════════════════════════════════════════════════════
      // APP ROOT
      // ═════════════════════════════════════════════════════════════════════

      function App() {
        const [page, setPage] = useState("wizard");
        const { data: engineHealth } = usePolling(
          () => engine.health().catch(() => null),
          5000,
        );

        return h(
          Layout,
          { page, setPage, engineHealth },
          page === "wizard" && h(SetupWizard),
          page === "localize" && h(LocalizationPage),
          page === "map" && h(MapView),
          page === "devices" && h(DeviceTables),
          page === "logs" && h(LogsPage),
        );
      }

      // ─── MOUNT ───────────────────────────────────────────────────────────
      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
