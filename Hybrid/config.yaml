system:
  localization_method: fingerprinting
  rolling_average_window: 5
  signal_filter:
    noise_floor_dbm: -80
    min_aps_for_localization: 3
  max_distance_for_high_confidence_m: 3.0
  boundary_clamp_margin_m: 0.01
  consensus_threshold: 0.8
  frame_window_minutes: 1
  testing_mode: true
  methods:
  - trilateration
  - kalman
telemetry_config:
  edge_campus_id: Carleton
  edge_building_id: Canal
  edge_floor_id: Floor4
  poll_interval_s: 1.5
  update_interval_s: 60
  prompts:
    main: eap350>
    sub: eap350/wless2/network>
  default_ap_credentials:
    username: admin
    password: admin
targets:
- ssid: ''
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
- ssid: Tag2
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
- ssid: Tag3
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
- ssid: Tag3
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
- ssid: Tag2
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
- ssid: Tag1
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
- ssid: Tag1
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
- ssid: Tag1
  radio_override:
    rssi_at_1m_dbm: -22.0
    path_loss_n: 4.0
locations:
  Carleton:
    buildings:
      Canal:
        floors:
          Floor4:
            width_m: 20.0
            height_m: 15.0
            wifi_aps:
              WAP7:
                host: 192.168.1.7
                x: 10.0
                y: 2.0
                username: admin
                password: admin
              WAP9:
                host: 192.168.1.115
                x: 3.0
                y: 7.0
                username: admin
                password: admin
              WAP8:
                host: 192.168.1.8
                x: 4.0
                y: 9.0
                username: admin
                password: admin
            tof_anchors: {}
            rooms:
              Room 1:
                center_x: 6.0
                center_y: 4.5
                polygon:
                - - 2
                  - 2
                - - 2
                  - 7
                - - 10
                  - 7
                - - 10
                  - 2
                priority_label: Standard
                localization_type: rssi_section
                alert_on_exit: false
mqtt:
  broker_host: localhost
  broker_port: 1883
  topic_prefix: capstone
  keepalive_s: 60
cloud:
  s3_key_template: '{campus}_{building}_{floor}_latest.json'
  s3_cache_control: max-age=2
  radiomap_path: radiomap_{campus}_{building}_{floor}.json
  csv_trilat_log_path: trilat_log.csv
  csv_finger_log_path: finger_log.csv
  csv_gp_log_path: gp_log.csv
  csv_ble_log_path: ble_log.csv
  csv_tof_log_path: tof_log.csv
